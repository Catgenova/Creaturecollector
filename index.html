/** Rare recolour: rotate the whole palette to a new harmony. */
function shinyPalette(pal, rng) {
  const rot = rng.range(140, 220);
  const out = {};
  for (const k of ['c1', 'c2', 'c3', 'eye']) {
    const [h, s, l] = pal[k];
    out[k] = [wrapHue(h + rot), clamp(s + 5, 8, 100), l].map((x) => Math.round(x * 10) / 10);
  }
  return out;
}

/** Blend two palettes colour by colour. t=0 -> a, t=1 -> b. Hues take the short way round. */
function blendColor(a, b, t) {
  let dh = wrapHue(b[0]) - wrapHue(a[0]);
  if (dh > 180) dh -= 360;
  if (dh < -180) dh += 360;
  return [wrapHue(a[0] + dh * t), a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t].map((x) => Math.round(x * 10) / 10);
}

function swatchCss([h, s, l]) { return hsl(h, s, l); }

// ---- src/data/parts/_dsl.js ----
// Tiny drawing DSL for creature parts.
//
// Every part is authored facing RIGHT in a local coordinate system whose origin
// (0,0) is the point that attaches to the parent's socket. Units are the same as
// the 200x200 creature canvas at scale 1.
//
// Fill roles (resolved to CSS variables at render time, remapped per slot by paint genes):
//   p / pd / pl   primary colour, its shade, its highlight
//   s / sd / sl   secondary colour family
//   a / ad / al   accent colour family
//   w / wd        white and its shade         e / ed   eye colour and its shade
//   k             outline/dark                none     no fill (stroke only)
//
// Options: op (opacity), ns (no outline stroke), sw (outline stroke width override).

const P = (d, f = 'p', o = {}) => ({ t: 'path', d, f, ...o });
const E = (cx, cy, rx, ry, f = 'p', o = {}) => ({ t: 'ellipse', cx, cy, rx, ry, f, ...o });
const C = (cx, cy, r, f = 'p', o = {}) => ({ t: 'circle', cx, cy, r, f, ...o });
/** Stroke-only path. f is the stroke role, w the stroke width. */
const L = (d, f = 'k', w = 3, o = {}) => ({ t: 'line', d, f, w, ...o });

/** Convenience for a "none" part in an optional slot. */
const NONE = (slot, dom = 0.35) => ({ id: `${slot}.none`, slot, name: 'None', none: true, dom, w: 1 });

// ---- src/data/parts/index.js ----
// Part registry. Part ids are stable forever: a saved creature must decode the
// same way after the library grows, so never rename or reuse an id.









const SLOTS = ['body', 'head', 'eyes', 'mouth', 'crown', 'legs', 'arms', 'wings', 'tail', 'back', 'pattern'];
const SLOT_NAMES = {
  body: 'Body', head: 'Head', eyes: 'Eyes', mouth: 'Mouth', crown: 'Crown', legs: 'Legs',
  arms: 'Arms', wings: 'Wings', tail: 'Tail', back: 'Back', pattern: 'Pattern',
};

const PARTS_BY_SLOT = {
  body: BODIES, head: HEADS, eyes: EYES, mouth: MOUTHS, crown: CROWNS, legs: LEGS,
  arms: ARMS, wings: WINGS, tail: TAILS, back: BACKS, pattern: PATTERNS,
};

const PARTS = new Map();
for (const slot of SLOTS) {
  for (const part of PARTS_BY_SLOT[slot]) {
    if (PARTS.has(part.id)) throw new Error(`duplicate part id ${part.id}`);
    if (part.slot !== slot) throw new Error(`part ${part.id} listed under slot ${slot} but declares ${part.slot}`);
    PARTS.set(part.id, part);
  }
}

function getPart(id) { return PARTS.get(id) || null; }

/** Does this part fit on a body of the given kind? Parts without a fit list fit everything. */
function partFits(part, bodyKind) {
  return !part || !part.fit || part.fit.includes(bodyKind);
}

/** All parts for a slot that fit the given body kind (includes the slot's "none" entry when it has one). */
function partsFor(slot, bodyKind) {
  return PARTS_BY_SLOT[slot].filter((p) => partFits(p, bodyKind));
}

function partCount() { return PARTS.size; }

// ---- src/creature/naming.js ----
// Names. Species carry hand-picked [prefix, suffix] halves; a fusion takes the
// prefix of the parent that gives its face and the suffix of the other one.

const VOWELS = 'aeiouy';

/** Join two name halves at a clean boundary. "Gla"+"ox" -> "Glox", "Puff"+"fin" -> "Puffin". */
function joinNameParts(prefix, suffix) {
  let p = String(prefix || '').trim(), s = String(suffix || '').trim();
  if (!p) return capitalize(s || 'Fusion');
  if (!s) return capitalize(p);
  const pl = p[p.length - 1].toLowerCase(), s0 = s[0].toLowerCase();
  if (pl === s0) p = p.slice(0, -1);
  else if (VOWELS.includes(pl) && VOWELS.includes(s0)) p = p.slice(0, -1);
  return capitalize((p + s).slice(0, 20));
}

/** Fallback split for names without authored halves: after the first vowel cluster and the consonants that follow it. */
function splitName(name) {
  const n = String(name || 'Fusion');
  const m = n.match(/^([^aeiouy]*[aeiouy]+[^aeiouy]+)(.+)$/i);
  if (m && m[2].length >= 2 && m[1].length >= 2) return [m[1], m[2].toLowerCase()];
  const cut = Math.ceil(n.length / 2);
  return [n.slice(0, cut), n.slice(cut).toLowerCase()];
}

function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

// ---- src/creature/genome.js ----
// The genome is the single source of truth for a creature. It is a plain JSON
// object with a fixed shape, so fusing two genomes always yields another valid
// genome and any creature can be shared as a code string.
//
// Diploid part genes: every slot holds [expressed, carried]. Only the expressed
// allele is drawn; the carried one can resurface in offspring.







const GENOME_VERSION = 1;
const CODE_PREFIX = 'CC1.';
const STAT_KEYS = ['hp', 'atk', 'def', 'spa', 'spd', 'spe'];
const STAT_NAMES = { hp: 'HP', atk: 'Attack', def: 'Defense', spa: 'Sp. Atk', spd: 'Sp. Def', spe: 'Speed' };
const TRAIT_KEYS = ['size', 'bulk', 'headScale', 'limbScale', 'tailScale', 'wingScale', 'eyeScale'];
const PAINT_SLOTS = ['body', 'head', 'crown', 'legs', 'arms', 'wings', 'tail', 'back'];
/** Role order [p, s, a] -> colour index into [c1, c2, c3]. */
const PAINT_PERMS = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];

/** Odds used when rolling a wild creature from its species. */
const ROLL = {
  carriedMutation: 0.1,   // hidden allele replaced by a random part
  expressedMutation: 0.03, // visible variant
  bodyCarriedMutation: 0.05,
  paintSwap: 0.12,        // a slot's colour roles get permuted
  shiny: 1 / 64,
};

function allelesFromRecipe(entry, slot) {
  if (Array.isArray(entry)) return [entry[0], entry[1] ?? entry[0]];
  if (typeof entry === 'string') return [entry, entry];
  return [`${slot}.none`, `${slot}.none`];
}

/** Random part id for a slot that fits the body kind, weighted by part rarity. */
function randomPartId(slot, bodyKind, rng) {
  const pool = partsFor(slot, bodyKind);
  return rng.weighted(pool, (p) => p.w ?? 1).id;
}

function defaultTraits() {
  const t = {};
  for (const k of TRAIT_KEYS) t[k] = 0.5;
  return t;
}

/** Roll a wild creature of a species. Deterministic for a given rng seed. */
function speciesGenome(species, rng) {
  const rParts = rng.fork('parts');
  const rPaint = rng.fork('paint');
  const rPal = rng.fork('palette');
  const rTraits = rng.fork('traits');
  const rStats = rng.fork('stats');

  const parts = {};
  const bodyAlleles = allelesFromRecipe(species.recipe.body, 'body');
  if (rParts.chance(ROLL.bodyCarriedMutation)) bodyAlleles[1] = randomPartId('body', null, rParts);
  parts.body = bodyAlleles;
  const bodyKind = getPart(bodyAlleles[0]).kind;
  for (const slot of SLOTS) {
    if (slot === 'body') continue;
    const a = allelesFromRecipe(species.recipe[slot], slot);
    if (rParts.chance(ROLL.carriedMutation)) a[1] = randomPartId(slot, bodyKind, rParts);
    if (rParts.chance(ROLL.expressedMutation)) a[0] = randomPartId(slot, bodyKind, rParts);
    parts[slot] = a;
  }

  const paint = {};
  for (const slot of PAINT_SLOTS) {
    let idx = (species.paint && species.paint[slot]) || 0;
    if (rPaint.chance(ROLL.paintSwap)) idx = rPaint.int(PAINT_PERMS.length);
    paint[slot] = idx;
  }

  let palette = jitterPalette(species.palette, species.vary, rPal);
  const shiny = rPal.chance(ROLL.shiny);
  if (shiny) palette = shinyPalette(palette, rPal);

  const traits = {};
  for (const k of TRAIT_KEYS) {
    const [lo, hi] = (species.traits && species.traits[k]) || [0.35, 0.65];
    traits[k] = round3(rTraits.range(lo, hi));
  }

  const vigor = {};
  for (const k of STAT_KEYS) vigor[k] = round3(rStats.next());

  return {
    v: GENOME_VERSION,
    seed: rng.seed,
    species: species.id,
    name: species.name,
    nameParts: species.nameParts ? species.nameParts.slice() : splitName(species.name),
    gen: 0,
    shiny,
    types: [species.types[0], species.types[1] || null],
    parts,
    paint,
    palette,
    traits,
    stats: { ...species.stats },
    vigor,
    bst: species.bst,
    lineage: [species.id],
  };
}

/** A random wild creature: species weighted by rarity tier, then rolled. */
function randomGenome(rng) {
  const species = rng.fork('species').weighted(SPECIES, (s) => TIER_WEIGHT[s.tier] || 1);
  return speciesGenome(species, rng);
}

function speciesOf(g) { return SPECIES_BY_ID[g.species] || null; }

/**
 * Expressed part per slot after compatibility checks. If the expressed allele
 * does not fit the body, the carried one is tried, then nothing.
 */
function resolveParts(g) {
  const out = {};
  const body = getPart(g.parts.body[0]) || getPart(g.parts.body[1]) || PARTS_BY_SLOT.body[0];
  out.body = body;
  for (const slot of SLOTS) {
    if (slot === 'body') continue;
    const [e, c] = g.parts[slot] || [];
    let part = getPart(e);
    if (!part || !partFits(part, body.kind)) {
      const alt = getPart(c);
      part = alt && partFits(alt, body.kind) ? alt : null;
    }
    out[slot] = part && !part.none ? part : null;
  }
  return out;
}

/** Species-level base stats: the fixed budget split by the creature's stat weights. */
function baseStats(g) {
  const w = normalizeWeights(g.stats);
  const out = {};
  for (const k of STAT_KEYS) out[k] = Math.max(20, Math.round((g.bst || 400) * w[k]));
  return out;
}

function typeLabel(g) { return g.types.filter(Boolean).join(' / '); }

function encodeGenome(g) { return CODE_PREFIX + b64uEncode(JSON.stringify(g)); }

function decodeGenome(code) {
  const s = String(code || '').trim();
  if (!s.startsWith(CODE_PREFIX)) throw new Error('That is not a creature code.');
  let g;
  try { g = JSON.parse(b64uDecode(s.slice(CODE_PREFIX.length))); } catch { throw new Error('That creature code is damaged.'); }
  return validateGenome(g);
}

/** Throws on structural problems; fills harmless gaps with defaults. Returns the genome. */
function validateGenome(g) {
  if (!g || typeof g !== 'object') throw new Error('Not a creature.');
  if (g.v !== GENOME_VERSION) throw new Error(`Unsupported creature version ${g.v}.`);
  if (!g.parts || typeof g.parts !== 'object') throw new Error('Creature has no parts.');
  for (const slot of SLOTS) {
    const a = g.parts[slot];
    if (!Array.isArray(a) || a.length !== 2 || !a.every((x) => typeof x === 'string')) throw new Error(`Bad ${slot} genes.`);
  }
  if (!getPart(g.parts.body[0]) && !getPart(g.parts.body[1])) throw new Error('Unknown body part.');
  for (const k of ['c1', 'c2', 'c3', 'eye']) {
    const c = g.palette && g.palette[k];
    if (!Array.isArray(c) || c.length !== 3 || !c.every(Number.isFinite)) throw new Error('Bad palette.');
  }
  if (!Array.isArray(g.types) || !isType(g.types[0]) || (g.types[1] != null && !isType(g.types[1]))) throw new Error('Bad types.');
  g.types = [g.types[0], g.types[1] || null];
  g.traits = { ...defaultTraits(), ...(g.traits || {}) };
  for (const k of TRAIT_KEYS) g.traits[k] = clamp01(Number(g.traits[k]) || 0.5);
  g.paint = g.paint && typeof g.paint === 'object' ? g.paint : {};
  for (const slot of PAINT_SLOTS) g.paint[slot] = PAINT_PERMS[g.paint[slot]] ? g.paint[slot] : 0;
  if (!g.stats || typeof g.stats !== 'object') g.stats = Object.fromEntries(STAT_KEYS.map((k) => [k, 1]));
  if (!g.vigor || typeof g.vigor !== 'object') g.vigor = Object.fromEntries(STAT_KEYS.map((k) => [k, 0.5]));
  g.bst = Number.isFinite(g.bst) ? g.bst : 400;
  g.gen = Number.isFinite(g.gen) ? g.gen : 0;
  g.name = typeof g.name === 'string' && g.name.trim() ? g.name.trim().slice(0, 24) : 'Unknown';
  if (!Array.isArray(g.nameParts) || g.nameParts.length !== 2 || !g.nameParts.every((x) => typeof x === 'string' && x)) {
    const sp = g.species && SPECIES_BY_ID[g.species];
    g.nameParts = sp && sp.nameParts ? sp.nameParts.slice() : splitName(g.name);
  }
  g.species = typeof g.species === 'string' && SPECIES_BY_ID[g.species] ? g.species : null;
  g.parents = Array.isArray(g.parents) ? g.parents.filter((x) => typeof x === 'string').slice(0, 2) : undefined;
  if (g.parents === undefined) delete g.parents;
  g.lineage = Array.isArray(g.lineage) ? g.lineage.filter((x) => typeof x === 'string').slice(0, 16) : [];
  g.shiny = Boolean(g.shiny);
  return g;
}

// ---- src/creature/render.js ----
// Genome -> SVG string. Pure: no DOM access, so it runs in Node for tests.
//
// Draw order (back to front): far wing, near wing, tail, back feature, far legs,
// far arm, near legs, near arm, body (+pattern, +face when headless), head
// (crown behind the skull, then eyes and mouth), and front-mounted arms for
// bodies that ask for it. Limbs sit behind the body so their roots are hidden
// by the silhouette, which keeps outlines clean.
//
// The frame is fixed so creatures are comparable in size: the ground line sits
// at the same height in every render. opts.fit crops the viewBox to the
// creature's bounds instead, for hero shots.




const FRAME = { w: 200, h: 230, ground: 208 };
const FAR_DEFAULT = { dx: -6, dy: -4 };

function fillAttr(f) { return f === 'none' ? 'none' : `var(--${f})`; }

function primSvg(pr) {
  const cls = pr.ns ? '' : ' class="o"';
  const style = pr.sw != null && !pr.ns ? ` style="stroke-width:${num(pr.sw)}"` : '';
  const op = pr.op != null ? ` opacity="${num(pr.op)}"` : '';
  switch (pr.t) {
    case 'path': return `<path${cls} d="${pr.d}" fill="${fillAttr(pr.f)}"${style}${op}/>`;
    case 'ellipse': return `<ellipse${cls} cx="${num(pr.cx)}" cy="${num(pr.cy)}" rx="${num(pr.rx)}" ry="${num(pr.ry)}" fill="${fillAttr(pr.f)}"${style}${op}/>`;
    case 'circle': return `<circle${cls} cx="${num(pr.cx)}" cy="${num(pr.cy)}" r="${num(pr.r)}" fill="${fillAttr(pr.f)}"${style}${op}/>`;
    case 'line': return `<path d="${pr.d}" fill="none" stroke="var(--${pr.f})" stroke-width="${num(pr.w)}" stroke-linecap="round" stroke-linejoin="round"${op}/>`;
    default: return '';
  }
}

function partPrims(part) { return part.prims.map(primSvg).join(''); }

// ---- bounds -----------------------------------------------------------------

const boundsCache = new Map();

/**
 * Approximate bounding box [x0,y0,x1,y1] of a part in its own coordinates.
 * Reads absolute path coordinates (control points included, so it errs large);
 * relative path segments are ignored, which only matters for clipped patterns.
 */
function partBounds(part) {
  if (boundsCache.has(part.id)) return boundsCache.get(part.id);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y) => { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; };
  for (const pr of part.prims || []) {
    if (pr.t === 'ellipse') { add(pr.cx - pr.rx, pr.cy - pr.ry); add(pr.cx + pr.rx, pr.cy + pr.ry); }
    else if (pr.t === 'circle') { add(pr.cx - pr.r, pr.cy - pr.r); add(pr.cx + pr.r, pr.cy + pr.r); }
    else if (pr.t === 'path' || pr.t === 'line') {
      const abs = pr.d.replace(/[a-z][^A-Za-z]*/g, ' ');
      const nums = (abs.match(/-?\d*\.?\d+/g) || []).map(Number);
      for (let i = 0; i + 1 < nums.length; i += 2) add(nums[i], nums[i + 1]);
    }
  }
  const box = x0 === Infinity ? [0, 0, 0, 0] : [x0 - 2, y0 - 2, x1 + 2, y1 + 2];
  boundsCache.set(part.id, box);
  return box;
}

// transform = { x, y, a, sx, sy } applied as translate(x,y) rotate(a) scale(sx,sy)
function applyT([px, py], t) {
  let x = px * (t.sx == null ? 1 : t.sx), y = py * (t.sy == null ? 1 : t.sy);
  if (t.a) {
    const r = (t.a * Math.PI) / 180, c = Math.cos(r), s = Math.sin(r);
    const rx = x * c - y * s, ry = x * s + y * c;
    x = rx; y = ry;
  }
  return [x + (t.x || 0), y + (t.y || 0)];
}

/** Push a box through a chain of transforms, innermost first. */
function boxThrough(box, chain) {
  let pts = [[box[0], box[1]], [box[2], box[1]], [box[0], box[3]], [box[2], box[3]]];
  for (const t of chain) pts = pts.map((p) => applyT(p, t));
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return [x0, y0, x1, y1];
}

function union(a, b) {
  if (!a) return b.slice();
  return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])];
}

const xf = (x, y, a = 0, s = 1) => ({ x, y, a, sx: s, sy: s });

function tf(t) {
  let out = `translate(${num(t.x)} ${num(t.y)})`;
  if (t.a) out += ` rotate(${num(t.a)})`;
  if (t.sx !== 1) out += ` scale(${num(t.sx)})`;
  return out;
}

function paintOf(g, slot) {
  const perm = PAINT_PERMS[(g.paint && g.paint[slot]) || 0] || PAINT_PERMS[0];
  return slotPaintVars(perm);
}

/** Scales derived from continuous trait genes. Exported so the UI can explain them. */
function traitScales(traits = {}) {
  const t = (k) => (traits[k] == null ? 0.5 : traits[k]);
  return {
    size: lerp(0.68, 1.0, t('size')),
    leg: lerp(0.8, 1.2, t('limbScale')),
    head: lerp(0.85, 1.15, t('headScale')),
    tail: lerp(0.75, 1.25, t('tailScale')),
    wing: lerp(0.75, 1.25, t('wingScale')),
    eye: lerp(0.8, 1.25, t('eyeScale')),
  };
}

/**
 * Build the layered markup and measure it. Returns { layers, box, feet, hover, K, body, clip }
 * where box is the creature's bounds in creature space (body centre = 0,0).
 */
function buildCreature(g, id) {
  const P = resolveParts(g);
  const body = P.body;
  const S = body.sockets;
  const K = traitScales(g.traits);

  let feet = body.bottom;
  if (P.legs && S.legs) for (const ls of S.legs) feet = Math.max(feet, ls.y + (P.legs.len || 40) * K.leg);
  const hover = body.hover || 0;

  const L = [];
  let box = null;
  const grow = (part, chain) => { box = union(box, boxThrough(partBounds(part), chain)); };

  if (P.wings && S.wing) {
    const w = partPrims(P.wings);
    const tn = xf(S.wing.x, S.wing.y, 0, K.wing), tfar = xf(S.wing.x - 6, S.wing.y - 6, 0, K.wing);
    grow(P.wings, [tn]); grow(P.wings, [tfar]);
    L.push(`<g style="${paintOf(g, 'wings')}">` +
      `<g transform="${tf(tfar)}"><g class="g-wing" style="${FAR_VARS}">${w}</g></g>` +
      `<g transform="${tf(tn)}"><g class="g-wing">${w}</g></g></g>`);
  }
  if (P.tail && S.tail) {
    const t = xf(S.tail.x, S.tail.y, S.tail.a, K.tail);
    grow(P.tail, [t]);
    L.push(`<g style="${paintOf(g, 'tail')}"><g transform="${tf(t)}"><g class="g-tail">${partPrims(P.tail)}</g></g></g>`);
  }
  if (P.back && S.back) {
    const t = xf(S.back.x, S.back.y, S.back.a);
    grow(P.back, [t]);
    L.push(`<g style="${paintOf(g, 'back')}"><g transform="${tf(t)}">${partPrims(P.back)}</g></g>`);
  }
  if (P.legs && S.legs && S.legs.length) {
    const lp = partPrims(P.legs);
    let far = '', near = '';
    for (const ls of S.legs) {
      const f = ls.far || FAR_DEFAULT;
      const tfar = xf(ls.x + f.dx, ls.y + f.dy, 0, K.leg), tn = xf(ls.x, ls.y, 0, K.leg);
      grow(P.legs, [tfar]); grow(P.legs, [tn]);
      far += `<g transform="${tf(tfar)}" style="${FAR_VARS}">${lp}</g>`;
      near += `<g transform="${tf(tn)}">${lp}</g>`;
    }
    L.push(`<g style="${paintOf(g, 'legs')}">${far}${near}</g>`);
  }
  const armsFront = Boolean(body.armsFront);
  const armSvg = () => {
    const ap = partPrims(P.arms);
    const tn = xf(S.arm.x, S.arm.y), tfar = xf(S.arm.x - 14, S.arm.y - 3);
    grow(P.arms, [tn]);
    let s = `<g style="${paintOf(g, 'arms')}">`;
    if (!armsFront) { grow(P.arms, [tfar]); s += `<g transform="${tf(tfar)}" style="${FAR_VARS}">${ap}</g>`; }
    return s + `<g transform="${tf(tn)}">${ap}</g></g>`;
  };
  if (P.arms && S.arm && !armsFront) L.push(armSvg());

  // Face: crown behind the skull, then far eye, near eye, mouth. `outer` is the
  // transform chain of whatever the face sits on (head or body).
  const face = (F, outer) => {
    let behind = '', front = '';
    if (P.crown && F.crown) {
      const t = xf(F.crown.x, F.crown.y, F.crown.a, F.crown.s == null ? 1 : F.crown.s);
      grow(P.crown, [t, ...outer]);
      behind += `<g style="${paintOf(g, 'crown')}"><g transform="${tf(t)}">${partPrims(P.crown)}</g></g>`;
    }
    if (P.eyes) {
      const ep = partPrims(P.eyes);
      if (F.eye2) {
        const t = xf(F.eye2.x, F.eye2.y, 0, (F.eye2.s == null ? 0.85 : F.eye2.s) * K.eye);
        grow(P.eyes, [t, ...outer]);
        front += `<g transform="${tf(t)}" style="${FAR_VARS}">${ep}</g>`;
      }
      if (F.eye) {
        const t = xf(F.eye.x, F.eye.y, 0, (F.eye.s == null ? 1 : F.eye.s) * K.eye);
        grow(P.eyes, [t, ...outer]);
        front += `<g transform="${tf(t)}">${ep}</g>`;
      }
    }
    if (P.mouth && F.mouth) {
      const t = xf(F.mouth.x, F.mouth.y, 0, F.mouth.s == null ? 1 : F.mouth.s);
      grow(P.mouth, [t, ...outer]);
      front += `<g transform="${tf(t)}">${partPrims(P.mouth)}</g>`;
    }
    return { behind, front };
  };

  const headless = !P.head || !S.head;
  const bodyFace = headless && S.face ? face(S.face, []) : null;
  grow(body, []);
  let bodyInner = bodyFace ? bodyFace.behind : '';
  bodyInner += partPrims(body);
  if (P.pattern) bodyInner += `<g clip-path="url(#${id}-clip)">${partPrims(P.pattern)}</g>`;
  if (bodyFace) bodyInner += bodyFace.front;
  L.push(`<g class="g-body" style="${paintOf(g, 'body')}">${bodyInner}</g>`);

  if (P.arms && S.arm && armsFront) L.push(armSvg());

  if (!headless) {
    const hs = S.head;
    const th = xf(hs.x, hs.y, hs.a, (hs.s == null ? 1 : hs.s) * K.head);
    grow(P.head, [th]);
    const hf = face(P.head.sockets, [th]);
    L.push(`<g style="${paintOf(g, 'head')}"><g transform="${tf(th)}"><g class="g-head">${hf.behind}${partPrims(P.head)}${hf.front}</g></g></g>`);
  }

  return { layers: L, box: box || [-40, -40, 40, 40], feet, hover, K, body, clip: body.clip || [] };
}

/** Canvas-space transform that places a built creature on the ground line. */
function placement(built, facing) {
  const flip = facing === 'left' ? -1 : 1;
  const sc = built.K.size;
  return [
    { x: 0, y: -(built.feet + built.hover) },
    { x: FRAME.w / 2, y: FRAME.ground, a: 0, sx: flip * sc, sy: sc },
  ];
}

/** Bounding box of a creature in canvas coordinates, shadow included. */
function measureCreature(g, facing = 'right') {
  const built = buildCreature(g, 'm');
  const chain = placement(built, facing);
  const box = boxThrough(built.box, chain);
  const sc = built.K.size;
  const shadowRx = 36 * sc * (built.hover ? 0.7 : 1), shadowRy = 7 * sc;
  return union(box, [FRAME.w / 2 - shadowRx, FRAME.ground - shadowRy, FRAME.w / 2 + shadowRx, FRAME.ground + shadowRy]);
}

/**
 * Render a creature.
 * opts: size (px width), facing ('right' | 'left'), animate (bool), id (svg id prefix),
 *       label (aria), fit (crop the viewBox to the creature instead of the fixed frame)
 */
function renderCreatureSvg(g, opts = {}) {
  const { size = 200, facing = 'right', animate = true, fit = false } = opts;
  const id = opts.id || uid('cr');
  const built = buildCreature(g, id);
  const chain = placement(built, facing);
  const sc = built.K.size;
  const shadowRx = 36 * sc * (built.hover ? 0.7 : 1), shadowRy = 7 * sc;

  let vb = [0, 0, FRAME.w, FRAME.h];
  if (fit) {
    const b = union(boxThrough(built.box, chain), [FRAME.w / 2 - shadowRx, FRAME.ground - shadowRy, FRAME.w / 2 + shadowRx, FRAME.ground + shadowRy]);
    const pad = 8;
    vb = [b[0] - pad, b[1] - pad, b[2] - b[0] + pad * 2, b[3] - b[1] + pad * 2];
  }
  const height = Math.round((size * vb[3]) / vb[2]);
  const label = opts.label || `${g.name}, ${typeLabel(g)}`;
  const delay = animate ? ` style="animation-delay:-${num(((g.seed || '').length * 0.37 + (g.traits ? g.traits.size * 3 : 0)) % 3)}s"` : '';
  const clip = built.clip.map((d) => `<path d="${d}"/>`).join('');

  return `<svg class="cr${animate ? ' cr-live' : ''}" xmlns="http://www.w3.org/2000/svg" viewBox="${vb.map(num).join(' ')}" width="${size}" height="${height}" role="img" aria-label="${escapeHtml(label)}" style="${paletteVars(g.palette)}">` +
    `<defs><clipPath id="${id}-clip">${clip}</clipPath></defs>` +
    `<ellipse class="cr-shadow" cx="${num(FRAME.w / 2)}" cy="${FRAME.ground}" rx="${num(shadowRx)}" ry="${num(shadowRy)}" fill="var(--k)" opacity="0.18"/>` +
    `<g transform="${tf(chain[1])} translate(0 ${num(chain[0].y)})">` +
    `<g class="cr-anim"${delay}>${built.layers.join('')}</g></g></svg>`;
}

/** A neutral mannequin genome used by the Part Lab to preview any single part. */
function mannequinGenome(part) {
  const parts = {
    body: ['body.round', 'body.round'], head: ['head.round', 'head.round'], eyes: ['eye.round', 'eye.round'], mouth: ['mouth.smile', 'mouth.smile'],

// ---- src/core/rng.js ----
// Seeded random numbers. Every roll in the game goes through here so that a
// creature, a fusion, or a whole battle can be reproduced from its seed.
// Hash: cyrb128. Generator: sfc32. Both are small, fast and well distributed.

function hashSeed(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0, k; i < str.length; i++) {
    k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
}

function sfc32(a, b, c, d) {
  return function next() {
    a |= 0; b |= 0; c |= 0; d |= 0;
    const t = (((a + b) | 0) + d) | 0;
    d = (d + 1) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}

/** Create a deterministic RNG from any string or number seed. */
function makeRng(seed) {
  const seedStr = String(seed);
  const [a, b, c, d] = hashSeed(seedStr);
  const next = sfc32(a, b, c, d);
  for (let i = 0; i < 12; i++) next(); // warm up
  const rng = {
    seed: seedStr,
    /** float in [0,1) */
    next,
    /** integer in [0,n) */
    int(n) { return Math.floor(next() * n); },
    /** integer in [lo,hi] inclusive */
    between(lo, hi) { return lo + Math.floor(next() * (hi - lo + 1)); },
    /** float in [lo,hi) */
    range(lo, hi) { return lo + next() * (hi - lo); },
    /** true with probability p */
    chance(p) { return next() < p; },
    pick(arr) { return arr[Math.floor(next() * arr.length)]; },
    /** pick by weight; weightOf(item) must return a number >= 0 */
    weighted(items, weightOf) {
      let total = 0;
      for (const it of items) total += weightOf(it);
      if (total <= 0) return items[Math.floor(next() * items.length)];
      let r = next() * total;
      for (const it of items) { r -= weightOf(it); if (r < 0) return it; }
      return items[items.length - 1];
    },
    shuffle(arr) {
      const out = arr.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    },
    /** approx. normal(0,1) via sum of uniforms, cheap and good enough for trait jitter */
    gauss() { return (next() + next() + next() + next() - 2) * Math.SQRT2 * 0.5 * 1.4142; },
    /**
     * Derive an independent stream from a label. Depends only on the parent's
     * seed and the label, never on how many numbers were drawn, so call order
     * does not matter. Labels must be unique per parent.
     */
    fork(label) { return makeRng(seedStr + '/' + label); },
  };
  return rng;
}

/** The one place non-deterministic randomness is allowed: minting fresh seeds from the UI. */
function freshSeed() {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
    const buf = new Uint8Array(8);
    crypto.getRandomValues(buf);
    for (const b of buf) s += alphabet[b % alphabet.length];
  } else {
    for (let i = 0; i < 8; i++) s += alphabet[Math.floor(Math.random() * alphabet.length)];
  }
  return s;
}

const fusionPool = { seed: null, genomes: [] };

const POOL_MAX = 24;

/** Add a genome to the fusion pool, newest first. Returns false if it was already there. */
function addToPool(g) {
  if (fusionPool.genomes.some((x) => x === g || (x.seed === g.seed && x.name === g.name && x.gen === g.gen))) return false;
  fusionPool.genomes.unshift(g);
  if (fusionPool.genomes.length > POOL_MAX) fusionPool.genomes.length = POOL_MAX;
  return true;
}

function removeFromPool(g) {
  const i = fusionPool.genomes.indexOf(g);
  if (i >= 0) fusionPool.genomes.splice(i, 1);
}

// ---- src/creature/fusion.js ----
// Fusion: two genomes in, one genome out, plus a report of what came from where.
//
// Heredity is diploid. For every slot the child draws one allele from each
// parent at random; the allele with the higher dominance (plus a little noise)
// is expressed and the other is carried. That keeps identities crisp across
// generations and lets a grandparent's trait resurface.
//
// The "identity parent" is whichever parent supplied the expressed head (or the
// body, for headless children). It gives the name prefix, the palette base and
// the primary type. The other parent gives the suffix, one accent colour and the
// secondary type. Shape from one side, colours from the other: that is what
// makes a fusion read as half and half.






const FUSE = {
  dominanceNoise: 0.15,   // +/- added to each allele's dominance before comparing
  expressedMutation: 0.03,
  carriedMutation: 0.06,
  bodyMutation: 0.01,
  paintSwap: 0.05,
  genBonusPerGen: 4,      // bst bonus per generation
  genBonusCap: 5,         // generations that count toward the bonus
  maxLineage: 16,
};

function dominanceOf(id) {
  const p = getPart(id);
  return p ? p.dom : 0.3;
}

function fitsBody(id, kind) {
  const p = getPart(id);
  return Boolean(p) && partFits(p, kind);
}

function nudgeColor(c, rng) {
  return [c[0] + rng.gauss() * 3, clamp01((c[1] + rng.gauss() * 2) / 100) * 100, clamp01((c[2] + rng.gauss() * 2) / 100) * 100].map(round3);
}

function namePartsOf(g) {
  return Array.isArray(g.nameParts) && g.nameParts.length === 2 ? g.nameParts : splitName(g.name);
}

/**
 * Fuse a and b. Deterministic for a given rng seed.
 * Returns { child, report } where report = { from: {slot: 0|1}, mutated: {slot: true},
 *   identity: 0|1, palette: {c1|c2|c3|eye: 0|1|'blend'}, types: {primary: 0|1, secondary: 0|1|null} }.
 */
function fuse(a, b, rng) {
  const rParts = rng.fork('parts');
  const rMut = rng.fork('mutation');
  const rPaint = rng.fork('paint');
  const rPal = rng.fork('palette');
  const rTraits = rng.fork('traits');
  const rStats = rng.fork('stats');
  const parents = [a, b];

  const draw = (slot) => {
    const fromA = a.parts[slot][rParts.int(2)];
    const fromB = b.parts[slot][rParts.int(2)];
    const dA = dominanceOf(fromA) + rParts.range(-FUSE.dominanceNoise, FUSE.dominanceNoise);
    const dB = dominanceOf(fromB) + rParts.range(-FUSE.dominanceNoise, FUSE.dominanceNoise);
    return dA >= dB ? { alleles: [fromA, fromB], from: 0 } : { alleles: [fromB, fromA], from: 1 };
  };

  const parts = {}, from = {}, mutated = {};
  const bodyDraw = draw('body');
  parts.body = bodyDraw.alleles;
  from.body = bodyDraw.from;
  if (rMut.chance(FUSE.bodyMutation)) { parts.body = [randomPartId('body', null, rMut), parts.body[0]]; mutated.body = true; }
  const bodyKind = getPart(parts.body[0]).kind;

  for (const slot of SLOTS) {
    if (slot === 'body') continue;
    const d = draw(slot);
    let [e, c] = d.alleles;
    let f = d.from;
    if (!fitsBody(e, bodyKind) && fitsBody(c, bodyKind)) { [e, c] = [c, e]; f = 1 - f; }
    if (rMut.chance(FUSE.expressedMutation)) { c = e; e = randomPartId(slot, bodyKind, rMut); mutated[slot] = true; }
    else if (rMut.chance(FUSE.carriedMutation)) c = randomPartId(slot, bodyKind, rMut);
    parts[slot] = [e, c];
    from[slot] = f;
  }

  const headPart = getPart(parts.head[0]);
  const identity = headPart && !headPart.none && !mutated.head ? from.head : from.body;
  const P1 = parents[identity], P2 = parents[1 - identity];

  // Paint travels with the part that was expressed.
  const paint = {};
  for (const slot of PAINT_SLOTS) {
    const src = parents[from[slot] == null ? identity : from[slot]];
    paint[slot] = (src.paint && PAINT_PERMS[src.paint[slot]]) ? src.paint[slot] : 0;
    if (rPaint.chance(FUSE.paintSwap)) paint[slot] = rPaint.int(PAINT_PERMS.length);
  }

  // Palette: base from the identity parent, one colour from the other parent.
  const palette = {}, palFrom = {};
  for (const k of ['c1', 'c2', 'c3']) { palette[k] = nudgeColor(P1.palette[k], rPal); palFrom[k] = identity; }
  const roll = rPal.next();
  if (roll < 0.55) {
    const k = rPal.pick(['c2', 'c3']);
    palette[k] = nudgeColor(P2.palette.c1, rPal); palFrom[k] = 1 - identity;
  } else if (roll < 0.85) {
    palette.c1 = blendColor(P1.palette.c1, P2.palette.c1, rPal.range(0.35, 0.65)); palFrom.c1 = 'blend';
    const k = rPal.pick(['c2', 'c3']);
    palette[k] = nudgeColor(P2.palette[k], rPal); palFrom[k] = 1 - identity;
  }
  const eyeFrom = rPal.chance(0.5) ? identity : 1 - identity;
  palette.eye = parents[eyeFrom].palette.eye.slice();
  palFrom.eye = eyeFrom;

  const traits = {};
  for (const k of TRAIT_KEYS) {
    const t = clamp01(0.5 + rTraits.gauss() * 0.15);
    const av = a.traits && a.traits[k] != null ? a.traits[k] : 0.5;
    const bv = b.traits && b.traits[k] != null ? b.traits[k] : 0.5;
    traits[k] = round3(clamp01(lerp(av, bv, t) + rTraits.gauss() * 0.04));
  }

  const primary = P1.types[0];
  let secondary = null, secondaryFrom = null;
  const candidates = [[P2.types[0], 1 - identity], [P2.types[1], 1 - identity], [P1.types[1], identity]];
  for (const [t, src] of candidates) if (t && t !== primary) { secondary = t; secondaryFrom = src; break; }

  const wa = normalizeWeights(a.stats), wb = normalizeWeights(b.stats);
  const stats = {};
  for (const k of STAT_KEYS) stats[k] = round3((wa[k] + wb[k]) / 2);
  const gen = Math.max(a.gen || 0, b.gen || 0) + 1;
  const bst = Math.round(((a.bst || 400) + (b.bst || 400)) / 2 + Math.min(gen, FUSE.genBonusCap) * FUSE.genBonusPerGen);
  const vigor = {};
  for (const k of STAT_KEYS) {
    const av = a.vigor && a.vigor[k] != null ? a.vigor[k] : 0.5;
    const bv = b.vigor && b.vigor[k] != null ? b.vigor[k] : 0.5;
    const base = rStats.chance(0.6) ? Math.max(av, bv) : (av + bv) / 2;
    vigor[k] = round3(clamp01(base + rStats.gauss() * 0.03));
  }

  const nameParts = [namePartsOf(P1)[0], namePartsOf(P2)[1]];
  const lineage = [...(a.lineage || []), ...(b.lineage || [])].filter((x, i, arr) => arr.indexOf(x) === i).slice(-FUSE.maxLineage);

  const child = {
    v: GENOME_VERSION,
    seed: rng.seed,
    species: null,
    name: joinNameParts(nameParts[0], nameParts[1]),
    nameParts,
    gen,
    shiny: Boolean(P1.shiny),
    types: [primary, secondary],
    parts, paint, palette, traits, stats, vigor, bst, lineage,
    parents: [a.name, b.name],
  };
  return {
    child,
    report: { from, mutated, identity, palette: palFrom, types: { primary: identity, secondary: secondaryFrom } },
  };
}

/** Fuse a chain: start with `first`, then fold in each partner in turn. Returns every generation. */
function fuseChain(first, partners, rng) {
  const out = [first];
  let cur = first;
  partners.forEach((p, i) => {
    cur = fuse(cur, p, rng.fork(`gen${i}`)).child;
    out.push(cur);
  });
  return out;
}

function renderFusionScreen(root) {
  if (!fusionPool.genomes.length) seedPool('FUSE');
  else if (!fusionPool.seed) fusionPool.seed = 'FUSE';
  clear(root);

  const rerender = () => renderFusionScreen(root);
  if (poolListener) window.removeEventListener('pool-changed', poolListener);
  poolListener = () => { if (root.isConnected) rerender(); else window.removeEventListener('pool-changed', poolListener); };
  window.addEventListener('pool-changed', poolListener);

  const pick = (g) => {
    if (fs.a === g) { fs.a = null; fs.next = 'a'; }
    else if (fs.b === g) { fs.b = null; fs.next = 'b'; }
    else if (!fs.a) { fs.a = g; fs.next = fs.b ? 'a' : 'b'; }
    else if (!fs.b) { fs.b = g; fs.next = 'a'; }
    else if (fs.next === 'a') { fs.a = g; fs.next = 'b'; }
    else { fs.b = g; fs.next = 'a'; }
    rerender();
  };

  const slot = (who, g) => h('button', { class: `pslot${g ? ' filled' : ''}`, type: 'button', onclick: () => { if (g) pick(g); } },
    h('span', { class: 'tag' }, `PARENT ${who}`),
    g ? [creatureEl(g, { size: 150, animate: false }), h('b', {}, g.name), typeChips(g.types)] : h('span', { class: 'hint' }, 'Tap a creature in the pool'));

  const doFuse = () => {
    const rng = makeRng(`${fs.a.seed}|${fs.a.name}+${fs.b.seed}|${fs.b.name}#${fs.rerolls}`);
    const { child, report } = fuse(fs.a, fs.b, rng);
    fs.child = child; fs.report = report; fs.chain = null;
    rerender();
    setTimeout(() => { const r = root.querySelector('.result'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 0);
  };

  root.append(
    h('div', { class: 'parents' }, slot('A', fs.a), h('div', { class: 'times' }, '×'), slot('B', fs.b)),
    h('button', { class: 'btn primary fuse-btn', type: 'button', disabled: !(fs.a && fs.b), onclick: () => { fs.rerolls = 0; doFuse(); } }, 'Fuse'),
  );

  if (fs.child) root.append(resultPanel(fs.child, fs.report, fs.a, fs.b, {
    reroll: () => { fs.rerolls++; doFuse(); },
    breed: () => {
      const rng = makeRng(`${fs.child.seed}:chain`);
      const partners = [];
      for (let i = 0; i < 5; i++) partners.push(rng.pick(fusionPool.genomes));
      fs.chain = fuseChain(fs.child, partners, rng);
      rerender();
      setTimeout(() => { const c = root.querySelector('.chain'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 0);
    },
    chain: fs.chain,
  }));

  // pool
  const codeInput = h('input', { class: 'seed code-in', type: 'text', placeholder: 'Paste a creature code to add it', 'aria-label': 'Creature code', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false' });
  const poolGrid = h('div', { class: 'pool' });
  for (const g of fusionPool.genomes) {
    const cls = g === fs.a ? ' is-a' : g === fs.b ? ' is-b' : '';
    poolGrid.append(h('button', { class: `pcard${cls}`, type: 'button', onclick: () => pick(g) },
      g === fs.a ? h('span', { class: 'sel badge a' }, 'A') : g === fs.b ? h('span', { class: 'sel badge b' }, 'B') : null,
      g.gen ? h('span', { class: 'gen' }, `gen ${g.gen}`) : null,
      creatureEl(g, { size: 104, animate: false }),
      h('span', {}, g.name)));
  }
  root.append(
    ...section(`Pool · ${fusionPool.genomes.length}`,
      h('div', { class: 'toolbar' },
        h('button', { class: 'btn', type: 'button', onclick: () => { seedPool(freshSeed()); rerender(); } }, 'New pool'),
        h('button', { class: 'btn', type: 'button', onclick: () => { for (let i = 0; i < 4; i++) addToPool(randomGenome(makeRng(freshSeed()))); rerender(); } }, '+4 wild')),
      h('div', { class: 'toolbar' },
        codeInput,
        h('button', { class: 'btn', type: 'button', onclick: () => {
          try { addToPool(decodeGenome(codeInput.value)); codeInput.value = ''; rerender(); } catch (e) { toast(e.message); }
        } }, 'Add')),
      h('p', { class: 'hint' }, 'Tap to choose parents. Tap a chosen one again to clear it. Long lists scroll.'),
      poolGrid),
  );
}

function resultPanel(child, report, a, b, actions) {
  const parents = [a, b];
  const parts = resolveParts(child);
  const rows = [];
  for (const slot of SLOTS) {
    const p = parts[slot];
    rows.push(h('span', {}, SLOT_NAMES[slot]), h('span', {}, p ? p.name : 'None'),
      h('span', {}, report.mutated[slot] ? h('span', { class: 'badge m' }, 'mutation') : badge(report.from[slot])));
  }
  const palRows = ['c1', 'c2', 'c3', 'eye'].map((k) => h('div', { class: 'sw-row' },
    h('span', { class: 'sw small', style: { background: swatchCss(child.palette[k]) } }),
    h('span', {}, { c1: 'Primary', c2: 'Secondary', c3: 'Accent', eye: 'Eyes' }[k]), badge(report.palette[k])));
  const typeRow = h('div', { class: 'sw-row' }, typeChips([child.types[0]]), badge(report.types.primary),
    child.types[1] ? [typeChips([child.types[1]]), badge(report.types.secondary)] : h('span', { class: 'hint', style: { margin: 0 } }, 'no second type'));

  const panel = h('div', { class: 'result' },
    h('div', { class: 'sheet-head' }, h('h2', {}, child.name, child.shiny ? ' ✦' : ''), typeChips(child.types)),
    h('p', { class: 'meta' }, `gen ${child.gen} · ${a.name} × ${b.name} · face from ${parents[report.identity].name}`),
    h('div', { class: 'hero' }, creatureEl(child, { size: 240, fit: true })),
    h('div', { class: 'row wrap' },
      h('button', { class: 'btn', type: 'button', onclick: actions.reroll }, 'Re-roll'),
      h('button', { class: 'btn', type: 'button', onclick: () => { toast(addToPool(child) ? 'Added to pool' : 'Already in pool'); window.dispatchEvent(new CustomEvent('pool-changed')); } }, 'Add to pool'),
      h('button', { class: 'btn', type: 'button', onclick: () => openSheet(child) }, 'Details'),
      h('button', { class: 'btn', type: 'button', onclick: async () => toast((await copyText(encodeGenome(child))) ? 'Code copied' : 'Copy failed') }, 'Copy code')),
    ...section('Inheritance', h('div', { class: 'inherit' }, rows)),
    ...section('Colours', h('div', { class: 'stack' }, palRows)),
    ...section('Types', typeRow),
    ...section('Stability test',
      h('p', { class: 'hint' }, 'Breed this child with random pool members for five more generations to check that fusions stay coherent.'),
      h('button', { class: 'btn', type: 'button', onclick: actions.breed }, 'Breed 5 generations')),
  );
  if (actions.chain) {
    const strip = h('div', { class: 'chain' });
    actions.chain.forEach((g, i) => strip.append(h('button', { class: 'pcard', type: 'button', onclick: () => openSheet(g) },
      h('span', { class: 'gen' }, `gen ${g.gen}`), creatureEl(g, { size: 120, animate: false }), h('span', {}, g.name))));
    panel.append(strip);
  }
  return panel;
}

// ---- src/ui/main.js ----
// App shell: header, tabs, hash routing between screens.







const SCREENS = [
  { id: 'lab', title: 'Lab', render: renderLabScreen },
  { id: 'parts', title: 'Parts', render: renderPartsScreen },
  { id: 'fusion', title: 'Fusion', render: renderFusionScreen },
  { id: 'battle', title: 'Battle', soon: true },
];

function bootApp() {
  const app = document.getElementById('app');
  clear(app);
  const nav = h('nav', { class: 'tabs', role: 'tablist' });
  const main = h('main', { class: 'screen' });
  app.append(
    h('header', { class: 'topbar' }, h('h1', {}, 'Creature Collector'), h('span', { class: 'ver' }, `${SPECIES.length} species · ${partCount()} parts`)),
    nav, main,
  );

  function go(id) {
    const screen = SCREENS.find((s) => s.id === id && !s.soon) || SCREENS[0];
    closeSheet();
    clear(nav);
    for (const s of SCREENS) {
      nav.append(h('button', {
        class: 'tab', role: 'tab', type: 'button', disabled: s.soon, 'aria-selected': String(s === screen),
        onclick: () => { location.hash = s.id; },
      }, s.title, s.soon ? h('small', {}, 'soon') : null));
    }
    screen.render(main);
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', () => go(location.hash.slice(1)));
  go(location.hash.slice(1));
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootApp);
else bootApp();

})();
</script>
