// Minimal DOM helpers. No framework.

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {

  return el;

function appendChildren(el, children) {
  for (const c of children.flat(Infinity)) {

  Fairy:    { se: ['Fighting', 'Dragon', 'Dark'], nve: ['Fire', 'Poison', 'Steel'] },
};

/** Multiplier for a single attacking type against a single defending type. */
function typeMultiplier(attacker, defender) {
  const r = RULES[attacker];
  if (!r) return 1;
  if (r.imm && r.imm.includes(defender)) return 0;
  if (r.se && r.se.includes(defender)) return 2;
  if (r.nve && r.nve.includes(defender)) return 0.5;
  return 1;
}

/** Multiplier against a creature with one or two types (second may be null). */
function typeEffectiveness(attacker, defenderTypes) {
  let m = 1;
  for (const t of defenderTypes) if (t) m *= typeMultiplier(attacker, t);
  return m;
}

function isType(t) { return TYPE_LIST.includes(t); }

// ---- src/core/util.js ----
// Small shared helpers. No game logic here.

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const clamp01 = (v) => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const round1 = (v) => Math.round(v * 10) / 10;
const round3 = (v) => Math.round(v * 1000) / 1000;
const sum = (arr) => arr.reduce((a, b) => a + b, 0);

/** Wrap a hue into [0,360). */
const wrapHue = (h) => ((h % 360) + 360) % 360;

/** Shortest signed distance from hue a to hue b, in (-180, 180]. */
function hueDelta(a, b) {
  let d = wrapHue(b) - wrapHue(a);
  if (d > 180) d -= 360;
  if (d <= -180) d += 360;
  return d;
}

const hsl = (h, s, l) => `hsl(${Math.round(wrapHue(h))} ${Math.round(clamp(s, 0, 100))}% ${Math.round(clamp(l, 0, 100))}%)`;

/** Normalize an object of positive weights so its values sum to 1. */
function normalizeWeights(obj) {
  const keys = Object.keys(obj);
  const total = sum(keys.map((k) => Math.max(0, obj[k])));
  const out = {};
  for (const k of keys) out[k] = total > 0 ? Math.max(0, obj[k]) / total : 1 / keys.length;
  return out;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

/** Format a number for SVG attributes: short, stable, never "-0". */
function num(v) {
  const r = Math.round(v * 100) / 100;
  return (Object.is(r, -0) ? 0 : r).toString();
}

let uidCounter = 0;
/** Unique id fragment for DOM/SVG ids within a page lifetime. */
function uid(prefix = 'u') { return `${prefix}${(++uidCounter).toString(36)}`; }

// base64url of UTF-8 text, works in browsers and Node.
function b64uEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  const b64 = typeof btoa === 'function' ? btoa(bin) : Buffer.from(bin, 'binary').toString('base64');
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64uDecode(s) {
  let b64 = s.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const bin = typeof atob === 'function' ? atob(b64) : Buffer.from(b64, 'base64').toString('binary');
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function deepFreeze(o) {
  if (o && typeof o === 'object' && !Object.isFrozen(o)) {
    Object.freeze(o);
    for (const k of Object.keys(o)) deepFreeze(o[k]);
  }
  return o;
}

function titleCase(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ---- src/creature/palette.js ----
// Palette genes -> CSS custom properties. Every part references abstract roles
// (p/s/a and their shades); the per-slot paint gene decides which of the
// creature's three colours each role maps to. That is how one part gets
// recoloured differently on different creatures.


const COLOR_KEYS = ['c1', 'c2', 'c3'];

/** Root CSS variables for a creature: the three colour families, eye colour, outline and whites. */
function paletteVars(pal) {
  const v = [];
  for (const k of COLOR_KEYS) {
    const [h, s, l] = pal[k];
    v.push(`--${k}:${hsl(h, s, l)}`, `--${k}d:${hsl(h, Math.min(100, s + 6), l - 14)}`, `--${k}l:${hsl(h, Math.max(0, s - 8), Math.min(96, l + 14))}`);
  }
  const [eh, es, el] = pal.eye;
  v.push(`--e:${hsl(eh, es, el)}`, `--ed:${hsl(eh, es, el - 16)}`);
  const [h1, s1] = pal.c1;
  const ol = hsl(h1, Math.min(s1, 45), 13);
  const hue = Math.round(wrapHue(h1));
  v.push(`--ol:${ol}`, `--k:${ol}`, `--w:hsl(${hue} 20% 97%)`, `--wd:hsl(${hue} 15% 80%)`);
  return v.join(';');
}

/** Per-slot role mapping. perm = indexes into [c1,c2,c3] for roles [p,s,a]. */
function slotPaintVars(perm) {
  const [p, s, a] = perm.map((i) => COLOR_KEYS[i]);
  return `--p:var(--${p});--pd:var(--${p}d);--pl:var(--${p}l);--s:var(--${s});--sd:var(--${s}d);--sl:var(--${s}l);--a:var(--${a});--ad:var(--${a}d);--al:var(--${a}l)`;
}

/** Applied to far-side copies (far legs, far wing, far eye): everything one shade darker. */
const FAR_VARS = '--p:var(--pd);--pl:var(--pd);--s:var(--sd);--sl:var(--sd);--a:var(--ad);--al:var(--ad);--w:var(--wd);--e:var(--ed)';

function jitterColor([h, s, l], vary, rng, sharedHue) {
  return [
    wrapHue(h + sharedHue + rng.gauss() * vary.h * 0.5),
    clamp(s + rng.gauss() * vary.s, 8, 100),
    clamp(l + rng.gauss() * vary.l, 12, 92),
  ].map((x) => Math.round(x * 10) / 10);
}

/** Genetic roll on a species palette: a shared hue drift plus small independent wobble per colour. */
function jitterPalette(base, vary, rng) {
  const v = { h: 10, s: 8, l: 6, ...(vary || {}) };
  const sharedHue = rng.gauss() * v.h;
  return {
    c1: jitterColor(base.c1, v, rng, sharedHue),
    c2: jitterColor(base.c2, v, rng, sharedHue),
    c3: jitterColor(base.c3, v, rng, sharedHue),
    eye: jitterColor(base.eye, v, rng, 0),
  };
}

/** Rare recolour: rotate the whole palette to a new harmony. */
function shinyPalette(pal, rng) {
  const rot = rng.range(140, 220);
  const out = {};
  for (const k of ['c1', 'c2', 'c3', 'eye']) {
    const [h, s, l] = pal[k];
    out[k] = [wrapHue(h + rot), clamp(s + 5, 8, 100), l].map((x) => Math.round(x * 10) / 10);
  }
  return out;
}

/** Blend two palettes colour by colour. t=0 -> a, t=1 -> b. Hues take the short way round. */
function blendColor(a, b, t) {
  let dh = wrapHue(b[0]) - wrapHue(a[0]);
  if (dh > 180) dh -= 360;
  if (dh < -180) dh += 360;
  return [wrapHue(a[0] + dh * t), a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t].map((x) => Math.round(x * 10) / 10);
}

function swatchCss([h, s, l]) { return hsl(h, s, l); }

// Tiny drawing DSL for creature parts.
//
// Every part is authored facing RIGHT in a local coordinate system whose origin
// (0,0) is the point that attaches to the parent's socket. Units are the same as
// the 200x200 creature canvas at scale 1.
//
// Fill roles (resolved to CSS variables at render time, remapped per slot by paint genes):
//   p / pd / pl   primary colour, its shade, its highlight
//   s / sd / sl   secondary colour family
//   a / ad / al   accent colour family
//   w / wd        white and its shade         e / ed   eye colour and its shade
//   k             outline/dark                none     no fill (stroke only)
//
// Options: op (opacity), ns (no outline stroke), sw (outline stroke width override).

const P = (d, f = 'p', o = {}) => ({ t: 'path', d, f, ...o });
const E = (cx, cy, rx, ry, f = 'p', o = {}) => ({ t: 'ellipse', cx, cy, rx, ry, f, ...o });
const C = (cx, cy, r, f = 'p', o = {}) => ({ t: 'circle', cx, cy, r, f, ...o });
/** Stroke-only path. f is the stroke role, w the stroke width. */
const L = (d, f = 'k', w = 3, o = {}) => ({ t: 'line', d, f, w, ...o });

/** Convenience for a "none" part in an optional slot. */
const NONE = (slot, dom = 0.35) => ({ id: `${slot}.none`, slot, name: 'None', none: true, dom, w: 1 });

// ---- src/data/parts/index.js ----
// Part registry. Part ids are stable forever: a saved creature must decode the
// same way after the library grows, so never rename or reuse an id.









const SLOTS = ['body', 'head', 'eyes', 'mouth', 'crown', 'legs', 'arms', 'wings', 'tail', 'back', 'pattern'];
const SLOT_NAMES = {
  body: 'Body', head: 'Head', eyes: 'Eyes', mouth: 'Mouth', crown: 'Crown', legs: 'Legs',
  arms: 'Arms', wings: 'Wings', tail: 'Tail', back: 'Back', pattern: 'Pattern',
};

const PARTS_BY_SLOT = {
  body: BODIES, head: HEADS, eyes: EYES, mouth: MOUTHS, crown: CROWNS, legs: LEGS,
  arms: ARMS, wings: WINGS, tail: TAILS, back: BACKS, pattern: PATTERNS,
};

const PARTS = new Map();
for (const slot of SLOTS) {
  for (const part of PARTS_BY_SLOT[slot]) {
    if (PARTS.has(part.id)) throw new Error(`duplicate part id ${part.id}`);
    if (part.slot !== slot) throw new Error(`part ${part.id} listed under slot ${slot} but declares ${part.slot}`);
    PARTS.set(part.id, part);
  }
}

function getPart(id) { return PARTS.get(id) || null; }

/** Does this part fit on a body of the given kind? Parts without a fit list fit everything. */
function partFits(part, bodyKind) {
  return !part || !part.fit || part.fit.includes(bodyKind);
}

/** All parts for a slot that fit the given body kind (includes the slot's "none" entry when it has one). */
function partsFor(slot, bodyKind) {
  return PARTS_BY_SLOT[slot].filter((p) => partFits(p, bodyKind));
}

function partCount() { return PARTS.size; }

// ---- src/creature/naming.js ----
// Names. Species carry hand-picked [prefix, suffix] halves; a fusion takes the
// prefix of the parent that gives its face and the suffix of the other one.

const VOWELS = 'aeiouy';

/** Join two name halves at a clean boundary. "Gla"+"ox" -> "Glox", "Puff"+"fin" -> "Puffin". */
function joinNameParts(prefix, suffix) {
  let p = String(prefix || '').trim(), s = String(suffix || '').trim();
  if (!p) return capitalize(s || 'Fusion');
  if (!s) return capitalize(p);
  const pl = p[p.length - 1].toLowerCase(), s0 = s[0].toLowerCase();
  if (pl === s0) p = p.slice(0, -1);
  else if (VOWELS.includes(pl) && VOWELS.includes(s0)) p = p.slice(0, -1);
  return capitalize((p + s).slice(0, 20));
}

/** Fallback split for names without authored halves: after the first vowel cluster and the consonants that follow it. */
function splitName(name) {
  const n = String(name || 'Fusion');
  const m = n.match(/^([^aeiouy]*[aeiouy]+[^aeiouy]+)(.+)$/i);
  if (m && m[2].length >= 2 && m[1].length >= 2) return [m[1], m[2].toLowerCase()];
  const cut = Math.ceil(n.length / 2);
  return [n.slice(0, cut), n.slice(cut).toLowerCase()];
}

function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

//   { k:'stat', who:'self'|'foe', stats:{atk:1,...}, p }      stage changes

// ---- src/creature/genome.js ----
// The genome is the single source of truth for a creature. It is a plain JSON
// object with a fixed shape, so fusing two genomes always yields another valid
// genome and any creature can be shared as a code string.
//
// Diploid part genes: every slot holds [expressed, carried]. Only the expressed
// allele is drawn; the carried one can resurface in offspring.









const GENOME_VERSION = 1;
const CODE_PREFIX = 'CC1.';
const STAT_KEYS = ['hp', 'atk', 'def', 'spa', 'spd', 'spe'];
const STAT_NAMES = { hp: 'HP', atk: 'Attack', def: 'Defense', spa: 'Sp. Atk', spd: 'Sp. Def', spe: 'Speed' };
const TRAIT_KEYS = ['size', 'bulk', 'headScale', 'limbScale', 'tailScale', 'wingScale', 'eyeScale'];
const PAINT_SLOTS = ['body', 'head', 'crown', 'legs', 'arms', 'wings', 'tail', 'back'];
/** Role order [p, s, a] -> colour index into [c1, c2, c3]. */
const PAINT_PERMS = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];

/** Odds used when rolling a wild creature from its species. */
const ROLL = {
  carriedMutation: 0.1,   // hidden allele replaced by a random part
  expressedMutation: 0.03, // visible variant
  bodyCarriedMutation: 0.05,
  paintSwap: 0.12,        // a slot's colour roles get permuted
  shiny: 1 / 64,
};

function allelesFromRecipe(entry, slot) {
  if (Array.isArray(entry)) return [entry[0], entry[1] ?? entry[0]];
  if (typeof entry === 'string') return [entry, entry];
  return [`${slot}.none`, `${slot}.none`];
}

/** Random part id for a slot that fits the body kind, weighted by part rarity. */
function randomPartId(slot, bodyKind, rng) {
  const pool = partsFor(slot, bodyKind);
  return rng.weighted(pool, (p) => p.w ?? 1).id;
}

function defaultTraits() {
  const t = {};
  for (const k of TRAIT_KEYS) t[k] = 0.5;
  return t;
}

/** Roll a wild creature of a species. Deterministic for a given rng seed. */
function speciesGenome(species, rng) {
  const rParts = rng.fork('parts');
  const rPaint = rng.fork('paint');
  const rPal = rng.fork('palette');
  const rTraits = rng.fork('traits');
  const rStats = rng.fork('stats');
  const rAbility = rng.fork('ability');

  const parts = {};
  const bodyAlleles = allelesFromRecipe(species.recipe.body, 'body');
  if (rParts.chance(ROLL.bodyCarriedMutation)) bodyAlleles[1] = randomPartId('body', null, rParts);
  parts.body = bodyAlleles;
  const bodyKind = getPart(bodyAlleles[0]).kind;
  for (const slot of SLOTS) {
    if (slot === 'body') continue;
    const a = allelesFromRecipe(species.recipe[slot], slot);
    if (rParts.chance(ROLL.carriedMutation)) a[1] = randomPartId(slot, bodyKind, rParts);
    if (rParts.chance(ROLL.expressedMutation)) a[0] = randomPartId(slot, bodyKind, rParts);
    parts[slot] = a;
  }

  const paint = {};
  for (const slot of PAINT_SLOTS) {
    let idx = (species.paint && species.paint[slot]) || 0;
    if (rPaint.chance(ROLL.paintSwap)) idx = rPaint.int(PAINT_PERMS.length);
    paint[slot] = idx;
  }

  let palette = jitterPalette(species.palette, species.vary, rPal);
  const shiny = rPal.chance(ROLL.shiny);
  if (shiny) palette = shinyPalette(palette, rPal);

  const traits = {};
  for (const k of TRAIT_KEYS) {
    const [lo, hi] = (species.traits && species.traits[k]) || [0.35, 0.65];
    traits[k] = round3(rTraits.range(lo, hi));
  }

  const vigor = {};
  for (const k of STAT_KEYS) vigor[k] = round3(rStats.next());

  return {
    v: GENOME_VERSION,
    seed: rng.seed,
    species: species.id,
    name: species.name,
    nameParts: species.nameParts ? species.nameParts.slice() : splitName(species.name),
    gen: 0,
    shiny,
    types: [species.types[0], species.types[1] || null],
    parts,
    paint,
    palette,
    traits,
    stats: { ...species.stats },
    vigor,
    bst: species.bst,
    lineage: [species.id],
    learnset: (species.learnset || UNIVERSAL_LEARNSET).map((e) => e.slice()),
    ability: rAbility.pick(species.abilities || ['lucky_streak']),
  };
}

/** The learnset a genome battles with: its own, else its species', else the universal fallback. */
function learnsetOf(g) {
  if (Array.isArray(g.learnset) && g.learnset.length) return g.learnset;
  const sp = g.species && SPECIES_BY_ID[g.species];
  return sp && sp.learnset ? sp.learnset : UNIVERSAL_LEARNSET;
}

/** A random wild creature: species weighted by rarity tier, then rolled. */
function randomGenome(rng) {
  const species = rng.fork('species').weighted(SPECIES, (s) => TIER_WEIGHT[s.tier] || 1);
  return speciesGenome(species, rng);
}

function speciesOf(g) { return SPECIES_BY_ID[g.species] || null; }

/**
 * Expressed part per slot after compatibility checks. If the expressed allele
 * does not fit the body, the carried one is tried, then nothing.
 */
function resolveParts(g) {
  const out = {};
  const body = getPart(g.parts.body[0]) || getPart(g.parts.body[1]) || PARTS_BY_SLOT.body[0];
  out.body = body;
  for (const slot of SLOTS) {
    if (slot === 'body') continue;
    const [e, c] = g.parts[slot] || [];
    let part = getPart(e);
    if (!part || !partFits(part, body.kind)) {
      const alt = getPart(c);
      part = alt && partFits(alt, body.kind) ? alt : null;
    }
    out[slot] = part && !part.none ? part : null;
  }
  return out;
}

/** Species-level base stats: the fixed budget split by the creature's stat weights. */
function baseStats(g) {
  const w = normalizeWeights(g.stats);
  const out = {};
  for (const k of STAT_KEYS) out[k] = Math.max(20, Math.round((g.bst || 400) * w[k]));
  return out;
}

function typeLabel(g) { return g.types.filter(Boolean).join(' / '); }

function encodeGenome(g) { return CODE_PREFIX + b64uEncode(JSON.stringify(g)); }

function decodeGenome(code) {
  const s = String(code || '').trim();
  if (!s.startsWith(CODE_PREFIX)) throw new Error('That is not a creature code.');
  let g;
  try { g = JSON.parse(b64uDecode(s.slice(CODE_PREFIX.length))); } catch { throw new Error('That creature code is damaged.'); }
  return validateGenome(g);
}

/** Throws on structural problems; fills harmless gaps with defaults. Returns the genome. */
function validateGenome(g) {
  if (!g || typeof g !== 'object') throw new Error('Not a creature.');
  if (g.v !== GENOME_VERSION) throw new Error(`Unsupported creature version ${g.v}.`);
  if (!g.parts || typeof g.parts !== 'object') throw new Error('Creature has no parts.');
  for (const slot of SLOTS) {
    const a = g.parts[slot];
    if (!Array.isArray(a) || a.length !== 2 || !a.every((x) => typeof x === 'string')) throw new Error(`Bad ${slot} genes.`);
  }
  if (!getPart(g.parts.body[0]) && !getPart(g.parts.body[1])) throw new Error('Unknown body part.');
  for (const k of ['c1', 'c2', 'c3', 'eye']) {
    const c = g.palette && g.palette[k];
    if (!Array.isArray(c) || c.length !== 3 || !c.every(Number.isFinite)) throw new Error('Bad palette.');
  }
  if (!Array.isArray(g.types) || !isType(g.types[0]) || (g.types[1] != null && !isType(g.types[1]))) throw new Error('Bad types.');
  g.types = [g.types[0], g.types[1] || null];
  g.traits = { ...defaultTraits(), ...(g.traits || {}) };
  for (const k of TRAIT_KEYS) g.traits[k] = clamp01(Number(g.traits[k]) || 0.5);
  g.paint = g.paint && typeof g.paint === 'object' ? g.paint : {};
  for (const slot of PAINT_SLOTS) g.paint[slot] = PAINT_PERMS[g.paint[slot]] ? g.paint[slot] : 0;
  if (!g.stats || typeof g.stats !== 'object') g.stats = Object.fromEntries(STAT_KEYS.map((k) => [k, 1]));
  if (!g.vigor || typeof g.vigor !== 'object') g.vigor = Object.fromEntries(STAT_KEYS.map((k) => [k, 0.5]));
  g.bst = Number.isFinite(g.bst) ? g.bst : 400;
  g.gen = Number.isFinite(g.gen) ? g.gen : 0;
  g.name = typeof g.name === 'string' && g.name.trim() ? g.name.trim().slice(0, 24) : 'Unknown';
  if (!Array.isArray(g.nameParts) || g.nameParts.length !== 2 || !g.nameParts.every((x) => typeof x === 'string' && x)) {
    const sp = g.species && SPECIES_BY_ID[g.species];
    g.nameParts = sp && sp.nameParts ? sp.nameParts.slice() : splitName(g.name);
  }
  g.species = typeof g.species === 'string' && SPECIES_BY_ID[g.species] ? g.species : null;
  g.parents = Array.isArray(g.parents) ? g.parents.filter((x) => typeof x === 'string').slice(0, 2) : undefined;
  if (g.parents === undefined) delete g.parents;
  g.lineage = Array.isArray(g.lineage) ? g.lineage.filter((x) => typeof x === 'string').slice(0, 16) : [];
  g.shiny = Boolean(g.shiny);
  const sp = g.species ? SPECIES_BY_ID[g.species] : null;
  g.learnset = Array.isArray(g.learnset) ? g.learnset.filter((e) => Array.isArray(e) && Number.isFinite(e[0]) && getMove(e[1])).map((e) => [e[0], e[1]]) : [];
  if (!g.learnset.length) g.learnset = ((sp && sp.learnset) || UNIVERSAL_LEARNSET).map((e) => e.slice());
  if (!ABILITIES[g.ability]) g.ability = (sp && sp.abilities && sp.abilities[0]) || 'lucky_streak';
  return g;
}

// ---- src/creature/render.js ----
// Genome -> SVG string. Pure: no DOM access, so it runs in Node for tests.
//
// Draw order (back to front): far wing, near wing, tail, back feature, far legs,
// far arm, near legs, near arm, body (+pattern, +face when headless), head
// (crown behind the skull, then eyes and mouth), and front-mounted arms for
// bodies that ask for it. Limbs sit behind the body so their roots are hidden
// by the silhouette, which keeps outlines clean.
//
// The frame is fixed so creatures are comparable in size: the ground line sits
// at the same height in every render. opts.fit crops the viewBox to the
// creature's bounds instead, for hero shots.




const FRAME = { w: 200, h: 230, ground: 208 };
const FAR_DEFAULT = { dx: -6, dy: -4 };

function fillAttr(f) { return f === 'none' ? 'none' : `var(--${f})`; }

function primSvg(pr) {
  const cls = pr.ns ? '' : ' class="o"';
  const style = pr.sw != null && !pr.ns ? ` style="stroke-width:${num(pr.sw)}"` : '';
  const op = pr.op != null ? ` opacity="${num(pr.op)}"` : '';
  switch (pr.t) {
    case 'path': return `<path${cls} d="${pr.d}" fill="${fillAttr(pr.f)}"${style}${op}/>`;
    case 'ellipse': return `<ellipse${cls} cx="${num(pr.cx)}" cy="${num(pr.cy)}" rx="${num(pr.rx)}" ry="${num(pr.ry)}" fill="${fillAttr(pr.f)}"${style}${op}/>`;
    case 'circle': return `<circle${cls} cx="${num(pr.cx)}" cy="${num(pr.cy)}" r="${num(pr.r)}" fill="${fillAttr(pr.f)}"${style}${op}/>`;
    case 'line': return `<path d="${pr.d}" fill="none" stroke="var(--${pr.f})" stroke-width="${num(pr.w)}" stroke-linecap="round" stroke-linejoin="round"${op}/>`;
    default: return '';
  }
}

function partPrims(part) { return part.prims.map(primSvg).join(''); }

// ---- bounds -----------------------------------------------------------------

const boundsCache = new Map();

/**
 * Approximate bounding box [x0,y0,x1,y1] of a part in its own coordinates.
 * Reads absolute path coordinates (control points included, so it errs large);
 * relative path segments are ignored, which only matters for clipped patterns.
 */
function partBounds(part) {
  if (boundsCache.has(part.id)) return boundsCache.get(part.id);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y) => { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; };
  for (const pr of part.prims || []) {
    if (pr.t === 'ellipse') { add(pr.cx - pr.rx, pr.cy - pr.ry); add(pr.cx + pr.rx, pr.cy + pr.ry); }
    else if (pr.t === 'circle') { add(pr.cx - pr.r, pr.cy - pr.r); add(pr.cx + pr.r, pr.cy + pr.r); }
    else if (pr.t === 'path' || pr.t === 'line') {
      const abs = pr.d.replace(/[a-z][^A-Za-z]*/g, ' ');
      const nums = (abs.match(/-?\d*\.?\d+/g) || []).map(Number);
      for (let i = 0; i + 1 < nums.length; i += 2) add(nums[i], nums[i + 1]);
    }
  }
  const box = x0 === Infinity ? [0, 0, 0, 0] : [x0 - 2, y0 - 2, x1 + 2, y1 + 2];
  boundsCache.set(part.id, box);
  return box;
}

// transform = { x, y, a, sx, sy } applied as translate(x,y) rotate(a) scale(sx,sy)
function applyT([px, py], t) {
  let x = px * (t.sx == null ? 1 : t.sx), y = py * (t.sy == null ? 1 : t.sy);
  if (t.a) {
    const r = (t.a * Math.PI) / 180, c = Math.cos(r), s = Math.sin(r);
    const rx = x * c - y * s, ry = x * s + y * c;
    x = rx; y = ry;
  }
  return [x + (t.x || 0), y + (t.y || 0)];
}

/** Push a box through a chain of transforms, innermost first. */
function boxThrough(box, chain) {
  let pts = [[box[0], box[1]], [box[2], box[1]], [box[0], box[3]], [box[2], box[3]]];
  for (const t of chain) pts = pts.map((p) => applyT(p, t));
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return [x0, y0, x1, y1];
}

function union(a, b) {
  if (!a) return b.slice();
  return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])];
}

const xf = (x, y, a = 0, s = 1) => ({ x, y, a, sx: s, sy: s });

function tf(t) {
  let out = `translate(${num(t.x)} ${num(t.y)})`;
  if (t.a) out += ` rotate(${num(t.a)})`;
  const sy = t.sy == null ? t.sx : t.sy;
  if (t.sx !== 1 || sy !== 1) out += t.sx === sy ? ` scale(${num(t.sx)})` : ` scale(${num(t.sx)} ${num(sy)})`;
  return out;
}

function paintOf(g, slot) {
  const perm = PAINT_PERMS[(g.paint && g.paint[slot]) || 0] || PAINT_PERMS[0];
  return slotPaintVars(perm);
}

/** Scales derived from continuous trait genes. Exported so the UI can explain them. */
function traitScales(traits = {}) {
  const t = (k) => (traits[k] == null ? 0.5 : traits[k]);
  return {
    size: lerp(0.68, 1.0, t('size')),
    leg: lerp(0.8, 1.2, t('limbScale')),
    head: lerp(0.85, 1.15, t('headScale')),
    tail: lerp(0.75, 1.25, t('tailScale')),
    wing: lerp(0.75, 1.25, t('wingScale')),
    eye: lerp(0.8, 1.25, t('eyeScale')),
  };
}

/**
 * Build the layered markup and measure it. Returns { layers, box, feet, hover, K, body, clip }
 * where box is the creature's bounds in creature space (body centre = 0,0).
 */
function buildCreature(g, id) {
  const P = resolveParts(g);
  const body = P.body;
  const S = body.sockets;
  const K = traitScales(g.traits);

  let feet = body.bottom;
  if (P.legs && S.legs) for (const ls of S.legs) feet = Math.max(feet, ls.y + (P.legs.len || 40) * K.leg);
  const hover = body.hover || 0;

  const L = [];
  let box = null;
  const grow = (part, chain) => { box = union(box, boxThrough(partBounds(part), chain)); };

  if (P.wings && S.wing) {
    const w = partPrims(P.wings);
    const tn = xf(S.wing.x, S.wing.y, 0, K.wing), tfar = xf(S.wing.x - 6, S.wing.y - 6, 0, K.wing);
    grow(P.wings, [tn]); grow(P.wings, [tfar]);
    L.push(`<g style="${paintOf(g, 'wings')}">` +
      `<g transform="${tf(tfar)}"><g class="g-wing" style="${FAR_VARS}">${w}</g></g>` +
      `<g transform="${tf(tn)}"><g class="g-wing">${w}</g></g></g>`);
  }
  if (P.tail && S.tail) {
    const t = xf(S.tail.x, S.tail.y, S.tail.a, K.tail);
    grow(P.tail, [t]);
    L.push(`<g style="${paintOf(g, 'tail')}"><g transform="${tf(t)}"><g class="g-tail">${partPrims(P.tail)}</g></g></g>`);
  }
  if (P.back && S.back) {
    const t = xf(S.back.x, S.back.y, S.back.a);
    grow(P.back, [t]);
    L.push(`<g style="${paintOf(g, 'back')}"><g transform="${tf(t)}">${partPrims(P.back)}</g></g>`);
  }
  if (P.legs && S.legs && S.legs.length) {
    const lp = partPrims(P.legs);
    let far = '', near = '';
    for (const ls of S.legs) {
      const f = ls.far || FAR_DEFAULT;
      const tfar = xf(ls.x + f.dx, ls.y + f.dy, 0, K.leg), tn = xf(ls.x, ls.y, 0, K.leg);
      grow(P.legs, [tfar]); grow(P.legs, [tn]);
      far += `<g transform="${tf(tfar)}" style="${FAR_VARS}">${lp}</g>`;
      near += `<g transform="${tf(tn)}">${lp}</g>`;
    }
    L.push(`<g style="${paintOf(g, 'legs')}">${far}${near}</g>`);
  }
  const armsFront = Boolean(body.armsFront);
  const armSvg = () => {
    const ap = partPrims(P.arms);
    const tn = xf(S.arm.x, S.arm.y), tfar = xf(S.arm.x - 14, S.arm.y - 3);
    grow(P.arms, [tn]);
    let s = `<g style="${paintOf(g, 'arms')}">`;
    if (!armsFront) { grow(P.arms, [tfar]); s += `<g transform="${tf(tfar)}" style="${FAR_VARS}">${ap}</g>`; }
    return s + `<g transform="${tf(tn)}">${ap}</g></g>`;
  };
  if (P.arms && S.arm && !armsFront) L.push(armSvg());

  // Face: crown behind the skull, then far eye, near eye, mouth. `outer` is the
  // transform chain of whatever the face sits on (head or body).
  const face = (F, outer) => {
    let behind = '', front = '';
    if (P.crown && F.crown) {
      const t = xf(F.crown.x, F.crown.y, F.crown.a, F.crown.s == null ? 1 : F.crown.s);
      grow(P.crown, [t, ...outer]);
      behind += `<g style="${paintOf(g, 'crown')}"><g transform="${tf(t)}">${partPrims(P.crown)}</g></g>`;
    }
    if (P.eyes) {
      const ep = partPrims(P.eyes);
      if (F.eye2) {
        const t = xf(F.eye2.x, F.eye2.y, 0, (F.eye2.s == null ? 0.85 : F.eye2.s) * K.eye);
        grow(P.eyes, [t, ...outer]);
        front += `<g transform="${tf(t)}" style="${FAR_VARS}">${ep}</g>`;
      }
      if (F.eye) {
        const t = xf(F.eye.x, F.eye.y, 0, (F.eye.s == null ? 1 : F.eye.s) * K.eye);
        grow(P.eyes, [t, ...outer]);
        front += `<g transform="${tf(t)}">${ep}</g>`;
      }
    }
    if (P.mouth && F.mouth) {
      const t = xf(F.mouth.x, F.mouth.y, 0, F.mouth.s == null ? 1 : F.mouth.s);
      grow(P.mouth, [t, ...outer]);
      front += `<g transform="${tf(t)}">${partPrims(P.mouth)}</g>`;
    }
    return { behind, front };
  };

  const headless = !P.head || !S.head;
  const bodyFace = headless && S.face ? face(S.face, []) : null;
  grow(body, []);
  let bodyInner = bodyFace ? bodyFace.behind : '';
  bodyInner += partPrims(body);
  if (P.pattern) bodyInner += `<g clip-path="url(#${id}-clip)">${partPrims(P.pattern)}</g>`;
  if (bodyFace) bodyInner += bodyFace.front;
  L.push(`<g class="g-body" style="${paintOf(g, 'body')}">${bodyInner}</g>`);

  if (P.arms && S.arm && armsFront) L.push(armSvg());

  if (!headless) {
    const hs = S.head;
    const th = xf(hs.x, hs.y, hs.a, (hs.s == null ? 1 : hs.s) * K.head);
    grow(P.head, [th]);
    const hf = face(P.head.sockets, [th]);
    L.push(`<g style="${paintOf(g, 'head')}"><g transform="${tf(th)}"><g class="g-head">${hf.behind}${partPrims(P.head)}${hf.front}</g></g></g>`);
  }

  return { layers: L, box: box || [-40, -40, 40, 40], feet, hover, K, body, clip: body.clip || [] };
}

/** Canvas-space transform that places a built creature on the ground line. */
function placement(built, facing) {
  const flip = facing === 'left' ? -1 : 1;
  const sc = built.K.size;
  return [
    { x: 0, y: -(built.feet + built.hover) },
    { x: FRAME.w / 2, y: FRAME.ground, a: 0, sx: flip * sc, sy: sc },
  ];
}

/** Bounding box of a creature in canvas coordinates, shadow included. */
function measureCreature(g, facing = 'right') {
  const built = buildCreature(g, 'm');
  const chain = placement(built, facing);
  const box = boxThrough(built.box, chain);
  const sc = built.K.size;
  const shadowRx = 36 * sc * (built.hover ? 0.7 : 1), shadowRy = 7 * sc;
  return union(box, [FRAME.w / 2 - shadowRx, FRAME.ground - shadowRy, FRAME.w / 2 + shadowRx, FRAME.ground + shadowRy]);
}

/**
 * Render a creature.
 * opts: size (px width), facing ('right' | 'left'), animate (bool), id (svg id prefix),
 *       label (aria), fit (crop the viewBox to the creature instead of the fixed frame)
 */
function renderCreatureSvg(g, opts = {}) {
  const { size = 200, facing = 'right', animate = true, fit = false } = opts;
  const id = opts.id || uid('cr');
  const built = buildCreature(g, id);
  const chain = placement(built, facing);
  const sc = built.K.size;
  const shadowRx = 36 * sc * (built.hover ? 0.7 : 1), shadowRy = 7 * sc;

  let vb = [0, 0, FRAME.w, FRAME.h];
  if (fit) {
    const b = union(boxThrough(built.box, chain), [FRAME.w / 2 - shadowRx, FRAME.ground - shadowRy, FRAME.w / 2 + shadowRx, FRAME.ground + shadowRy]);
    const pad = 8;
    vb = [b[0] - pad, b[1] - pad, b[2] - b[0] + pad * 2, b[3] - b[1] + pad * 2];
  }
  const height = Math.round((size * vb[3]) / vb[2]);
  const label = opts.label || `${g.name}, ${typeLabel(g)}`;
  const delay = animate ? ` style="animation-delay:-${num(((g.seed || '').length * 0.37 + (g.traits ? g.traits.size * 3 : 0)) % 3)}s"` : '';
  const clip = built.clip.map((d) => `<path d="${d}"/>`).join('');

  return `<svg class="cr${animate ? ' cr-live' : ''}" xmlns="http://www.w3.org/2000/svg" viewBox="${vb.map(num).join(' ')}" width="${size}" height="${height}" role="img" aria-label="${escapeHtml(label)}" style="${paletteVars(g.palette)}">` +
    `<defs><clipPath id="${id}-clip">${clip}</clipPath></defs>` +
    `<ellipse class="cr-shadow" cx="${num(FRAME.w / 2)}" cy="${FRAME.ground}" rx="${num(shadowRx)}" ry="${num(shadowRy)}" fill="var(--k)" opacity="0.18"/>` +
    `<g transform="${tf(chain[1])} translate(0 ${num(chain[0].y)})">` +
    `<g class="cr-anim"${delay}>${built.layers.join('')}</g></g></svg>`;
}

/** A neutral mannequin genome used by the Part Lab to preview any single part. */
function mannequinGenome(part) {
  const parts = {
    body: ['body.round', 'body.round'], head: ['head.round', 'head.round'], eyes: ['eye.round', 'eye.round'], mouth: ['mouth.smile', 'mouth.smile'],
    crown: ['crown.none', 'crown.none'], legs: ['legs.stub', 'legs.stub'], arms: ['arms.none', 'arms.none'], wings: ['wings.none', 'wings.none'],
    tail: ['tail.none', 'tail.none'], back: ['back.none', 'back.none'], pattern: ['pattern.none', 'pattern.none'],
  };
  const paint = {};
  if (part.slot === 'arms') parts.body = ['body.biped', 'body.biped'];
  if (part.slot === 'wings' || part.slot === 'tail' || part.slot === 'back') parts.body = ['body.quad', 'body.quad'];
  if (part.slot === 'eyes' || part.slot === 'mouth') parts.head = ['head.bulb', 'head.bulb'];
  if (part.slot === 'body' && part.sockets && !part.sockets.legs.length) parts.legs = ['legs.none', 'legs.none'];
  parts[part.slot] = [part.id, part.id];
  if (!['body', 'pattern', 'eyes', 'mouth'].includes(part.slot)) paint[part.slot] = 4; // accent-first
  return {
    v: 1, seed: 'mannequin', species: null, name: part.name, gen: 0, shiny: false, types: ['Normal', null],
    parts, paint,
    palette: { c1: [222, 10, 64], c2: [222, 12, 46], c3: [28, 80, 58], eye: [200, 55, 45] },
    traits: { size: 0.6, bulk: 0.5, headScale: 0.5, limbScale: 0.5, tailScale: 0.5, wingScale: 0.5, eyeScale: part.slot === 'eyes' ? 0.9 : 0.5 },
    stats: {}, vigor: {}, bst: 400, lineage: [],
  };
}

// UI pieces shared between screens.

// ---- src/core/rng.js ----
// Seeded random numbers. Every roll in the game goes through here so that a
// creature, a fusion, or a whole battle can be reproduced from its seed.
// Hash: cyrb128. Generator: sfc32. Both are small, fast and well distributed.

function hashSeed(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0, k; i < str.length; i++) {
    k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
}

function sfc32(a, b, c, d) {
  return function next() {
    a |= 0; b |= 0; c |= 0; d |= 0;
    const t = (((a + b) | 0) + d) | 0;
    d = (d + 1) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}

/** Create a deterministic RNG from any string or number seed. */
function makeRng(seed) {
  const seedStr = String(seed);
  const [a, b, c, d] = hashSeed(seedStr);
  const next = sfc32(a, b, c, d);
  for (let i = 0; i < 12; i++) next(); // warm up
  const rng = {
    seed: seedStr,
    /** float in [0,1) */
    next,
    /** integer in [0,n) */
    int(n) { return Math.floor(next() * n); },
    /** integer in [lo,hi] inclusive */
    between(lo, hi) { return lo + Math.floor(next() * (hi - lo + 1)); },
    /** float in [lo,hi) */
    range(lo, hi) { return lo + next() * (hi - lo); },
    /** true with probability p */
    chance(p) { return next() < p; },
    pick(arr) { return arr[Math.floor(next() * arr.length)]; },
    /** pick by weight; weightOf(item) must return a number >= 0 */
    weighted(items, weightOf) {
      let total = 0;
      for (const it of items) total += weightOf(it);
      if (total <= 0) return items[Math.floor(next() * items.length)];
      let r = next() * total;
      for (const it of items) { r -= weightOf(it); if (r < 0) return it; }
      return items[items.length - 1];
    },
    shuffle(arr) {
      const out = arr.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    },
    /** approx. normal(0,1) via sum of uniforms, cheap and good enough for trait jitter */
    gauss() { return (next() + next() + next() + next() - 2) * Math.SQRT2 * 0.5 * 1.4142; },
    /**
     * Derive an independent stream from a label. Depends only on the parent's
     * seed and the label, never on how many numbers were drawn, so call order
     * does not matter. Labels must be unique per parent.
     */
    fork(label) { return makeRng(seedStr + '/' + label); },
  };
  return rng;
}

/** The one place non-deterministic randomness is allowed: minting fresh seeds from the UI. */
function freshSeed() {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
    const buf = new Uint8Array(8);
    crypto.getRandomValues(buf);
    for (const b of buf) s += alphabet[b % alphabet.length];
  } else {
    for (let i = 0; i < 8; i++) s += alphabet[Math.floor(Math.random() * alphabet.length)];
  }
  return s;
}

// ---- src/ui/state.js ----
// Cross-screen state. In-memory for now; the save system (Phase 4) will persist it.
const fusionPool = { seed: null, genomes: [] };

const POOL_MAX = 24;

/** Add a genome to the fusion pool, newest first. Returns false if it was already there. */
function addToPool(g) {
  if (fusionPool.genomes.some((x) => x === g || (x.seed === g.seed && x.name === g.name && x.gen === g.gen))) return false;
  fusionPool.genomes.unshift(g);
  if (fusionPool.genomes.length > POOL_MAX) fusionPool.genomes.length = POOL_MAX;
  return true;
}

function removeFromPool(g) {
  const i = fusionPool.genomes.indexOf(g);
  if (i >= 0) fusionPool.genomes.splice(i, 1);
}

// ---- src/ui/lab.js ----
// Creature Lab: roll seeded creatures, inspect genes, copy and load creature codes.









const labState = { seed: null, species: 'random', count: 12 };

function seedFromUrl() {
  try { return new URLSearchParams(location.search).get('seed'); } catch { return null; }
}

function rollGenomes() {
  const out = [];
  for (let i = 0; i < labState.count; i++) {
    const rng = makeRng(`${labState.seed}:${i}`);
    const sp = SPECIES_BY_ID[labState.species];
    out.push(sp ? speciesGenome(sp, rng) : randomGenome(rng));
  }
  return out;
}

function renderLabScreen(root) {

// ---- src/creature/fusion.js ----
// Fusion: two genomes in, one genome out, plus a report of what came from where.
//
// Heredity is diploid. For every slot the child draws one allele from each
// parent at random; the allele with the higher dominance (plus a little noise)
// is expressed and the other is carried. That keeps identities crisp across
// generations and lets a grandparent's trait resurface.
//
// The "identity parent" is whichever parent supplied the expressed head (or the
// body, for headless children). It gives the name prefix, the palette base and
// the primary type. The other parent gives the suffix, one accent colour and the
// secondary type. Shape from one side, colours from the other: that is what
// makes a fusion read as half and half.







const FUSE = {
  dominanceNoise: 0.15,   // +/- added to each allele's dominance before comparing
  expressedMutation: 0.03,
  carriedMutation: 0.06,
  bodyMutation: 0.01,
  paintSwap: 0.05,
  genBonusPerGen: 4,      // bst bonus per generation
  genBonusCap: 5,         // generations that count toward the bonus
  maxLineage: 16,
};

function dominanceOf(id) {
  const p = getPart(id);
  return p ? p.dom : 0.3;
}

function fitsBody(id, kind) {
  const p = getPart(id);
  return Boolean(p) && partFits(p, kind);
}

function nudgeColor(c, rng) {
  return [c[0] + rng.gauss() * 3, clamp01((c[1] + rng.gauss() * 2) / 100) * 100, clamp01((c[2] + rng.gauss() * 2) / 100) * 100].map(round3);
}

function namePartsOf(g) {
  return Array.isArray(g.nameParts) && g.nameParts.length === 2 ? g.nameParts : splitName(g.name);
}

/**
 * Fuse a and b. Deterministic for a given rng seed.
 * Returns { child, report } where report = { from: {slot: 0|1}, mutated: {slot: true},
 *   identity: 0|1, palette: {c1|c2|c3|eye: 0|1|'blend'}, types: {primary: 0|1, secondary: 0|1|null} }.
 */
function fuse(a, b, rng) {
  const rParts = rng.fork('parts');
  const rMut = rng.fork('mutation');
  const rPaint = rng.fork('paint');
  const rPal = rng.fork('palette');
  const rTraits = rng.fork('traits');
  const rStats = rng.fork('stats');
  const rAbility = rng.fork('ability');
  const parents = [a, b];

  const draw = (slot) => {
    const fromA = a.parts[slot][rParts.int(2)];
    const fromB = b.parts[slot][rParts.int(2)];
    const dA = dominanceOf(fromA) + rParts.range(-FUSE.dominanceNoise, FUSE.dominanceNoise);
    const dB = dominanceOf(fromB) + rParts.range(-FUSE.dominanceNoise, FUSE.dominanceNoise);
    return dA >= dB ? { alleles: [fromA, fromB], from: 0 } : { alleles: [fromB, fromA], from: 1 };
  };

  const parts = {}, from = {}, mutated = {};
  const bodyDraw = draw('body');
  parts.body = bodyDraw.alleles;
  from.body = bodyDraw.from;
  if (rMut.chance(FUSE.bodyMutation)) { parts.body = [randomPartId('body', null, rMut), parts.body[0]]; mutated.body = true; }
  const bodyKind = getPart(parts.body[0]).kind;

  for (const slot of SLOTS) {
    if (slot === 'body') continue;
    const d = draw(slot);
    let [e, c] = d.alleles;
    let f = d.from;
    if (!fitsBody(e, bodyKind) && fitsBody(c, bodyKind)) { [e, c] = [c, e]; f = 1 - f; }
    if (rMut.chance(FUSE.expressedMutation)) { c = e; e = randomPartId(slot, bodyKind, rMut); mutated[slot] = true; }
    else if (rMut.chance(FUSE.carriedMutation)) c = randomPartId(slot, bodyKind, rMut);
    parts[slot] = [e, c];
    from[slot] = f;
  }

  const headPart = getPart(parts.head[0]);
  const identity = headPart && !headPart.none && !mutated.head ? from.head : from.body;
  const P1 = parents[identity], P2 = parents[1 - identity];

  // Paint travels with the part that was expressed.
  const paint = {};
  for (const slot of PAINT_SLOTS) {
    const src = parents[from[slot] == null ? identity : from[slot]];
    paint[slot] = (src.paint && PAINT_PERMS[src.paint[slot]]) ? src.paint[slot] : 0;
    if (rPaint.chance(FUSE.paintSwap)) paint[slot] = rPaint.int(PAINT_PERMS.length);
  }

  // Palette: base from the identity parent, one colour from the other parent.
  const palette = {}, palFrom = {};
  for (const k of ['c1', 'c2', 'c3']) { palette[k] = nudgeColor(P1.palette[k], rPal); palFrom[k] = identity; }
  const roll = rPal.next();
  if (roll < 0.55) {
    const k = rPal.pick(['c2', 'c3']);
    palette[k] = nudgeColor(P2.palette.c1, rPal); palFrom[k] = 1 - identity;
  } else if (roll < 0.85) {
    palette.c1 = blendColor(P1.palette.c1, P2.palette.c1, rPal.range(0.35, 0.65)); palFrom.c1 = 'blend';
    const k = rPal.pick(['c2', 'c3']);
    palette[k] = nudgeColor(P2.palette[k], rPal); palFrom[k] = 1 - identity;
  }
  const eyeFrom = rPal.chance(0.5) ? identity : 1 - identity;
  palette.eye = parents[eyeFrom].palette.eye.slice();
  palFrom.eye = eyeFrom;

  const traits = {};
  for (const k of TRAIT_KEYS) {
    const t = clamp01(0.5 + rTraits.gauss() * 0.15);
    const av = a.traits && a.traits[k] != null ? a.traits[k] : 0.5;
    const bv = b.traits && b.traits[k] != null ? b.traits[k] : 0.5;
    traits[k] = round3(clamp01(lerp(av, bv, t) + rTraits.gauss() * 0.04));
  }

  const primary = P1.types[0];
  let secondary = null, secondaryFrom = null;
  const candidates = [[P2.types[0], 1 - identity], [P2.types[1], 1 - identity], [P1.types[1], identity]];
  for (const [t, src] of candidates) if (t && t !== primary) { secondary = t; secondaryFrom = src; break; }

  const wa = normalizeWeights(a.stats), wb = normalizeWeights(b.stats);
  const stats = {};
  for (const k of STAT_KEYS) stats[k] = round3((wa[k] + wb[k]) / 2);
  const gen = Math.max(a.gen || 0, b.gen || 0) + 1;
  const bst = Math.round(((a.bst || 400) + (b.bst || 400)) / 2 + Math.min(gen, FUSE.genBonusCap) * FUSE.genBonusPerGen);
  const vigor = {};
  for (const k of STAT_KEYS) {
    const av = a.vigor && a.vigor[k] != null ? a.vigor[k] : 0.5;
    const bv = b.vigor && b.vigor[k] != null ? b.vigor[k] : 0.5;
    const base = rStats.chance(0.6) ? Math.max(av, bv) : (av + bv) / 2;
    vigor[k] = round3(clamp01(base + rStats.gauss() * 0.03));
  }

  const nameParts = [namePartsOf(P1)[0], namePartsOf(P2)[1]];
  const lineage = [...(a.lineage || []), ...(b.lineage || [])].filter((x, i, arr) => arr.indexOf(x) === i).slice(-FUSE.maxLineage);

  const child = {
    v: GENOME_VERSION,
    seed: rng.seed,
    species: null,
    name: joinNameParts(nameParts[0], nameParts[1]),
    nameParts,
    gen,
    shiny: Boolean(P1.shiny),
    types: [primary, secondary],
    parts, paint, palette, traits, stats, vigor, bst, lineage,
    parents: [a.name, b.name],
    learnset: fuseLearnsets(a, b, [primary, secondary]),
    ability: rAbility.chance(0.6) ? P1.ability : P2.ability,
  };
  return {
    child,
    report: { from, mutated, identity, palette: palFrom, types: { primary: identity, secondary: secondaryFrom } },
  };
}

/**
 * A child's learnset: both parents' moves that match the child's types (Normal
 * always counts), lowest level wins on duplicates, padded with universal moves
 * when thin, capped at twelve keeping the two earliest and the ten latest.
 */
function fuseLearnsets(a, b, types) {
  const ok = new Set(['Normal', ...types.filter(Boolean)]);
  const byId = new Map();
  for (const [lvl, id] of [...learnsetOf(a), ...learnsetOf(b)]) {
    const mv = getMove(id);
    if (!mv || !ok.has(mv.type)) continue;
    if (!byId.has(id) || byId.get(id) > lvl) byId.set(id, lvl);
  }
  for (const [lvl, id] of UNIVERSAL_LEARNSET) if (byId.size < 6 && !byId.has(id)) byId.set(id, lvl);
  const list = [...byId.entries()].map(([id, lvl]) => [lvl, id]).sort((p, q) => p[0] - q[0] || (p[1] < q[1] ? -1 : 1));
  return list.length <= 12 ? list : [...list.slice(0, 2), ...list.slice(-10)];
}

/** Fuse a chain: start with `first`, then fold in each partner in turn. Returns every generation. */
function fuseChain(first, partners, rng) {
  const out = [first];
  let cur = first;
  partners.forEach((p, i) => {
    cur = fuse(cur, p, rng.fork(`gen${i}`)).child;
    out.push(cur);
  });
  return out;
}

// ---- src/ui/fusion.js ----
// Fusion Lab: pick two creatures from a pool, fuse them, read the inheritance
// report, feed children back into the pool, and stress-test five generations.










const fs = { a: null, b: null, child: null, report: null, rerolls: 0, chain: null, next: 'a' };

function seedPool(seed) {
  fusionPool.seed = seed;
  fusionPool.genomes = [];
  for (let i = 0; i < 8; i++) fusionPool.genomes.push(randomGenome(makeRng(`${seed}:pool:${i}`)));
  Object.assign(fs, { a: null, b: null, child: null, report: null, chain: null, rerolls: 0, next: 'a' });
}

function badge(who, extra) {
  if (who === 'blend') return h('span', { class: 'badge blend' }, 'A+B');
  return h('span', { class: `badge ${who === 0 ? 'a' : 'b'}` }, who === 0 ? 'A' : 'B', extra || null);
}

let poolListener = null;

function renderFusionScreen(root) {
  if (!fusionPool.genomes.length) seedPool('FUSE');
  else if (!fusionPool.seed) fusionPool.seed = 'FUSE';
  clear(root);

  const rerender = () => renderFusionScreen(root);
  if (poolListener) window.removeEventListener('pool-changed', poolListener);
  poolListener = () => { if (root.isConnected) rerender(); else window.removeEventListener('pool-changed', poolListener); };
  window.addEventListener('pool-changed', poolListener);

  const pick = (g) => {
    if (fs.a === g) { fs.a = null; fs.next = 'a'; }
    else if (fs.b === g) { fs.b = null; fs.next = 'b'; }
    else if (!fs.a) { fs.a = g; fs.next = fs.b ? 'a' : 'b'; }
    else if (!fs.b) { fs.b = g; fs.next = 'a'; }
    else if (fs.next === 'a') { fs.a = g; fs.next = 'b'; }
    else { fs.b = g; fs.next = 'a'; }
    rerender();
  };

  const slot = (who, g) => h('button', { class: `pslot${g ? ' filled' : ''}`, type: 'button', onclick: () => { if (g) pick(g); } },
    h('span', { class: 'tag' }, `PARENT ${who}`),
    g ? [creatureEl(g, { size: 150, animate: false }), h('b', {}, g.name), typeChips(g.types)] : h('span', { class: 'hint' }, 'Tap a creature in the pool'));

  const doFuse = () => {
    const rng = makeRng(`${fs.a.seed}|${fs.a.name}+${fs.b.seed}|${fs.b.name}#${fs.rerolls}`);
    const { child, report } = fuse(fs.a, fs.b, rng);
    fs.child = child; fs.report = report; fs.chain = null;
    rerender();
    setTimeout(() => { const r = root.querySelector('.result'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 0);
  };

  root.append(
    h('div', { class: 'parents' }, slot('A', fs.a), h('div', { class: 'times' }, '×'), slot('B', fs.b)),
    h('button', { class: 'btn primary fuse-btn', type: 'button', disabled: !(fs.a && fs.b), onclick: () => { fs.rerolls = 0; doFuse(); } }, 'Fuse'),
  );

  if (fs.child) root.append(resultPanel(fs.child, fs.report, fs.a, fs.b, {
    reroll: () => { fs.rerolls++; doFuse(); },
    breed: () => {
      const rng = makeRng(`${fs.child.seed}:chain`);
      const partners = [];
      for (let i = 0; i < 5; i++) partners.push(rng.pick(fusionPool.genomes));
      fs.chain = fuseChain(fs.child, partners, rng);
      rerender();
      setTimeout(() => { const c = root.querySelector('.chain'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 0);
    },
    chain: fs.chain,
  }));

  // pool
  const codeInput = h('input', { class: 'seed code-in', type: 'text', placeholder: 'Paste a creature code to add it', 'aria-label': 'Creature code', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false' });
  const poolGrid = h('div', { class: 'pool' });
  for (const g of fusionPool.genomes) {
    const cls = g === fs.a ? ' is-a' : g === fs.b ? ' is-b' : '';
    poolGrid.append(h('button', { class: `pcard${cls}`, type: 'button', onclick: () => pick(g) },
      g === fs.a ? h('span', { class: 'sel badge a' }, 'A') : g === fs.b ? h('span', { class: 'sel badge b' }, 'B') : null,
      g.gen ? h('span', { class: 'gen' }, `gen ${g.gen}`) : null,
      creatureEl(g, { size: 104, animate: false }),
      h('span', {}, g.name)));
  }
  root.append(
    ...section(`Pool · ${fusionPool.genomes.length}`,
      h('div', { class: 'toolbar' },
        h('button', { class: 'btn', type: 'button', onclick: () => { seedPool(freshSeed()); rerender(); } }, 'New pool'),
        h('button', { class: 'btn', type: 'button', onclick: () => { for (let i = 0; i < 4; i++) addToPool(randomGenome(makeRng(freshSeed()))); rerender(); } }, '+4 wild')),
      h('div', { class: 'toolbar' },
        codeInput,
        h('button', { class: 'btn', type: 'button', onclick: () => {
          try { addToPool(decodeGenome(codeInput.value)); codeInput.value = ''; rerender(); } catch (e) { toast(e.message); }
        } }, 'Add')),
      h('p', { class: 'hint' }, 'Tap to choose parents. Tap a chosen one again to clear it. Long lists scroll.'),
      poolGrid),
  );
}

function resultPanel(child, report, a, b, actions) {
  const parents = [a, b];
  const parts = resolveParts(child);
  const rows = [];
  for (const slot of SLOTS) {
    const p = parts[slot];
    rows.push(h('span', {}, SLOT_NAMES[slot]), h('span', {}, p ? p.name : 'None'),
      h('span', {}, report.mutated[slot] ? h('span', { class: 'badge m' }, 'mutation') : badge(report.from[slot])));
  }
  const palRows = ['c1', 'c2', 'c3', 'eye'].map((k) => h('div', { class: 'sw-row' },
    h('span', { class: 'sw small', style: { background: swatchCss(child.palette[k]) } }),
    h('span', {}, { c1: 'Primary', c2: 'Secondary', c3: 'Accent', eye: 'Eyes' }[k]), badge(report.palette[k])));
  const typeRow = h('div', { class: 'sw-row' }, typeChips([child.types[0]]), badge(report.types.primary),
    child.types[1] ? [typeChips([child.types[1]]), badge(report.types.secondary)] : h('span', { class: 'hint', style: { margin: 0 } }, 'no second type'));

  const panel = h('div', { class: 'result' },
    h('div', { class: 'sheet-head' }, h('h2', {}, child.name, child.shiny ? ' ✦' : ''), typeChips(child.types)),
    h('p', { class: 'meta' }, `gen ${child.gen} · ${a.name} × ${b.name} · face from ${parents[report.identity].name}`),
    h('div', { class: 'hero' }, creatureEl(child, { size: 240, fit: true })),
    h('div', { class: 'row wrap' },
      h('button', { class: 'btn', type: 'button', onclick: actions.reroll }, 'Re-roll'),
      h('button', { class: 'btn', type: 'button', onclick: () => { toast(addToPool(child) ? 'Added to pool' : 'Already in pool'); window.dispatchEvent(new CustomEvent('pool-changed')); } }, 'Add to pool'),
      h('button', { class: 'btn', type: 'button', onclick: () => openSheet(child) }, 'Details'),
      h('button', { class: 'btn', type: 'button', onclick: async () => toast((await copyText(encodeGenome(child))) ? 'Code copied' : 'Copy failed') }, 'Copy code')),
    ...section('Inheritance', h('div', { class: 'inherit' }, rows)),
    ...section('Colours', h('div', { class: 'stack' }, palRows)),
    ...section('Types', typeRow),
    ...section('Stability test',
      h('p', { class: 'hint' }, 'Breed this child with random pool members for five more generations to check that fusions stay coherent.'),
      h('button', { class: 'btn', type: 'button', onclick: actions.breed }, 'Breed 5 generations')),
  );
  if (actions.chain) {
    const strip = h('div', { class: 'chain' });
    actions.chain.forEach((g, i) => strip.append(h('button', { class: 'pcard', type: 'button', onclick: () => openSheet(g) },
      h('span', { class: 'gen' }, `gen ${g.gen}`), creatureEl(g, { size: 120, animate: false }), h('span', {}, g.name))));
    panel.append(strip);
  }
  return panel;
}

// ---- src/battle/stats.js ----
// Level scaling and move selection. Pure functions over genomes.



/** HP gets a global lift so battles last a hit or two longer than the raw formula gives. */
const HP_SCALE = 1.15;

/** Classic level formula. Vigor genes play the role of IVs (0..31). */
function statsAtLevel(genome, level) {
  const base = baseStats(genome);
  const L = Math.max(1, Math.min(100, Math.round(level)));
  const iv = (k) => Math.round((genome.vigor && genome.vigor[k] != null ? genome.vigor[k] : 0.5) * 31);
  const out = { hp: Math.floor((Math.floor(((2 * base.hp + iv('hp')) * L) / 100) + L + 10) * HP_SCALE) };
  for (const k of STAT_KEYS) if (k !== 'hp') out[k] = Math.floor(((2 * base[k] + iv(k)) * L) / 100) + 5;
  return out;
}

/** Up to four moves known at a level: the most recently learned, always including a damaging one. */
function movesAtLevel(learnset, level) {
  const known = [];
  for (const [lvl, id] of learnset) if (lvl <= level && getMove(id) && !known.includes(id)) known.push(id);
  let picked = known.slice(-4);
  if (!picked.some((id) => isDamaging(getMove(id)))) {
    const dmg = [...known].reverse().find((id) => isDamaging(getMove(id)));
    if (dmg) picked = [dmg, ...picked.slice(1)];
  }
  return picked.length ? picked : ['bump'];
}

// ---- src/battle/engine.js ----
// Battle engine. Pure and deterministic: step(state, actions) returns a new
// state plus the list of events that happened, and never touches the input.
// All randomness comes from the battle seed and turn number, so a battle can
// be replayed from its initial state and action log.
//
// Shape: two sides, each with a party (up to 5) and one active battler.
// Phases: 'choose' (both sides act), 'replace' (a side whose active fainted
// must send in another, free), 'over'.









const STATUS_INFO = {
  brn: { name: 'Burn', short: 'BRN', verb: 'was burned' },
  psn: { name: 'Poison', short: 'PSN', verb: 'was poisoned' },
  par: { name: 'Paralysis', short: 'PAR', verb: 'is paralyzed' },
  slp: { name: 'Sleep', short: 'SLP', verb: 'fell asleep' },
  frz: { name: 'Freeze', short: 'FRZ', verb: 'was frozen solid' },
};
const STAT_LABEL = { atk: 'Attack', def: 'Defense', spa: 'Sp. Atk', spd: 'Sp. Def', spe: 'Speed', acc: 'accuracy', eva: 'evasion' };
const MAX_PARTY = 5;

const stageMul = (n) => (n >= 0 ? (2 + n) / 2 : 2 / (2 - n));
const accMul = (n) => (n >= 0 ? (3 + n) / 3 : 3 / (3 - n));
const SURGE = { ember_heart: 'Fire', tide_heart: 'Water', bloom_heart: 'Grass' };

/** Build a battler from a genome at a level. opts.moves / opts.ability override the defaults. */
function makeBattler(genome, level, opts = {}) {
  const stats = statsAtLevel(genome, level);
  const moveIds = (opts.moves && opts.moves.length ? opts.moves : movesAtLevel(learnsetOf(genome), level)).slice(0, 4);
  return {
    uid: opts.uid || null,
    name: genome.name,
    level,
    types: [genome.types[0], genome.types[1] || null],
    genome,
    stats,
    maxHp: stats.hp,
    hp: stats.hp,
    moves: moveIds.map((id) => { const mv = getMove(id) || getMove('bump'); return { id: mv.id, pp: mv.pp, maxPp: mv.pp }; }),
    ability: opts.ability || genome.ability || 'lucky_streak',
    xp: opts.xp || null, // { cur, prev, next } progress toward the next level, for display only
    status: null,
    sleepTurns: 0,
    stages: { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, acc: 0, eva: 0 },
    flinch: false,
    moved: false,
    fainted: false,
    lastMove: null,
  };
}

function activeOf(state, side) { const s = state.sides[side]; return s.party[s.active]; }
function aliveCount(side) { return side.party.filter((b) => !b.fainted).length; }

/**
 * Chance (0..1) that a capture attempt on this battler succeeds right now.
 * Low HP and status help; rarer species and fusions resist more.
 */
function captureChance(b) {
  const sp = b.genome && b.genome.species ? SPECIES_BY_ID[b.genome.species] : null;
  let base = sp ? (sp.tier === 'rare' ? 0.45 : sp.tier === 'uncommon' ? 0.7 : 1) : 0.7;
  if (b.genome && b.genome.gen > 0) base *= 0.7;
  const hpFactor = 1 - (2 / 3) * (b.hp / b.maxHp);
  const statusMul = b.status === 'slp' || b.status === 'frz' ? 2 : b.status ? 1.5 : 1;
  return clamp(0.08 + 0.72 * hpFactor * base * statusMul, 0.03, 0.95);
}

/**
 * Start a battle. sides: [{ name, party: [battler...], ai }, ...]. Returns { state, events }.
 * capturable: side 0 may try to capture side 1's active creature (wild encounters).
 */
function createBattle({ sides, seed = 'battle', capturable = false }) {
  if (!sides || sides.length !== 2) throw new Error('A battle needs exactly two sides.');
  const state = {
    seed: String(seed),
    turn: 0,
    phase: 'choose',
    winner: null,
    capturable: Boolean(capturable),
    captured: null,
    sides: sides.map((s, si) => {
      if (!s.party || !s.party.length) throw new Error(`Side ${si} has an empty party.`);
      return {
        name: s.name || (si === 0 ? 'You' : 'Foe'),
        ai: Boolean(s.ai),
        active: 0,
        needsReplace: false,
        party: s.party.slice(0, MAX_PARTY).map((b, bi) => ({ ...structuredClone(b), uid: `s${si}b${bi}` })),
      };
    }),
  };
  const events = [];
  const rng = makeRng(`${state.seed}:start`);
  for (const i of [0, 1]) events.push({ t: 'switch', side: i, name: activeOf(state, i).name, uid: activeOf(state, i).uid, initial: true });
  for (const i of speedOrder(state, rng)) entryHooks(state, i, events);
  return { state, events };
}

/** What a side may do right now. Empty when it is not this side's turn to act. */
function legalActions(state, side) {
  const s = state.sides[side];
  const me = activeOf(state, side);
  const switches = s.party.map((b, i) => ({ type: 'switch', index: i })).filter((a) => a.index !== s.active && !s.party[a.index].fainted);
  if (state.phase === 'over') return [];
  if (state.phase === 'replace') return s.needsReplace ? switches : [];
  const moves = me.moves.map((mv, i) => ({ type: 'move', index: i })).filter((a) => me.moves[a.index].pp > 0);
  const capture = state.capturable && side === 0 && !activeOf(state, 1).fainted ? [{ type: 'capture' }] : [];
  return [...(moves.length ? moves : [{ type: 'move', index: -1, struggle: true }]), ...capture, ...switches];
}

function sameAction(a, b) { return a && b && a.type === b.type && a.index === b.index; }

function speedOrder(state, rng) {
  const s0 = effectiveStat(activeOf(state, 0), 'spe'), s1 = effectiveStat(activeOf(state, 1), 'spe');
  if (s0 === s1) return rng.chance(0.5) ? [0, 1] : [1, 0];
  return s0 > s1 ? [0, 1] : [1, 0];
}

function effectiveStat(b, k) {
  let v = b.stats[k] * stageMul(b.stages[k]);
  if (k === 'spe' && b.status === 'par') v *= 0.5;
  return v;
}

/** One step of the battle. actions[i] is side i's action (null when that side does not act this phase). */
function step(input, actions) {
  const state = structuredClone(input);
  const events = [];
  if (state.phase === 'over') return { state, events };
  const rng = makeRng(`${state.seed}:t${state.turn}:${state.phase}`);

  if (state.phase === 'replace') {
    for (const i of [0, 1]) {
      const side = state.sides[i];
      if (!side.needsReplace) continue;
      const a = actions[i];
      if (!legalActions(state, i).some((x) => sameAction(x, a))) throw new Error(`Side ${i} must send in a replacement.`);
      doSwitch(state, i, a.index, events, true);
      side.needsReplace = false;
    }
    for (const i of speedOrder(state, rng)) if (state.sides[i].party[state.sides[i].active].justEntered) entryHooks(state, i, events);
    state.phase = 'choose';
    return { state, events };
  }

  for (const i of [0, 1]) {
    if (!legalActions(state, i).some((x) => sameAction(x, actions[i]))) throw new Error(`Illegal action for side ${i}: ${JSON.stringify(actions[i])}`);
  }
  state.turn++;
  events.push({ t: 'turn', n: state.turn });
  for (const i of [0, 1]) { const b = activeOf(state, i); b.moved = false; b.flinch = b.flinch && false; }

  // Order: switches first, then moves by priority, then speed, ties random.
  const order = [0, 1].map((i) => {
    const a = actions[i];
    const prio = a.type === 'switch' || a.type === 'capture' ? 100 : (a.struggle ? 0 : getMove(activeOf(state, i).moves[a.index].id).prio);
    return { i, a, prio, spe: effectiveStat(activeOf(state, i), 'spe'), tie: rng.next() };
  }).sort((x, y) => (y.prio - x.prio) || (y.spe - x.spe) || (y.tie - x.tie));

  for (const o of order) {
    if (state.phase === 'over') break;
    if (o.a.type === 'capture') {
      attemptCapture(state, events, rng);
      if (state.phase === 'over') return { state, events };
    } else if (o.a.type === 'switch') {
      doSwitch(state, o.i, o.a.index, events, false);
      entryHooks(state, o.i, events);
    } else {
      executeMove(state, o.i, o.a, events, rng);
    }
    if (checkEnd(state, events)) return { state, events };
  }

  endOfTurn(state, events, rng);
  if (checkEnd(state, events)) return { state, events };

  for (const i of [0, 1]) {
    if (activeOf(state, i).fainted) { state.sides[i].needsReplace = true; state.phase = 'replace'; }
  }
  return { state, events };
}

function attemptCapture(state, events, rng) {
  const target = activeOf(state, 1);
  const perShake = Math.cbrt(captureChance(target));
  let shakes = 0;
  for (let k = 0; k < 3; k++) { if (rng.chance(perShake)) shakes++; else break; }
  if (shakes === 3) {
    events.push({ t: 'capture', ok: true, side: 1, name: target.name, shakes });
    state.captured = target.uid;
    state.phase = 'over';
    state.winner = 0;
    events.push({ t: 'end', winner: 0, capture: true, name: target.name });
  } else {
    events.push({ t: 'capture', ok: false, side: 1, name: target.name, shakes });
  }
}

function doSwitch(state, i, index, events, forced) {
  const side = state.sides[i];
  const out = side.party[side.active];
  if (!out.fainted && !forced) {
    if (out.ability === 'second_wind' && out.hp < out.maxHp) {
      const amount = Math.min(out.maxHp - out.hp, Math.floor(out.maxHp / 3));
      out.hp += amount;
      events.push({ t: 'ability', side: i, name: out.name, ability: abilityName(out.ability) });
      events.push({ t: 'heal', side: i, name: out.name, amount, hp: out.hp, maxHp: out.maxHp });
    }
  }
  out.stages = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, acc: 0, eva: 0 };
  out.flinch = false;
  side.active = index;
  const inn = side.party[index];
  inn.justEntered = true;
  events.push({ t: 'switch', side: i, name: inn.name, uid: inn.uid, from: out.name, forced });
}

function entryHooks(state, i, events) {
  const me = activeOf(state, i);
  me.justEntered = false;
  const foe = activeOf(state, 1 - i);
  if (me.ability === 'menace' && !foe.fainted) {
    events.push({ t: 'ability', side: i, name: me.name, ability: abilityName(me.ability) });
    changeStages(state, 1 - i, { atk: -1 }, events);
  }
}

function canHaveStatus(b, status, mv) {
  if (b.status || b.fainted) return false;
  const t = b.types;
  if (mv && mv.flags.includes('powder') && t.includes('Grass')) return false;
  switch (status) {
    case 'brn': return !t.includes('Fire') && b.ability !== 'damp_coat';
    case 'psn': return !t.includes('Poison') && !t.includes('Steel') && b.ability !== 'antitoxin';
    case 'par': return !t.includes('Electric') && b.ability !== 'loose_joints';
    case 'slp': return b.ability !== 'restless';
    case 'frz': return !t.includes('Ice') && b.ability !== 'warm_core';
    default: return false;
  }
}

function setStatus(state, side, status, events, rng, mv) {
  const b = activeOf(state, side);
  if (!canHaveStatus(b, status, mv)) return false;
  b.status = status;
  if (status === 'slp') b.sleepTurns = rng.between(1, 3);
  events.push({ t: 'status', side, name: b.name, status });
  return true;
}

function changeStages(state, side, stats, events) {
  const b = activeOf(state, side);
  if (b.fainted) return;
  for (const [k, n] of Object.entries(stats)) {
    if (k === 'acc' && n < 0 && b.ability === 'hawkeye') { events.push({ t: 'ability', side, name: b.name, ability: abilityName(b.ability) }); continue; }
    const cur = b.stages[k];
    const next = clamp(cur + n, -6, 6);
    events.push({ t: 'stat', side, name: b.name, stat: k, stages: next - cur, wanted: n });
    b.stages[k] = next;
  }
}

function healBattler(state, side, amount, events, why) {
  const b = activeOf(state, side);
  const real = Math.max(0, Math.min(b.maxHp - b.hp, Math.floor(amount)));
  if (real <= 0) return 0;
  b.hp += real;
  events.push({ t: 'heal', side, name: b.name, amount: real, hp: b.hp, maxHp: b.maxHp, why });
  return real;
}

function hurtBattler(state, side, amount, events, why) {
  const b = activeOf(state, side);
  if (b.fainted) return 0;
  const real = Math.max(1, Math.min(b.hp, Math.floor(amount)));
  b.hp -= real;
  events.push({ t: 'hurt', side, name: b.name, amount: real, hp: b.hp, maxHp: b.maxHp, why });
  if (b.hp <= 0) faint(state, side, events);
  return real;
}

function faint(state, side, events) {
  const b = activeOf(state, side);
  b.hp = 0;
  b.fainted = true;
  b.status = null;
  events.push({ t: 'faint', side, name: b.name, uid: b.uid });
}

function moveOfAction(b, a) { return a.struggle ? STRUGGLE : getMove(b.moves[a.index].id); }

/**
 * Damage for one hit. `roll` is the random factor in [0.85, 1], `crit` a boolean.
 * Exported so the AI can estimate with roll = 0.925 and no crit.
 */
function calcDamage(user, target, mv, eff, roll, crit) {
  const fixed = moveFx(mv, 'fixed');
  if (fixed) return user.level;
  const atkKey = mv.cat === 'phys' ? 'atk' : 'spa';
  const defKey = mv.cat === 'phys' ? 'def' : 'spd';
  const aStage = crit ? Math.max(0, user.stages[atkKey]) : user.stages[atkKey];
  const dStage = crit ? Math.min(0, target.stages[defKey]) : target.stages[defKey];
  let A = user.stats[atkKey] * stageMul(aStage);
  const D = Math.max(1, target.stats[defKey] * stageMul(dStage));
  if (user.ability === 'grit' && user.status && mv.cat === 'phys') A *= 1.5;
  let power = mv.power;
  const bis = moveFx(mv, 'boostIfStatus');
  if (bis && target.status) power *= bis.m;
  if (user.ability === 'finesse' && power <= 60) power *= 1.5;
  if (user.ability === 'heavy_hands' && mv.flags.includes('punch')) power *= 1.2;
  if (user.ability === 'vice_jaw' && mv.flags.includes('bite')) power *= 1.5;
  if (user.ability === 'daredevil' && moveFx(mv, 'recoil')) power *= 1.2;
  if (SURGE[user.ability] === mv.type && user.hp <= user.maxHp / 3) power *= 1.5;
  let dmg = Math.floor(Math.floor((Math.floor((2 * user.level) / 5) + 2) * power * A / D) / 50) + 2;
  if (crit) dmg = Math.floor(dmg * 1.5);
  dmg = Math.floor(dmg * roll);
  if (!mv.typeless && user.types.includes(mv.type)) dmg = Math.floor(dmg * (user.ability === 'purebred' ? 2 : 1.5));
  dmg = Math.floor(dmg * eff);
  if (user.status === 'brn' && mv.cat === 'phys' && user.ability !== 'grit') dmg = Math.floor(dmg / 2);
  if (target.ability === 'blubber' && (mv.type === 'Fire' || mv.type === 'Ice')) dmg = Math.floor(dmg / 2);
  return Math.max(1, dmg);
}

/** Type effectiveness of a move against a battler, including ability immunities. 0 means no effect. */
function moveEffectiveness(mv, target) {
  if (mv.typeless) return 1;
  if (mv.type === 'Ground' && target.ability === 'hover') return 0;
  if ((mv.type === 'Water' && target.ability === 'sponge') || (mv.type === 'Electric' && target.ability === 'capacitor')) return 0;
  return typeEffectiveness(mv.type, target.types);
}

function hitChance(user, target, mv) {
  if (mv.acc == null) return 1;
  const stage = clamp(user.stages.acc - target.stages.eva, -6, 6);
  return Math.min(1, (mv.acc / 100) * accMul(stage));
}

function executeMove(state, i, action, events, rng) {
  const user = activeOf(state, i);
  const foeSide = 1 - i;
  const target = activeOf(state, foeSide);
  if (user.fainted) return;
  const mv = moveOfAction(user, action);

  if (user.flinch) { user.flinch = false; user.moved = true; events.push({ t: 'flinch', side: i, name: user.name }); return; }
  if (user.status === 'slp') {
    user.sleepTurns--;
    if (user.sleepTurns > 0) { user.moved = true; events.push({ t: 'status_skip', side: i, name: user.name, status: 'slp' }); return; }
    user.status = null;
    events.push({ t: 'cure', side: i, name: user.name, status: 'slp' });
  }
  if (user.status === 'frz') {
    if (mv.type === 'Fire' || rng.chance(0.2)) { user.status = null; events.push({ t: 'cure', side: i, name: user.name, status: 'frz' }); }
    else { user.moved = true; events.push({ t: 'status_skip', side: i, name: user.name, status: 'frz' }); return; }
  }
  if (user.status === 'par' && rng.chance(0.25)) { user.moved = true; events.push({ t: 'status_skip', side: i, name: user.name, status: 'par' }); return; }

  if (!action.struggle) user.moves[action.index].pp = Math.max(0, user.moves[action.index].pp - 1);
  user.lastMove = mv.id;
  user.moved = true;
  events.push({ t: 'move', side: i, name: user.name, move: mv.name, moveId: mv.id, type: mv.type, cat: mv.cat });

  const targetsFoe = isDamaging(mv) || mv.fx.some((f) => f.k === 'status' || (f.k === 'stat' && f.who === 'foe'));
  if (targetsFoe) {
    if (target.fainted) { events.push({ t: 'no_target', side: i }); return; }
    if (!rng.chance(hitChance(user, target, mv))) { events.push({ t: 'miss', side: i, name: user.name, target: target.name }); return; }
  }

  if (!isDamaging(mv)) { applyStatusMove(state, i, mv, events, rng); return; }

  const eff = moveEffectiveness(mv, target);
  if (eff === 0) {
    if (target.ability === 'hover' && mv.type === 'Ground') events.push({ t: 'ability', side: foeSide, name: target.name, ability: abilityName(target.ability) });
    if ((target.ability === 'sponge' && mv.type === 'Water') || (target.ability === 'capacitor' && mv.type === 'Electric')) {
      events.push({ t: 'ability', side: foeSide, name: target.name, ability: abilityName(target.ability) });
      if (!healBattler(state, foeSide, target.maxHp / 4, events, 'absorb')) events.push({ t: 'immune', side: foeSide, name: target.name });
      return;
    }
    events.push({ t: 'immune', side: foeSide, name: target.name });
    return;
  }

  const multi = moveFx(mv, 'multi');
  const hits = multi ? rng.pick([2, 2, 3, 3, 4, 5].filter((n) => n >= multi.min && n <= multi.max)) : 1;
  let total = 0, landed = 0;
  for (let h = 0; h < hits; h++) {
    if (target.fainted) break;
    const crit = rng.chance(mv.crit >= 1 ? 1 / 8 : 1 / 24);
    const roll = rng.between(85, 100) / 100;
    let dmg = calcDamage(user, target, mv, eff, roll, crit);
    let held = false;
    if (dmg >= target.hp && target.hp === target.maxHp && target.ability === 'stonewall') { dmg = target.hp - 1; held = true; }
    dmg = Math.min(dmg, target.hp);
    target.hp -= dmg;
    total += dmg; landed++;
    events.push({ t: 'damage', side: foeSide, name: target.name, amount: dmg, hp: target.hp, maxHp: target.maxHp, eff, crit });
    if (held) events.push({ t: 'ability', side: foeSide, name: target.name, ability: abilityName(target.ability) });
    if (target.hp <= 0) faint(state, foeSide, events);
  }
  if (hits > 1) events.push({ t: 'multihit', side: i, hits: landed });

  const drain = moveFx(mv, 'drain');
  if (drain && total > 0) healBattler(state, i, Math.max(1, total * drain.r), events, 'drain');
  const recoil = moveFx(mv, 'recoil');
  if (recoil && total > 0 && user.ability !== 'thick_skull') hurtBattler(state, i, Math.max(1, total * recoil.r), events, 'recoil');
  if (mv.struggle) hurtBattler(state, i, Math.max(1, user.maxHp / 4), events, 'struggle');

  if (!target.fainted) applySecondaries(state, i, mv, events, rng);
  if (mv.flags.includes('contact') && !user.fainted) contactEffects(state, i, events, rng);
  if (target.fainted && !user.fainted && user.ability === 'swagger') {
    events.push({ t: 'ability', side: i, name: user.name, ability: abilityName(user.ability) });
    changeStages(state, i, { atk: 1 }, events);
  }
}

function chanceOf(user, p) { return Math.min(100, user.ability === 'lucky_streak' ? p * 2 : p) / 100; }

function applySecondaries(state, i, mv, events, rng) {
  const user = activeOf(state, i), foeSide = 1 - i, target = activeOf(state, foeSide);
  for (const f of mv.fx) {
    const p = f.p == null ? 100 : f.p;
    if (f.k === 'status') { if (rng.chance(chanceOf(user, p))) setStatus(state, foeSide, f.s, events, rng, mv); }
    else if (f.k === 'stat') { if (rng.chance(chanceOf(user, p))) changeStages(state, f.who === 'self' ? i : foeSide, f.stats, events); }
    else if (f.k === 'flinch') { if (!target.moved && rng.chance(chanceOf(user, p))) target.flinch = true; }
  }
}

function contactEffects(state, i, events, rng) {
  const user = activeOf(state, i), foeSide = 1 - i, target = activeOf(state, foeSide);
  const ab = target.ability;
  if (ab === 'thorn_hide') {
    events.push({ t: 'ability', side: foeSide, name: target.name, ability: abilityName(ab) });
    hurtBattler(state, i, Math.max(1, user.maxHp / 8), events, 'thorns');
  } else if ((ab === 'live_fur' || ab === 'hot_blooded' || ab === 'venom_barbs') && rng.chance(0.3)) {
    const status = ab === 'live_fur' ? 'par' : ab === 'hot_blooded' ? 'brn' : 'psn';
    if (canHaveStatus(user, status)) {
      events.push({ t: 'ability', side: foeSide, name: target.name, ability: abilityName(ab) });
      setStatus(state, i, status, events, rng);
    }
  }
}

function applyStatusMove(state, i, mv, events, rng) {
  const foeSide = 1 - i;
  let didSomething = false;
  if (mv.fx.some((f) => f.k === 'status') && moveEffectiveness(mv, activeOf(state, foeSide)) === 0) {
    events.push({ t: 'immune', side: foeSide, name: activeOf(state, foeSide).name });
    return;
  }
  for (const f of mv.fx) {
    if (f.k === 'status') {
      const target = activeOf(state, foeSide);
      if (setStatus(state, foeSide, f.s, events, rng, mv)) didSomething = true;
      else events.push({ t: 'no_effect', side: foeSide, name: target.name, reason: target.status ? 'already' : 'immune' });
    } else if (f.k === 'stat') {
      const who = f.who === 'self' ? i : foeSide;
      const before = { ...activeOf(state, who).stages };
      changeStages(state, who, f.stats, events);
      if (Object.keys(f.stats).some((k) => activeOf(state, who).stages[k] !== before[k])) didSomething = true;
    } else if (f.k === 'heal') {
      const me = activeOf(state, i);
      if (healBattler(state, i, me.maxHp * f.r, events, 'heal')) didSomething = true;
      else events.push({ t: 'no_effect', side: i, name: me.name, reason: 'full' });
    }
  }
  if (!didSomething && !mv.fx.length) events.push({ t: 'no_effect', side: i, name: activeOf(state, i).name, reason: 'failed' });
}

function endOfTurn(state, events, rng) {
  for (const i of speedOrder(state, rng)) {
    const b = activeOf(state, i);
    if (b.fainted) continue;
    if (b.status === 'brn') hurtBattler(state, i, Math.max(1, b.maxHp / 16), events, 'brn');
    else if (b.status === 'psn') hurtBattler(state, i, Math.max(1, b.maxHp / 8), events, 'psn');
    if (!b.fainted && b.ability === 'momentum' && b.stages.spe < 6) {
      events.push({ t: 'ability', side: i, name: b.name, ability: abilityName(b.ability) });
      changeStages(state, i, { spe: 1 }, events);
    }
  }
}

function checkEnd(state, events) {
  const dead = [0, 1].map((i) => aliveCount(state.sides[i]) === 0);
  if (!dead[0] && !dead[1]) return false;
  state.phase = 'over';
  state.winner = dead[0] && dead[1] ? null : dead[0] ? 1 : 0;
  events.push({ t: 'end', winner: state.winner });
  return true;
}

/** Human-readable line for an event. `names` = [sideName0, sideName1]; opts.wild for wild encounters. */
function describeEvent(e, names = ['You', 'Foe'], opts = {}) {
  const foe = e.side === 1;
  const who = foe ? (opts.wild ? `The wild ${e.name}` : `The foe's ${e.name}`) : e.name;
  switch (e.t) {
    case 'turn': return `— Turn ${e.n} —`;
    case 'switch':
      if (!foe) return e.initial ? `Go, ${e.name}!` : `Come back! Go, ${e.name}!`;
      return opts.wild ? `A wild ${e.name} appeared!` : `${names[1]} sends out ${e.name}!`;
    case 'move': return `${who} used ${e.move}!`;
    case 'damage': {
      const bits = [];
      if (e.crit) bits.push('A critical hit!');
      if (e.eff >= 2) bits.push("It's super effective!");
      else if (e.eff > 0 && e.eff < 1) bits.push("It's not very effective…");
      return bits.join(' ');
    }
    case 'multihit': return `Hit ${e.hits} times!`;
    case 'miss': return `${who}'s attack missed!`;
    case 'no_target': return 'But there was no target…';
    case 'immune': return `It doesn't affect ${who}…`;
    case 'no_effect': return e.reason === 'already' ? `${who} is already affected.` : e.reason === 'full' ? `${who}'s HP is already full.` : e.reason === 'immune' ? `It doesn't affect ${who}…` : 'But it failed!';
    case 'status': return `${who} ${STATUS_INFO[e.status].verb}!`;
    case 'status_skip': return e.status === 'slp' ? `${who} is fast asleep.` : e.status === 'frz' ? `${who} is frozen solid!` : `${who} is paralyzed and can't move!`;
    case 'cure': return e.status === 'slp' ? `${who} woke up!` : e.status === 'frz' ? `${who} thawed out!` : `${who} recovered.`;
    case 'flinch': return `${who} flinched!`;
    case 'stat': {
      const label = STAT_LABEL[e.stat] || e.stat;
      if (e.stages === 0) return `${who}'s ${label} won't go any ${e.wanted > 0 ? 'higher' : 'lower'}!`;
      const size = Math.abs(e.stages) >= 2 ? 'sharply ' : '';
      return `${who}'s ${label} ${size}${e.stages > 0 ? 'rose' : 'fell'}!`;
    }
    case 'heal': return e.why === 'drain' ? `${who} drained some HP!` : `${who} recovered ${e.amount} HP.`;
    case 'hurt': return e.why === 'recoil' || e.why === 'struggle' ? `${who} is hit with recoil!` : e.why === 'brn' ? `${who} is hurt by its burn!` : e.why === 'psn' ? `${who} is hurt by poison!` : e.why === 'thorns' ? `${who} is pricked by thorns!` : `${who} took ${e.amount} damage.`;
    case 'ability': return `[${who}'s ${e.ability}]`;
    case 'faint': return `${who} fainted!`;
    case 'capture': return e.ok ? `Gotcha! ${e.name} was caught!` : e.shakes === 0 ? 'Oh no! It broke free right away!' : e.shakes === 1 ? 'It shook once… and broke free!' : 'So close! It broke free!';
