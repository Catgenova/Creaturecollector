  if (rigOf(a) !== rigOf(b)) return { ok: false, reason: 'These two were built on different skeletons and cannot fuse.' };
  return { ok: true, reason: '' };
}

/**
 * Fuse a and b. Deterministic for a given rng seed. Throws if the classes differ.
 * Returns { child, report } where report = { from: {slot: 0|1}, mutated: {slot: true},
 *   identity: 0|1, palette: {c1|c2|c3|eye: 0|1|'blend'}, types: {primary: 0|1, secondary: 0|1|null} }.
 */
function fuse(a, b, rng) {
  const compat = canFuse(a, b);
  if (!compat.ok) throw new Error(compat.reason);
  const clade = cladeOf(a);
  const rig = rigOf(a);
  const rParts = rng.fork('parts');
  const rMut = rng.fork('mutation');
  const rPaint = rng.fork('paint');
  const rPal = rng.fork('palette');
  const rTraits = rng.fork('traits');
  const rStats = rng.fork('stats');
  const rAbility = rng.fork('ability');
  const parents = [a, b];

  const draw = (slot) => {
    const fromA = a.parts[slot][rParts.int(2)];
    const fromB = b.parts[slot][rParts.int(2)];
    const dA = dominanceOf(fromA) + rParts.range(-FUSE.dominanceNoise, FUSE.dominanceNoise);
    const dB = dominanceOf(fromB) + rParts.range(-FUSE.dominanceNoise, FUSE.dominanceNoise);
    return dA >= dB ? { alleles: [fromA, fromB], from: 0 } : { alleles: [fromB, fromA], from: 1 };
  };

  const parts = {}, from = {}, mutated = {};
  const bodyDraw = draw('body');
  parts.body = bodyDraw.alleles;
  from.body = bodyDraw.from;
  if (rMut.chance(FUSE.bodyMutation)) { const nb = randomPartId(rig, 'body', getPart(parts.body[0]).kind, rMut); if (nb) { parts.body = [nb, parts.body[0]]; mutated.body = true; } }
  const bodyKind = getPart(parts.body[0]).kind;

  for (const slot of slotsFor(rig)) {
    if (slot === 'body') continue;
    const d = draw(slot);
    let [e, c] = d.alleles;
    let f = d.from;
    if (!fitsBody(e, bodyKind) && fitsBody(c, bodyKind)) { [e, c] = [c, e]; f = 1 - f; }
    if (rMut.chance(FUSE.expressedMutation)) { const ne = randomPartId(rig, slot, bodyKind, rMut); if (ne) { c = e; e = ne; mutated[slot] = true; } }
    else if (rMut.chance(FUSE.carriedMutation)) c = randomPartId(rig, slot, bodyKind, rMut) || c;
    parts[slot] = [e, c];
    from[slot] = f;
  }

  // Linked slots inherit together so the class silhouette stays coherent.
  const linked = getRig(rig).linked || (CLADES[clade] && CLADES[clade].linked) || [];
  for (const group of linked) {
    const lead = group[0];
    if (from[lead] == null) continue;
    for (const slot of group.slice(1)) {
      if (from[slot] === from[lead] || mutated[slot]) continue;
      const src = parents[from[lead]], other = parents[1 - from[lead]];
      const want = src.parts[slot][0];
      if (!fitsBody(want, bodyKind) && !getPart(want)?.none) continue;
      parts[slot] = [want, other.parts[slot][0]];
      from[slot] = from[lead];
    }
  }

  const headPart = parts.head ? getPart(parts.head[0]) : null;
  const identity = headPart && !headPart.none && !mutated.head ? from.head : from.body;
  const P1 = parents[identity], P2 = parents[1 - identity];

  // Paint travels with the part that was expressed.
  const paint = {};
  const swappable = swappableSlotsFor(rig);
  for (const slot of paintSlotsFor(rig)) {
    const src = parents[from[slot] == null ? identity : from[slot]];
    paint[slot] = (src.paint && PAINT_PERMS[src.paint[slot]]) ? src.paint[slot] : 0;
    if (swappable.includes(slot) && rPaint.chance(FUSE.paintSwap)) paint[slot] = rPaint.int(PAINT_PERMS.length);
  }

  // Palette: base from the identity parent, one colour from the other parent.
  const palette = {}, palFrom = {};
  for (const k of ['c1', 'c2', 'c3']) { palette[k] = nudgeColor(P1.palette[k], rPal); palFrom[k] = identity; }
  const roll = rPal.next();
  if (roll < 0.55) {
    const k = rPal.pick(['c2', 'c3']);
    palette[k] = nudgeColor(P2.palette.c1, rPal); palFrom[k] = 1 - identity;
  } else if (roll < 0.85) {
    palette.c1 = blendColor(P1.palette.c1, P2.palette.c1, rPal.range(0.35, 0.65)); palFrom.c1 = 'blend';
    const k = rPal.pick(['c2', 'c3']);
    palette[k] = nudgeColor(P2.palette[k], rPal); palFrom[k] = 1 - identity;
  }
  const eyeFrom = rPal.chance(0.5) ? identity : 1 - identity;
  palette.eye = parents[eyeFrom].palette.eye.slice();
  palFrom.eye = eyeFrom;

  const traits = {};
  for (const k of TRAIT_KEYS) {
    const t = clamp01(0.5 + rTraits.gauss() * 0.15);
    const av = a.traits && a.traits[k] != null ? a.traits[k] : 0.5;
    const bv = b.traits && b.traits[k] != null ? b.traits[k] : 0.5;
    traits[k] = round3(clamp01(lerp(av, bv, t) + rTraits.gauss() * 0.04));
  }

  const primary = P1.types[0];
  let secondary = null, secondaryFrom = null;
  const candidates = [[P2.types[0], 1 - identity], [P2.types[1], 1 - identity], [P1.types[1], identity]];
  for (const [t, src] of candidates) if (t && t !== primary) { secondary = t; secondaryFrom = src; break; }

  const wa = normalizeWeights(a.stats), wb = normalizeWeights(b.stats);
  const stats = {};
  for (const k of STAT_KEYS) stats[k] = round3((wa[k] + wb[k]) / 2);
  const gen = Math.max(a.gen || 0, b.gen || 0) + 1;
  const bst = Math.round(((a.bst || 400) + (b.bst || 400)) / 2 + Math.min(gen, FUSE.genBonusCap) * FUSE.genBonusPerGen);
  const vigor = {};
  for (const k of STAT_KEYS) {
    const av = a.vigor && a.vigor[k] != null ? a.vigor[k] : 0.5;
    const bv = b.vigor && b.vigor[k] != null ? b.vigor[k] : 0.5;
    const base = rStats.chance(0.6) ? Math.max(av, bv) : (av + bv) / 2;
    vigor[k] = round3(clamp01(base + rStats.gauss() * 0.03));
  }

  const nameParts = [namePartsOf(P1)[0], namePartsOf(P2)[1]];
  const lineage = [...(a.lineage || []), ...(b.lineage || [])].filter((x, i, arr) => arr.indexOf(x) === i).slice(-FUSE.maxLineage);

  const child = {
    v: GENOME_VERSION,
    seed: rng.seed,
    species: null,
    clade,
    rig,
    name: joinNameParts(nameParts[0], nameParts[1]),
    nameParts,
    gen,
    shiny: Boolean(P1.shiny),
    types: [primary, secondary],
    parts, paint, palette, traits, stats, vigor, bst, lineage,
    parents: [a.name, b.name],
    learnset: fuseLearnsets(a, b, [primary, secondary]),
    ability: rAbility.chance(0.6) ? P1.ability : P2.ability,
  };
  return {
    child,
    report: { from, mutated, identity, palette: palFrom, types: { primary: identity, secondary: secondaryFrom } },
  };
}

/**
 * A child's learnset: both parents' moves that match the child's types (Normal
 * always counts), lowest level wins on duplicates, padded with universal moves
 * when thin, capped at twelve keeping the two earliest and the ten latest.
 */
function fuseLearnsets(a, b, types) {
  const ok = new Set(['Normal', ...types.filter(Boolean)]);
  const byId = new Map();
  for (const [lvl, id] of [...learnsetOf(a), ...learnsetOf(b)]) {
    const mv = getMove(id);
    if (!mv || !ok.has(mv.type)) continue;
    if (!byId.has(id) || byId.get(id) > lvl) byId.set(id, lvl);
  }
  for (const [lvl, id] of UNIVERSAL_LEARNSET) if (byId.size < 6 && !byId.has(id)) byId.set(id, lvl);
  const list = [...byId.entries()].map(([id, lvl]) => [lvl, id]).sort((p, q) => p[0] - q[0] || (p[1] < q[1] ? -1 : 1));
  return list.length <= 12 ? list : [...list.slice(0, 2), ...list.slice(-10)];
}

/** Fuse a chain: start with `first`, then fold in each partner in turn. Returns every generation. */
function fuseChain(first, partners, rng) {
  const out = [first];
  let cur = first;
  partners.forEach((p, i) => {
    if (!canFuse(cur, p).ok) return;
    cur = fuse(cur, p, rng.fork(`gen${i}`)).child;
    out.push(cur);
  });
  return out;
}

// ---- src/ui/fusion.js ----
// Fusion Lab: pick two creatures from a pool, fuse them, read the inheritance
// report, feed children back into the pool, and stress-test five generations.












const fs = { a: null, b: null, child: null, report: null, rerolls: 0, chain: null, next: 'a' };

function seedPool(seed) {
  fusionPool.seed = seed;
  fusionPool.genomes = [];
  for (let i = 0; i < 8; i++) fusionPool.genomes.push(randomGenome(makeRng(`${seed}:pool:${i}`)));
  Object.assign(fs, { a: null, b: null, child: null, report: null, chain: null, rerolls: 0, next: 'a' });
}

function badge(who, extra) {
  if (who === 'blend') return h('span', { class: 'badge blend' }, 'A+B');
  return h('span', { class: `badge ${who === 0 ? 'a' : 'b'}` }, who === 0 ? 'A' : 'B', extra || null);
}

let poolListener = null;

function renderFusionScreen(root) {
  if (!fusionPool.genomes.length) seedPool('FUSE');
  else if (!fusionPool.seed) fusionPool.seed = 'FUSE';
  clear(root);

  const rerender = () => renderFusionScreen(root);
  if (poolListener) window.removeEventListener('pool-changed', poolListener);
  poolListener = () => { if (root.isConnected) rerender(); else window.removeEventListener('pool-changed', poolListener); };
  window.addEventListener('pool-changed', poolListener);

  const pick = (g) => {
    const other = fs.a && fs.a !== g ? fs.a : fs.b && fs.b !== g ? fs.b : null;
    if (other && g !== fs.a && g !== fs.b && !canFuse(other, g).ok) { toast(canFuse(other, g).reason); return; }
    if (fs.a === g) { fs.a = null; fs.next = 'a'; }
    else if (fs.b === g) { fs.b = null; fs.next = 'b'; }
    else if (!fs.a) { fs.a = g; fs.next = fs.b ? 'a' : 'b'; }
    else if (!fs.b) { fs.b = g; fs.next = 'a'; }
    else if (fs.next === 'a') { fs.a = g; fs.next = 'b'; }
    else { fs.b = g; fs.next = 'a'; }
    rerender();
  };

  const slot = (who, g) => h('button', { class: `pslot${g ? ' filled' : ''}`, type: 'button', onclick: () => { if (g) pick(g); } },
    h('span', { class: 'tag' }, `PARENT ${who}`),
    g ? [creatureEl(g, { size: 150, animate: false }), h('b', {}, g.name), typeChips(g.types), h('span', { class: 'clade' }, cladeName(cladeOf(g)))] : h('span', { class: 'hint' }, 'Tap a creature in the pool'));

  const doFuse = () => {
    const rng = makeRng(`${fs.a.seed}|${fs.a.name}+${fs.b.seed}|${fs.b.name}#${fs.rerolls}`);
    const { child, report } = fuse(fs.a, fs.b, rng);
    fs.child = child; fs.report = report; fs.chain = null;
    rerender();
    setTimeout(() => { const r = root.querySelector('.result'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 0);
  };

  root.append(
    h('div', { class: 'parents' }, slot('A', fs.a), h('div', { class: 'times' }, '×'), slot('B', fs.b)),
    h('button', { class: 'btn primary fuse-btn', type: 'button', disabled: !(fs.a && fs.b), onclick: () => { fs.rerolls = 0; doFuse(); } }, 'Fuse'),
  );

  if (fs.child) root.append(resultPanel(fs.child, fs.report, fs.a, fs.b, {
    reroll: () => { fs.rerolls++; doFuse(); },
    breed: () => {
      const rng = makeRng(`${fs.child.seed}:chain`);
      const partners = [];
      const kin = fusionPool.genomes.filter((g) => canFuse(fs.child, g).ok);
      for (let i = 0; i < 5; i++) partners.push(kin.length ? rng.pick(kin) : randomGenome(rng.fork(`kin${i}`), { clade: cladeOf(fs.child) }));
      fs.chain = fuseChain(fs.child, partners, rng);
      rerender();
      setTimeout(() => { const c = root.querySelector('.chain'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 0);
    },
    chain: fs.chain,
  }));

  // pool
  const codeInput = h('input', { class: 'seed code-in', type: 'text', placeholder: 'Paste a creature code to add it', 'aria-label': 'Creature code', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false' });
  const poolGrid = h('div', { class: 'pool' });
  const anchor = fs.a || fs.b;
  for (const g of fusionPool.genomes) {
    const incompatible = anchor && g !== fs.a && g !== fs.b && !canFuse(anchor, g).ok;
    const cls = g === fs.a ? ' is-a' : g === fs.b ? ' is-b' : incompatible ? ' is-off' : '';
    poolGrid.append(h('button', { class: `pcard${cls}`, type: 'button', onclick: () => pick(g), title: incompatible ? canFuse(anchor, g).reason : '' },
      g === fs.a ? h('span', { class: 'sel badge a' }, 'A') : g === fs.b ? h('span', { class: 'sel badge b' }, 'B') : null,
      h('span', { class: 'gen' }, `${g.gen ? `gen ${g.gen} · ` : ''}${cladeName(cladeOf(g))}`),
      creatureEl(g, { size: 104, animate: false }),
      h('span', {}, g.name)));
  }
  root.append(
    ...section(`Pool · ${fusionPool.genomes.length}`,
      h('div', { class: 'toolbar' },
        h('button', { class: 'btn', type: 'button', onclick: () => { seedPool(freshSeed()); rerender(); } }, 'New pool'),
        h('button', { class: 'btn', type: 'button', onclick: () => { for (let i = 0; i < 4; i++) addToPool(randomGenome(makeRng(freshSeed()))); rerender(); } }, '+4 wild')),
      h('div', { class: 'toolbar' },
        codeInput,
        h('button', { class: 'btn', type: 'button', onclick: () => {
          try { addToPool(decodeGenome(codeInput.value)); codeInput.value = ''; rerender(); } catch (e) { toast(e.message); }
        } }, 'Add')),
      h('p', { class: 'hint' }, 'Tap to choose parents. Only creatures of the same class can fuse: mammals with mammals, birds with birds. Tap a chosen one again to clear it.'),
      poolGrid),
  );
}

function resultPanel(child, report, a, b, actions) {
  const parents = [a, b];
  const parts = resolveParts(child);
  const rig = rigOf(child);
  const rows = [];
  for (const slot of slotsFor(rig)) {
    const p = parts[slot];
    rows.push(h('span', {}, slotName(rig, slot)), h('span', {}, p ? p.name : 'None'),
      h('span', {}, report.mutated[slot] ? h('span', { class: 'badge m' }, 'mutation') : badge(report.from[slot])));
  }
  const palRows = ['c1', 'c2', 'c3', 'eye'].map((k) => h('div', { class: 'sw-row' },
    h('span', { class: 'sw small', style: { background: swatchCss(child.palette[k]) } }),
    h('span', {}, { c1: 'Primary', c2: 'Secondary', c3: 'Accent', eye: 'Eyes' }[k]), badge(report.palette[k])));
  const typeRow = h('div', { class: 'sw-row' }, typeChips([child.types[0]]), badge(report.types.primary),
    child.types[1] ? [typeChips([child.types[1]]), badge(report.types.secondary)] : h('span', { class: 'hint', style: { margin: 0 } }, 'no second type'));

  const panel = h('div', { class: 'result' },
    h('div', { class: 'sheet-head' }, h('h2', {}, child.name, child.shiny ? ' ✦' : ''), typeChips(child.types)),
    h('p', { class: 'meta' }, `${cladeName(cladeOf(child))} · gen ${child.gen} · ${a.name} × ${b.name} · face from ${parents[report.identity].name}`),
    h('div', { class: 'hero' }, creatureEl(child, { size: 240, fit: true })),
    h('div', { class: 'row wrap' },
      h('button', { class: 'btn', type: 'button', onclick: actions.reroll }, 'Re-roll'),
      h('button', { class: 'btn', type: 'button', onclick: () => { toast(addToPool(child) ? 'Added to pool' : 'Already in pool'); window.dispatchEvent(new CustomEvent('pool-changed')); } }, 'Add to pool'),
      h('button', { class: 'btn', type: 'button', onclick: () => openSheet(child) }, 'Details'),
      h('button', { class: 'btn', type: 'button', onclick: async () => toast((await copyText(encodeGenome(child))) ? 'Code copied' : 'Copy failed') }, 'Copy code')),
    ...section('Inheritance', h('div', { class: 'inherit' }, rows)),
    ...section('Colours', h('div', { class: 'stack' }, palRows)),
    ...section('Types', typeRow),
    ...section('Stability test',
      h('p', { class: 'hint' }, 'Breed this child with random pool members for five more generations to check that fusions stay coherent.'),
      h('button', { class: 'btn', type: 'button', onclick: actions.breed }, 'Breed 5 generations')),
  );
  if (actions.chain) {
    const strip = h('div', { class: 'chain' });
    actions.chain.forEach((g, i) => strip.append(h('button', { class: 'pcard', type: 'button', onclick: () => openSheet(g) },
      h('span', { class: 'gen' }, `gen ${g.gen}`), creatureEl(g, { size: 120, animate: false }), h('span', {}, g.name))));
    panel.append(strip);
  }
  return panel;
}

// ---- src/battle/stats.js ----
// Level scaling and move selection. Pure functions over genomes.



/** HP gets a global lift so battles last a hit or two longer than the raw formula gives. */
const HP_SCALE = 1.15;

/** Classic level formula. Vigor genes play the role of IVs (0..31). */
function statsAtLevel(genome, level) {
  const base = baseStats(genome);
  const L = Math.max(1, Math.min(100, Math.round(level)));
  const iv = (k) => Math.round((genome.vigor && genome.vigor[k] != null ? genome.vigor[k] : 0.5) * 31);
  const out = { hp: Math.floor((Math.floor(((2 * base.hp + iv('hp')) * L) / 100) + L + 10) * HP_SCALE) };
  for (const k of STAT_KEYS) if (k !== 'hp') out[k] = Math.floor(((2 * base[k] + iv(k)) * L) / 100) + 5;
  return out;
}

/** Up to four moves known at a level: the most recently learned, always including a damaging one. */
function movesAtLevel(learnset, level) {
  const known = [];
  for (const [lvl, id] of learnset) if (lvl <= level && getMove(id) && !known.includes(id)) known.push(id);
  let picked = known.slice(-4);
  if (!picked.some((id) => isDamaging(getMove(id)))) {
    const dmg = [...known].reverse().find((id) => isDamaging(getMove(id)));
    if (dmg) picked = [dmg, ...picked.slice(1)];
  }
  return picked.length ? picked : ['bump'];
}

// ---- src/battle/engine.js ----
// Battle engine. Pure and deterministic: step(state, actions) returns a new
// state plus the list of events that happened, and never touches the input.
// All randomness comes from the battle seed and turn number, so a battle can
// be replayed from its initial state and action log.
//
// Shape: two sides, each with a party (up to 5) and one active battler.
// Phases: 'choose' (both sides act), 'replace' (a side whose active fainted
// must send in another, free), 'over'.









const STATUS_INFO = {
  brn: { name: 'Burn', short: 'BRN', verb: 'was burned' },
  psn: { name: 'Poison', short: 'PSN', verb: 'was poisoned' },
  par: { name: 'Paralysis', short: 'PAR', verb: 'is paralyzed' },
  slp: { name: 'Sleep', short: 'SLP', verb: 'fell asleep' },
  frz: { name: 'Freeze', short: 'FRZ', verb: 'was frozen solid' },
};
const STAT_LABEL = { atk: 'Attack', def: 'Defense', spa: 'Sp. Atk', spd: 'Sp. Def', spe: 'Speed', acc: 'accuracy', eva: 'evasion' };
const MAX_PARTY = 5;

const stageMul = (n) => (n >= 0 ? (2 + n) / 2 : 2 / (2 - n));
const accMul = (n) => (n >= 0 ? (3 + n) / 3 : 3 / (3 - n));
const SURGE = { ember_heart: 'Fire', tide_heart: 'Water', bloom_heart: 'Grass' };

/** Build a battler from a genome at a level. opts.moves / opts.ability override the defaults. */
function makeBattler(genome, level, opts = {}) {
  const stats = statsAtLevel(genome, level);
  const moveIds = (opts.moves && opts.moves.length ? opts.moves : movesAtLevel(learnsetOf(genome), level)).slice(0, 4);
  return {
    uid: opts.uid || null,
    name: genome.name,
    level,
    types: [genome.types[0], genome.types[1] || null],
    genome,
    stats,
    maxHp: stats.hp,
    hp: stats.hp,
    moves: moveIds.map((id) => { const mv = getMove(id) || getMove('bump'); return { id: mv.id, pp: mv.pp, maxPp: mv.pp }; }),
    ability: opts.ability || genome.ability || 'lucky_streak',
    xp: opts.xp || null, // { cur, prev, next } progress toward the next level, for display only
    status: null,
    sleepTurns: 0,
    stages: { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, acc: 0, eva: 0 },
    flinch: false,
    moved: false,
    fainted: false,
    lastMove: null,
  };
}

function activeOf(state, side) { const s = state.sides[side]; return s.party[s.active]; }
function aliveCount(side) { return side.party.filter((b) => !b.fainted).length; }

/**
 * Chance (0..1) that a capture attempt on this battler succeeds right now.
 * Low HP and status help; rarer species and fusions resist more.
 */
function captureChance(b) {
  const sp = b.genome && b.genome.species ? SPECIES_BY_ID[b.genome.species] : null;
  let base = sp ? (sp.tier === 'rare' ? 0.45 : sp.tier === 'uncommon' ? 0.7 : 1) : 0.7;
  if (b.genome && b.genome.gen > 0) base *= 0.7;
  const hpFactor = 1 - (2 / 3) * (b.hp / b.maxHp);
  const statusMul = b.status === 'slp' || b.status === 'frz' ? 2 : b.status ? 1.5 : 1;
  return clamp(0.08 + 0.72 * hpFactor * base * statusMul, 0.03, 0.95);
}

/**
 * Start a battle. sides: [{ name, party: [battler...], ai }, ...]. Returns { state, events }.
 * capturable: side 0 may try to capture side 1's active creature (wild encounters).
 */
function createBattle({ sides, seed = 'battle', capturable = false }) {
  if (!sides || sides.length !== 2) throw new Error('A battle needs exactly two sides.');
  const state = {
    seed: String(seed),
    turn: 0,
    phase: 'choose',
    winner: null,
    capturable: Boolean(capturable),
    captured: null,
    sides: sides.map((s, si) => {
      if (!s.party || !s.party.length) throw new Error(`Side ${si} has an empty party.`);
      return {
        name: s.name || (si === 0 ? 'You' : 'Foe'),
        ai: Boolean(s.ai),
        active: 0,
        needsReplace: false,
        party: s.party.slice(0, MAX_PARTY).map((b, bi) => ({ ...structuredClone(b), uid: `s${si}b${bi}` })),
      };
    }),
  };
  const events = [];
  const rng = makeRng(`${state.seed}:start`);
  for (const i of [0, 1]) events.push({ t: 'switch', side: i, name: activeOf(state, i).name, uid: activeOf(state, i).uid, initial: true });
  for (const i of speedOrder(state, rng)) entryHooks(state, i, events);
  return { state, events };
}

/** What a side may do right now. Empty when it is not this side's turn to act. */
function legalActions(state, side) {
  const s = state.sides[side];
  const me = activeOf(state, side);
  const switches = s.party.map((b, i) => ({ type: 'switch', index: i })).filter((a) => a.index !== s.active && !s.party[a.index].fainted);
  if (state.phase === 'over') return [];
  if (state.phase === 'replace') return s.needsReplace ? switches : [];
  const moves = me.moves.map((mv, i) => ({ type: 'move', index: i })).filter((a) => me.moves[a.index].pp > 0);
  const capture = state.capturable && side === 0 && !activeOf(state, 1).fainted ? [{ type: 'capture' }] : [];
  return [...(moves.length ? moves : [{ type: 'move', index: -1, struggle: true }]), ...capture, ...switches];
}

function sameAction(a, b) { return a && b && a.type === b.type && a.index === b.index; }

function speedOrder(state, rng) {
  const s0 = effectiveStat(activeOf(state, 0), 'spe'), s1 = effectiveStat(activeOf(state, 1), 'spe');
  if (s0 === s1) return rng.chance(0.5) ? [0, 1] : [1, 0];
  return s0 > s1 ? [0, 1] : [1, 0];
}

function effectiveStat(b, k) {
  let v = b.stats[k] * stageMul(b.stages[k]);
  if (k === 'spe' && b.status === 'par') v *= 0.5;
  return v;
}

/** One step of the battle. actions[i] is side i's action (null when that side does not act this phase). */
function step(input, actions) {
  const state = structuredClone(input);
  const events = [];
  if (state.phase === 'over') return { state, events };
  const rng = makeRng(`${state.seed}:t${state.turn}:${state.phase}`);

  if (state.phase === 'replace') {
    for (const i of [0, 1]) {
      const side = state.sides[i];
      if (!side.needsReplace) continue;
      const a = actions[i];
      if (!legalActions(state, i).some((x) => sameAction(x, a))) throw new Error(`Side ${i} must send in a replacement.`);
      doSwitch(state, i, a.index, events, true);
      side.needsReplace = false;
    }
    for (const i of speedOrder(state, rng)) if (state.sides[i].party[state.sides[i].active].justEntered) entryHooks(state, i, events);
    state.phase = 'choose';
    return { state, events };
  }

  for (const i of [0, 1]) {
    if (!legalActions(state, i).some((x) => sameAction(x, actions[i]))) throw new Error(`Illegal action for side ${i}: ${JSON.stringify(actions[i])}`);
  }
  state.turn++;
  events.push({ t: 'turn', n: state.turn });
  for (const i of [0, 1]) { const b = activeOf(state, i); b.moved = false; b.flinch = b.flinch && false; }

  // Order: switches first, then moves by priority, then speed, ties random.
  const order = [0, 1].map((i) => {
    const a = actions[i];
    const prio = a.type === 'switch' || a.type === 'capture' ? 100 : (a.struggle ? 0 : getMove(activeOf(state, i).moves[a.index].id).prio);
    return { i, a, prio, spe: effectiveStat(activeOf(state, i), 'spe'), tie: rng.next() };
  }).sort((x, y) => (y.prio - x.prio) || (y.spe - x.spe) || (y.tie - x.tie));

  for (const o of order) {
    if (state.phase === 'over') break;
    if (o.a.type === 'capture') {
      attemptCapture(state, events, rng);
      if (state.phase === 'over') return { state, events };
    } else if (o.a.type === 'switch') {
      doSwitch(state, o.i, o.a.index, events, false);
      entryHooks(state, o.i, events);
    } else {
      executeMove(state, o.i, o.a, events, rng);
    }
    if (checkEnd(state, events)) return { state, events };
  }

  endOfTurn(state, events, rng);
  if (checkEnd(state, events)) return { state, events };

  for (const i of [0, 1]) {
    if (activeOf(state, i).fainted) { state.sides[i].needsReplace = true; state.phase = 'replace'; }
  }
  return { state, events };
}

function attemptCapture(state, events, rng) {
  const target = activeOf(state, 1);
  const perShake = Math.cbrt(captureChance(target));
  let shakes = 0;
  for (let k = 0; k < 3; k++) { if (rng.chance(perShake)) shakes++; else break; }
  if (shakes === 3) {
    events.push({ t: 'capture', ok: true, side: 1, name: target.name, shakes });
    state.captured = target.uid;
    state.phase = 'over';
    state.winner = 0;
    events.push({ t: 'end', winner: 0, capture: true, name: target.name });
  } else {
    events.push({ t: 'capture', ok: false, side: 1, name: target.name, shakes });
  }
}

function doSwitch(state, i, index, events, forced) {
  const side = state.sides[i];
  const out = side.party[side.active];
  if (!out.fainted && !forced) {
    if (out.ability === 'second_wind' && out.hp < out.maxHp) {
      const amount = Math.min(out.maxHp - out.hp, Math.floor(out.maxHp / 3));
      out.hp += amount;
      events.push({ t: 'ability', side: i, name: out.name, ability: abilityName(out.ability) });
      events.push({ t: 'heal', side: i, name: out.name, amount, hp: out.hp, maxHp: out.maxHp });
    }
  }
  out.stages = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, acc: 0, eva: 0 };
  out.flinch = false;
  side.active = index;
  const inn = side.party[index];
  inn.justEntered = true;
  events.push({ t: 'switch', side: i, name: inn.name, uid: inn.uid, from: out.name, forced });
}

function entryHooks(state, i, events) {
  const me = activeOf(state, i);
  me.justEntered = false;
  const foe = activeOf(state, 1 - i);
  if (me.ability === 'menace' && !foe.fainted) {
    events.push({ t: 'ability', side: i, name: me.name, ability: abilityName(me.ability) });
    changeStages(state, 1 - i, { atk: -1 }, events);
  }
}

function canHaveStatus(b, status, mv) {
  if (b.status || b.fainted) return false;
  const t = b.types;
  if (mv && mv.flags.includes('powder') && t.includes('Grass')) return false;
  switch (status) {
    case 'brn': return !t.includes('Fire') && b.ability !== 'damp_coat';
    case 'psn': return !t.includes('Poison') && !t.includes('Steel') && b.ability !== 'antitoxin';
    case 'par': return !t.includes('Electric') && b.ability !== 'loose_joints';
    case 'slp': return b.ability !== 'restless';
    case 'frz': return !t.includes('Ice') && b.ability !== 'warm_core';
    default: return false;
  }
}

function setStatus(state, side, status, events, rng, mv) {
  const b = activeOf(state, side);
  if (!canHaveStatus(b, status, mv)) return false;
  b.status = status;
  if (status === 'slp') b.sleepTurns = rng.between(1, 3);
  events.push({ t: 'status', side, name: b.name, status });
  return true;
}

function changeStages(state, side, stats, events) {
  const b = activeOf(state, side);
  if (b.fainted) return;
  for (const [k, n] of Object.entries(stats)) {
    if (k === 'acc' && n < 0 && b.ability === 'hawkeye') { events.push({ t: 'ability', side, name: b.name, ability: abilityName(b.ability) }); continue; }
    const cur = b.stages[k];
    const next = clamp(cur + n, -6, 6);
    events.push({ t: 'stat', side, name: b.name, stat: k, stages: next - cur, wanted: n });
    b.stages[k] = next;
  }
}

function healBattler(state, side, amount, events, why) {
  const b = activeOf(state, side);
  const real = Math.max(0, Math.min(b.maxHp - b.hp, Math.floor(amount)));
  if (real <= 0) return 0;
  b.hp += real;
  events.push({ t: 'heal', side, name: b.name, amount: real, hp: b.hp, maxHp: b.maxHp, why });
  return real;
}

function hurtBattler(state, side, amount, events, why) {
  const b = activeOf(state, side);
  if (b.fainted) return 0;
  const real = Math.max(1, Math.min(b.hp, Math.floor(amount)));
  b.hp -= real;
  events.push({ t: 'hurt', side, name: b.name, amount: real, hp: b.hp, maxHp: b.maxHp, why });
  if (b.hp <= 0) faint(state, side, events);
  return real;
}

function faint(state, side, events) {
  const b = activeOf(state, side);
  b.hp = 0;
  b.fainted = true;
  b.status = null;
  events.push({ t: 'faint', side, name: b.name, uid: b.uid });
}

function moveOfAction(b, a) { return a.struggle ? STRUGGLE : getMove(b.moves[a.index].id); }

/**
 * Damage for one hit. `roll` is the random factor in [0.85, 1], `crit` a boolean.
 * Exported so the AI can estimate with roll = 0.925 and no crit.
 */
function calcDamage(user, target, mv, eff, roll, crit) {
  const fixed = moveFx(mv, 'fixed');
  if (fixed) return user.level;
  const atkKey = mv.cat === 'phys' ? 'atk' : 'spa';
  const defKey = mv.cat === 'phys' ? 'def' : 'spd';
  const aStage = crit ? Math.max(0, user.stages[atkKey]) : user.stages[atkKey];
  const dStage = crit ? Math.min(0, target.stages[defKey]) : target.stages[defKey];
  let A = user.stats[atkKey] * stageMul(aStage);
  const D = Math.max(1, target.stats[defKey] * stageMul(dStage));
  if (user.ability === 'grit' && user.status && mv.cat === 'phys') A *= 1.5;
  let power = mv.power;
  const bis = moveFx(mv, 'boostIfStatus');
  if (bis && target.status) power *= bis.m;
  if (user.ability === 'finesse' && power <= 60) power *= 1.5;
  if (user.ability === 'heavy_hands' && mv.flags.includes('punch')) power *= 1.2;
  if (user.ability === 'vice_jaw' && mv.flags.includes('bite')) power *= 1.5;
  if (user.ability === 'daredevil' && moveFx(mv, 'recoil')) power *= 1.2;
  if (SURGE[user.ability] === mv.type && user.hp <= user.maxHp / 3) power *= 1.5;
  let dmg = Math.floor(Math.floor((Math.floor((2 * user.level) / 5) + 2) * power * A / D) / 50) + 2;
  if (crit) dmg = Math.floor(dmg * 1.5);
  dmg = Math.floor(dmg * roll);
  if (!mv.typeless && user.types.includes(mv.type)) dmg = Math.floor(dmg * (user.ability === 'purebred' ? 2 : 1.5));
  dmg = Math.floor(dmg * eff);
  if (user.status === 'brn' && mv.cat === 'phys' && user.ability !== 'grit') dmg = Math.floor(dmg / 2);
  if (target.ability === 'blubber' && (mv.type === 'Fire' || mv.type === 'Ice')) dmg = Math.floor(dmg / 2);
  return Math.max(1, dmg);
}

/** Type effectiveness of a move against a battler, including ability immunities. 0 means no effect. */
function moveEffectiveness(mv, target) {
  if (mv.typeless) return 1;
  if (mv.type === 'Ground' && target.ability === 'hover') return 0;
  if ((mv.type === 'Water' && target.ability === 'sponge') || (mv.type === 'Electric' && target.ability === 'capacitor')) return 0;
  return typeEffectiveness(mv.type, target.types);
}

function hitChance(user, target, mv) {
  if (mv.acc == null) return 1;
  const stage = clamp(user.stages.acc - target.stages.eva, -6, 6);
  return Math.min(1, (mv.acc / 100) * accMul(stage));
}

function executeMove(state, i, action, events, rng) {
  const user = activeOf(state, i);
  const foeSide = 1 - i;
  const target = activeOf(state, foeSide);
  if (user.fainted) return;
  const mv = moveOfAction(user, action);

  if (user.flinch) { user.flinch = false; user.moved = true; events.push({ t: 'flinch', side: i, name: user.name }); return; }
  if (user.status === 'slp') {
    user.sleepTurns--;
    if (user.sleepTurns > 0) { user.moved = true; events.push({ t: 'status_skip', side: i, name: user.name, status: 'slp' }); return; }
    user.status = null;
    events.push({ t: 'cure', side: i, name: user.name, status: 'slp' });
  }
  if (user.status === 'frz') {
    if (mv.type === 'Fire' || rng.chance(0.2)) { user.status = null; events.push({ t: 'cure', side: i, name: user.name, status: 'frz' }); }
    else { user.moved = true; events.push({ t: 'status_skip', side: i, name: user.name, status: 'frz' }); return; }
  }
  if (user.status === 'par' && rng.chance(0.25)) { user.moved = true; events.push({ t: 'status_skip', side: i, name: user.name, status: 'par' }); return; }

  if (!action.struggle) user.moves[action.index].pp = Math.max(0, user.moves[action.index].pp - 1);
  user.lastMove = mv.id;
  user.moved = true;
  events.push({ t: 'move', side: i, name: user.name, move: mv.name, moveId: mv.id, type: mv.type, cat: mv.cat });

  const targetsFoe = isDamaging(mv) || mv.fx.some((f) => f.k === 'status' || (f.k === 'stat' && f.who === 'foe'));
  if (targetsFoe) {
    if (target.fainted) { events.push({ t: 'no_target', side: i }); return; }
    if (!rng.chance(hitChance(user, target, mv))) { events.push({ t: 'miss', side: i, name: user.name, target: target.name }); return; }
  }

  if (!isDamaging(mv)) { applyStatusMove(state, i, mv, events, rng); return; }

  const eff = moveEffectiveness(mv, target);
  if (eff === 0) {
    if (target.ability === 'hover' && mv.type === 'Ground') events.push({ t: 'ability', side: foeSide, name: target.name, ability: abilityName(target.ability) });
    if ((target.ability === 'sponge' && mv.type === 'Water') || (target.ability === 'capacitor' && mv.type === 'Electric')) {
      events.push({ t: 'ability', side: foeSide, name: target.name, ability: abilityName(target.ability) });
      if (!healBattler(state, foeSide, target.maxHp / 4, events, 'absorb')) events.push({ t: 'immune', side: foeSide, name: target.name });
      return;
    }
    events.push({ t: 'immune', side: foeSide, name: target.name });
    return;
  }

  const multi = moveFx(mv, 'multi');
  const hits = multi ? rng.pick([2, 2, 3, 3, 4, 5].filter((n) => n >= multi.min && n <= multi.max)) : 1;
  let total = 0, landed = 0;
  for (let h = 0; h < hits; h++) {
    if (target.fainted) break;
    const crit = rng.chance(mv.crit >= 1 ? 1 / 8 : 1 / 24);
    const roll = rng.between(85, 100) / 100;
    let dmg = calcDamage(user, target, mv, eff, roll, crit);
    let held = false;
    if (dmg >= target.hp && target.hp === target.maxHp && target.ability === 'stonewall') { dmg = target.hp - 1; held = true; }
    dmg = Math.min(dmg, target.hp);
    target.hp -= dmg;
    total += dmg; landed++;
    events.push({ t: 'damage', side: foeSide, name: target.name, amount: dmg, hp: target.hp, maxHp: target.maxHp, eff, crit });
    if (held) events.push({ t: 'ability', side: foeSide, name: target.name, ability: abilityName(target.ability) });
    if (target.hp <= 0) faint(state, foeSide, events);
  }
  if (hits > 1) events.push({ t: 'multihit', side: i, hits: landed });

  const drain = moveFx(mv, 'drain');
  if (drain && total > 0) healBattler(state, i, Math.max(1, total * drain.r), events, 'drain');
  const recoil = moveFx(mv, 'recoil');
  if (recoil && total > 0 && user.ability !== 'thick_skull') hurtBattler(state, i, Math.max(1, total * recoil.r), events, 'recoil');
  if (mv.struggle) hurtBattler(state, i, Math.max(1, user.maxHp / 4), events, 'struggle');

  if (!target.fainted) applySecondaries(state, i, mv, events, rng);
  if (mv.flags.includes('contact') && !user.fainted) contactEffects(state, i, events, rng);
  if (target.fainted && !user.fainted && user.ability === 'swagger') {
    events.push({ t: 'ability', side: i, name: user.name, ability: abilityName(user.ability) });
    changeStages(state, i, { atk: 1 }, events);
  }
}

function chanceOf(user, p) { return Math.min(100, user.ability === 'lucky_streak' ? p * 2 : p) / 100; }

function applySecondaries(state, i, mv, events, rng) {
  const user = activeOf(state, i), foeSide = 1 - i, target = activeOf(state, foeSide);
  for (const f of mv.fx) {
    const p = f.p == null ? 100 : f.p;
    if (f.k === 'status') { if (rng.chance(chanceOf(user, p))) setStatus(state, foeSide, f.s, events, rng, mv); }
    else if (f.k === 'stat') { if (rng.chance(chanceOf(user, p))) changeStages(state, f.who === 'self' ? i : foeSide, f.stats, events); }
    else if (f.k === 'flinch') { if (!target.moved && rng.chance(chanceOf(user, p))) target.flinch = true; }
  }
}

function contactEffects(state, i, events, rng) {
  const user = activeOf(state, i), foeSide = 1 - i, target = activeOf(state, foeSide);
  const ab = target.ability;
  if (ab === 'thorn_hide') {
    events.push({ t: 'ability', side: foeSide, name: target.name, ability: abilityName(ab) });
    hurtBattler(state, i, Math.max(1, user.maxHp / 8), events, 'thorns');
  } else if ((ab === 'live_fur' || ab === 'hot_blooded' || ab === 'venom_barbs') && rng.chance(0.3)) {
    const status = ab === 'live_fur' ? 'par' : ab === 'hot_blooded' ? 'brn' : 'psn';
    if (canHaveStatus(user, status)) {
      events.push({ t: 'ability', side: foeSide, name: target.name, ability: abilityName(ab) });
      setStatus(state, i, status, events, rng);
    }
  }
}

function applyStatusMove(state, i, mv, events, rng) {
  const foeSide = 1 - i;
  let didSomething = false;
  if (mv.fx.some((f) => f.k === 'status') && moveEffectiveness(mv, activeOf(state, foeSide)) === 0) {
    events.push({ t: 'immune', side: foeSide, name: activeOf(state, foeSide).name });
    return;
  }
  for (const f of mv.fx) {
    if (f.k === 'status') {
      const target = activeOf(state, foeSide);
      if (setStatus(state, foeSide, f.s, events, rng, mv)) didSomething = true;
      else events.push({ t: 'no_effect', side: foeSide, name: target.name, reason: target.status ? 'already' : 'immune' });
    } else if (f.k === 'stat') {
      const who = f.who === 'self' ? i : foeSide;
      const before = { ...activeOf(state, who).stages };
      changeStages(state, who, f.stats, events);
      if (Object.keys(f.stats).some((k) => activeOf(state, who).stages[k] !== before[k])) didSomething = true;
    } else if (f.k === 'heal') {
      const me = activeOf(state, i);
      if (healBattler(state, i, me.maxHp * f.r, events, 'heal')) didSomething = true;
      else events.push({ t: 'no_effect', side: i, name: me.name, reason: 'full' });
    }
  }
  if (!didSomething && !mv.fx.length) events.push({ t: 'no_effect', side: i, name: activeOf(state, i).name, reason: 'failed' });
}

function endOfTurn(state, events, rng) {
  for (const i of speedOrder(state, rng)) {
    const b = activeOf(state, i);
    if (b.fainted) continue;
    if (b.status === 'brn') hurtBattler(state, i, Math.max(1, b.maxHp / 16), events, 'brn');
    else if (b.status === 'psn') hurtBattler(state, i, Math.max(1, b.maxHp / 8), events, 'psn');
    if (!b.fainted && b.ability === 'momentum' && b.stages.spe < 6) {
      events.push({ t: 'ability', side: i, name: b.name, ability: abilityName(b.ability) });
      changeStages(state, i, { spe: 1 }, events);
    }
  }
}

function checkEnd(state, events) {
  const dead = [0, 1].map((i) => aliveCount(state.sides[i]) === 0);
  if (!dead[0] && !dead[1]) return false;
  state.phase = 'over';
  state.winner = dead[0] && dead[1] ? null : dead[0] ? 1 : 0;
  events.push({ t: 'end', winner: state.winner });
  return true;
}

/** Human-readable line for an event. `names` = [sideName0, sideName1]; opts.wild for wild encounters. */
function describeEvent(e, names = ['You', 'Foe'], opts = {}) {
  const foe = e.side === 1;
  const who = foe ? (opts.wild ? `The wild ${e.name}` : `The foe's ${e.name}`) : e.name;
  switch (e.t) {
    case 'turn': return `— Turn ${e.n} —`;
    case 'switch':
      if (!foe) return e.initial ? `Go, ${e.name}!` : `Come back! Go, ${e.name}!`;
      return opts.wild ? `A wild ${e.name} appeared!` : `${names[1]} sends out ${e.name}!`;
    case 'move': return `${who} used ${e.move}!`;
    case 'damage': {
      const bits = [];
      if (e.crit) bits.push('A critical hit!');
      if (e.eff >= 2) bits.push("It's super effective!");
      else if (e.eff > 0 && e.eff < 1) bits.push("It's not very effective…");
      return bits.join(' ');
    }
    case 'multihit': return `Hit ${e.hits} times!`;
    case 'miss': return `${who}'s attack missed!`;
    case 'no_target': return 'But there was no target…';
    case 'immune': return `It doesn't affect ${who}…`;
    case 'no_effect': return e.reason === 'already' ? `${who} is already affected.` : e.reason === 'full' ? `${who}'s HP is already full.` : e.reason === 'immune' ? `It doesn't affect ${who}…` : 'But it failed!';
    case 'status': return `${who} ${STATUS_INFO[e.status].verb}!`;
    case 'status_skip': return e.status === 'slp' ? `${who} is fast asleep.` : e.status === 'frz' ? `${who} is frozen solid!` : `${who} is paralyzed and can't move!`;
    case 'cure': return e.status === 'slp' ? `${who} woke up!` : e.status === 'frz' ? `${who} thawed out!` : `${who} recovered.`;
    case 'flinch': return `${who} flinched!`;
    case 'stat': {
      const label = STAT_LABEL[e.stat] || e.stat;
      if (e.stages === 0) return `${who}'s ${label} won't go any ${e.wanted > 0 ? 'higher' : 'lower'}!`;
      const size = Math.abs(e.stages) >= 2 ? 'sharply ' : '';
      return `${who}'s ${label} ${size}${e.stages > 0 ? 'rose' : 'fell'}!`;
    }
    case 'heal': return e.why === 'drain' ? `${who} drained some HP!` : `${who} recovered ${e.amount} HP.`;
    case 'hurt': return e.why === 'recoil' || e.why === 'struggle' ? `${who} is hit with recoil!` : e.why === 'brn' ? `${who} is hurt by its burn!` : e.why === 'psn' ? `${who} is hurt by poison!` : e.why === 'thorns' ? `${who} is pricked by thorns!` : `${who} took ${e.amount} damage.`;
    case 'ability': return `[${who}'s ${e.ability}]`;
    case 'faint': return `${who} fainted!`;
    case 'capture': return e.ok ? `Gotcha! ${e.name} was caught!` : e.shakes === 0 ? 'Oh no! It broke free right away!' : e.shakes === 1 ? 'It shook once… and broke free!' : 'So close! It broke free!';
    case 'end': return e.capture ? `${e.name} joined the team!` : e.winner == null ? 'Both sides are out of creatures. It is a draw!' : e.winner === 0 ? `${names[0]} won the battle!` : opts.wild ? 'Your team was defeated…' : `${names[1]} won the battle!`;
    default: return '';
  }
}

// ---- src/battle/ai.js ----
// Opponent AI: a scored heuristic. Deterministic given its rng.



function bestEffVs(attacker, defender) {
  let best = 0;
  for (const m of attacker.moves) {
    const mv = getMove(m.id);
    if (!mv || !isDamaging(mv) || m.pp <= 0) continue;
    best = Math.max(best, moveEffectiveness(mv, defender) * (attacker.types.includes(mv.type) ? 1.5 : 1));
  }
  return best;
}

function scoreMove(state, side, action, rng) {
  const me = activeOf(state, side), foe = activeOf(state, 1 - side);
  const mv = action.struggle ? STRUGGLE : getMove(me.moves[action.index].id);
  const acc = mv.acc == null ? 1 : mv.acc / 100;
  const faster = effectiveStat(me, 'spe') > effectiveStat(foe, 'spe') || mv.prio > 0;
  if (isDamaging(mv)) {
    const eff = moveEffectiveness(mv, foe);
    if (eff === 0) return -60;
    const est = calcDamage(me, foe, mv, eff, 0.925, false);
    const frac = Math.min(1, est / Math.max(1, foe.hp));
    let s = frac * 100 * acc;
    if (est >= foe.hp) s = 110 * acc + (faster ? 25 : 0);
    for (const f of mv.fx) {
      const p = (f.p == null ? 100 : f.p) / 100;
      if (f.k === 'status' && !foe.status) s += 25 * p;
      if (f.k === 'stat' && f.who === 'foe') s += 6 * p * Object.values(f.stats).reduce((a, b) => a + Math.abs(b), 0);
      if (f.k === 'stat' && f.who === 'self') s += 5 * p * Object.values(f.stats).reduce((a, b) => a + b, 0);
      if (f.k === 'drain') s += frac * 25 * f.r;
      if (f.k === 'recoil') s -= frac * 20 * f.r;
      if (f.k === 'flinch' && faster) s += 15 * p;
    }
    if (mv.struggle) s -= 30;
    return s;
  }
  let s = 0;
  for (const f of mv.fx) {
    if (f.k === 'status') {
      if (foe.status) s -= 25;
      else s += (f.s === 'slp' ? 50 : f.s === 'par' ? 38 : f.s === 'brn' ? (foe.stats.atk > foe.stats.spa ? 42 : 24) : f.s === 'psn' ? 30 : 30) * acc;
    } else if (f.k === 'stat' && f.who === 'self') {
      // Boosts are worth it early and healthy, and not past +2 in a stat we already raised.
      const room = Object.entries(f.stats).reduce((a, [k, n]) => a + Math.max(0, Math.min(n, 2 - me.stages[k])), 0);
      s += me.hp > me.maxHp * 0.55 ? 15 * room + (state.turn < 2 ? 6 : 0) : 4 * room;
    } else if (f.k === 'stat' && f.who === 'foe') {
      // Lowering a stat is only worth it while the foe actually uses that stat, and it decays fast.
      let v = 0;
      for (const [k, n] of Object.entries(f.stats)) {
        const already = -foe.stages[k];
        const room = Math.max(0, Math.min(-n, 6 - already));
        let use = 1;
        if (k === 'spe') use = faster ? 0 : 1;
        else if (k === 'atk') use = foe.stats.atk >= foe.stats.spa ? 1 : 0.2;
        else if (k === 'spa') use = foe.stats.spa >= foe.stats.atk ? 1 : 0.2;
        else if (k === 'def') use = me.stats.atk >= me.stats.spa ? 0.8 : 0.2;
        else if (k === 'spd') use = me.stats.spa >= me.stats.atk ? 0.8 : 0.2;
        else if (k === 'acc') use = 0.6;
        v += 9 * room * use * (already >= 2 ? 0.3 : 1);
      }
      s += v * acc;
    } else if (f.k === 'heal') {
      s += me.hp < me.maxHp * 0.45 ? 55 : me.hp < me.maxHp * 0.7 ? 18 : -30;
    }
  }
  return s + rng.range(0, 2);
}

function scoreSwitch(state, side, action) {
  const s = state.sides[side];
  const me = activeOf(state, side), foe = activeOf(state, 1 - side), cand = s.party[action.index];
  const threatNow = bestEffVs(foe, me), threatThen = bestEffVs(foe, cand);
  const myBest = bestEffVs(me, foe), candBest = bestEffVs(cand, foe);
  let score = -12;
  if (threatNow >= 2 && threatThen <= 1 && candBest >= myBest) score += 45;
  if (myBest === 0 && candBest > 0) score += 40;
  if (me.hp < me.maxHp * 0.2 && cand.hp > cand.maxHp * 0.6 && candBest >= 1) score += 10;
  score += (cand.hp / cand.maxHp) * 5;
  return score;
}

function scoreReplacement(state, side, action) {
  const foe = activeOf(state, 1 - side), cand = state.sides[side].party[action.index];
  return bestEffVs(cand, foe) * 20 - bestEffVs(foe, cand) * 15 + (cand.hp / cand.maxHp) * 10;
}

/** Pick an action for a side. Returns null when the side has nothing to do. */
function chooseAction(state, side, rng) {
  const legal = legalActions(state, side);
  if (!legal.length) return null;
  let best = null, bestScore = -Infinity;
  for (const a of legal) {
    if (a.type === 'capture') continue; // the AI never captures
    let score;
    if (state.phase === 'replace') score = scoreReplacement(state, side, a);
    else if (a.type === 'switch') score = scoreSwitch(state, side, a);
    else score = scoreMove(state, side, a, rng);
    score += rng.range(0, 3);
    if (score > bestScore) { best = a; bestScore = score; }
  }
  return best;
}

// ---- src/core/sfx.js ----
// Procedural sound effects on WebAudio. No assets. Everything is a few tones or
// a burst of noise, so it costs nothing to ship and never needs loading.
let ctx = null;
let enabled = true;

function setSfxEnabled(v) { enabled = Boolean(v); if (enabled) audioCtx(); }
function sfxEnabled() { return enabled; }

function audioCtx() {
  if (!enabled || typeof window === 'undefined') return null;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = ctx || new AC();
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  } catch { return null; }
}

function tone({ freq = 440, to = null, type = 'square', dur = 0.12, gain = 0.07, delay = 0 }) {
  const c = audioCtx();
  if (!c) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(20, freq), t0);
  if (to) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(c.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}

function noise({ dur = 0.15, gain = 0.1, delay = 0, cutoff = 1200 }) {
  const c = audioCtx();
  if (!c) return;
  const len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = c.createBufferSource();
  src.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = cutoff;
  const g = c.createGain();
  g.gain.value = gain;
  src.connect(f).connect(g).connect(c.destination);
  src.start(c.currentTime + delay);
}

const arp = (freqs, type, dur, gap, gain = 0.06) => freqs.forEach((f, i) => tone({ freq: f, type, dur, gain, delay: i * gap }));

const sfx = {
  tap: () => tone({ freq: 660, type: 'triangle', dur: 0.05, gain: 0.035 }),
  hit: (eff = 1) => { noise({ dur: 0.12, gain: eff >= 2 ? 0.18 : 0.1, cutoff: eff >= 2 ? 2400 : 1200 }); tone({ freq: eff >= 2 ? 240 : 160, to: 55, type: 'square', dur: 0.16, gain: 0.07 }); },
  miss: () => tone({ freq: 520, to: 300, type: 'sine', dur: 0.16, gain: 0.04 }),
  heal: () => arp([523, 784], 'sine', 0.14, 0.09),
  status: () => tone({ freq: 320, to: 190, type: 'sawtooth', dur: 0.22, gain: 0.045 }),
  stat: (up) => (up ? arp([440, 660], 'triangle', 0.08, 0.06, 0.04) : arp([660, 440], 'triangle', 0.08, 0.06, 0.04)),
  faint: () => tone({ freq: 420, to: 50, type: 'sawtooth', dur: 0.55, gain: 0.07 }),
  wobble: () => tone({ freq: 330, to: 270, type: 'triangle', dur: 0.14, gain: 0.05 }),
  capture: (ok) => (ok ? arp([523, 659, 784, 1047], 'square', 0.13, 0.1) : tone({ freq: 220, to: 110, type: 'square', dur: 0.28, gain: 0.06 })),
  levelUp: () => arp([659, 784, 988, 1319], 'triangle', 0.15, 0.08),
  win: () => arp([523, 659, 784, 1047, 1319], 'square', 0.16, 0.11, 0.05),
  lose: () => arp([392, 349, 311, 196], 'sawtooth', 0.28, 0.2, 0.05),
  fuse: () => { arp([262, 330, 392, 523, 659, 784], 'sine', 0.2, 0.07, 0.05); noise({ dur: 0.5, gain: 0.05, cutoff: 600, delay: 0.3 }); },
  /** A short cry shaped by the genome: bigger creatures are lower, type picks the timbre. */
  cry: (genome) => {
    const size = genome && genome.traits && genome.traits.size != null ? genome.traits.size : 0.5;
    const base = 720 - size * 420;
    const t = genome && genome.types ? genome.types[0] : 'Normal';
    const type = ['Electric', 'Steel', 'Rock', 'Bug'].includes(t) ? 'square' : ['Ghost', 'Psychic', 'Fairy', 'Ice', 'Water'].includes(t) ? 'sine' : ['Dragon', 'Fire', 'Fighting', 'Dark'].includes(t) ? 'sawtooth' : 'triangle';
    tone({ freq: base, to: base * 1.45, type, dur: 0.13, gain: 0.06 });
    tone({ freq: base * 1.3, to: base * 0.75, type, dur: 0.22, gain: 0.055, delay: 0.13 });
  },
};

// ---- src/ui/fight.js ----
// Reusable interactive battle view. Mount it with an engine state and it plays
// events, takes the player's choices, asks the AI for the foe's, and reports
// the final state. Used by the sandbox Battle tab and by the Arena.











const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const hpClass = (frac) => (frac > 0.5 ? 'ok' : frac > 0.2 ? 'warn' : 'low');

/**
 * cfg: { state, events, names, auto, fast, onEnd(state), onQuit(), resultButtons: [{label, primary, onclick}] }
 * Returns { destroy() }.
 */
function mountFight(root, cfg) {
  const f = {
    root, state: cfg.state, names: cfg.names || ['You', 'Foe'], wild: Boolean(cfg.wild), auto: Boolean(cfg.auto), fast: Boolean(cfg.fast),
    busy: true, log: [], els: null, token: 1, alive: true, sheetClose: null,
    onEnd: cfg.onEnd || (() => {}), onQuit: cfg.onQuit || null, resultButtons: cfg.resultButtons || null, ended: false,
  };
  buildFight(f);
  playFightEvents(f, cfg.events || []).then((ok) => { if (ok) afterFightStep(f); });
  return {
    destroy() { f.alive = false; f.token++; if (f.sheetClose) f.sheetClose(); },
    get state() { return f.state; },
  };
}

function buildFight(f) {
  const els = {
    foePanel: h('div', { class: 'panel panel-foe' }),
    foeStage: h('div', { class: 'stage stage-foe' }),
    meStage: h('div', { class: 'stage stage-me' }),
    mePanel: h('div', { class: 'panel panel-me' }),
    log: h('div', { class: 'battle-log', 'aria-live': 'polite' }),
    controls: h('div', { class: 'controls' }),
  };
  f.els = els;
  clear(f.root).append(
    h('div', { class: 'arena' },
      h('div', { class: 'arena-row' }, els.foePanel, els.foeStage),
      h('div', { class: 'arena-row' }, els.meStage, els.mePanel)),
    els.log,
    els.controls,
  );
  for (const i of [0, 1]) { renderStage(f, i); renderPanel(f, i); }
  renderFightControls(f);
}

function renderPanel(f, i) {
  const st = f.state, side = st.sides[i], b = activeOf(st, i);
  const el = i === 0 ? f.els.mePanel : f.els.foePanel;
  const frac = b.hp / b.maxHp;
  appendChildren(clear(el), [
    h('div', { class: 'panel-head' }, h('b', {}, b.name), h('span', { class: 'lvl' }, `Lv ${b.level}`),
      b.status ? h('span', { class: `status st-${b.status}` }, STATUS_INFO[b.status].short) : null),
    typeChips(b.types),
    h('div', { class: 'hpbar' }, h('i', { class: hpClass(frac), style: { width: `${Math.max(0, frac * 100)}%` } })),
    h('div', { class: 'panel-foot' },
      h('span', { class: 'hpnum' }, i === 0 ? `${b.hp} / ${b.maxHp}` : `${Math.ceil(frac * 100)}%`),
      h('span', { class: 'balls' }, side.party.map((p) => h('i', { class: p.fainted ? 'out' : '' })))),
    b.xp ? xpRow(b.xp) : null,
  ]);
}

function xpFrac(xp) { return xp.next > xp.prev ? Math.max(0, Math.min(1, (xp.cur - xp.prev) / (xp.next - xp.prev))) : 1; }

/** Labelled EXP bar. title carries the exact numbers. */
function xpRow(xp) {
  const frac = xpFrac(xp);
  const toNext = Math.max(0, xp.next - xp.cur);
  return h('div', { class: 'xprow', title: xp.next > xp.prev ? `${toNext} EXP to the next level` : 'Max level' },
    h('span', {}, 'EXP'),
    h('div', { class: 'xpbar' }, h('i', { style: { width: `${frac * 100}%` } })));
}

/** After a win: fill the active creature's EXP bar, rolling over on each level gained. */
async function animateXp(f, gains) {
  const st = f.state;
  for (const g of gains) { const b = st.sides[0].party[g.index]; if (b && g.after) { b.xp = g.after; b.level = g.to.level; } }
  const g = gains.find((x) => x.index === st.sides[0].active);
  const panel = f.els.mePanel;
  const bar = panel && panel.querySelector('.xpbar i');
  if (!g || !bar) return;
  const lvl = panel.querySelector('.lvl');
  const name = activeOf(st, 0).name;
  const speed = f.fast ? 0.35 : 1;
  let level = g.from.level;
  bar.style.transition = 'none';
  bar.style.width = `${g.from.frac * 100}%`;
  await wait(60);
  while (level < g.to.level && f.alive) {
    bar.style.transition = `width ${0.6 * speed}s ease`;
    bar.style.width = '100%';
    await wait(680 * speed);
    level++;
    sfx.levelUp();
    if (lvl) lvl.textContent = `Lv ${level}`;
    logLine(f, `${name} grew to Lv ${level}!`);
    bar.style.transition = 'none';
    bar.style.width = '0%';
    await wait(90);
  }
  bar.style.transition = `width ${0.6 * speed}s ease`;
  bar.style.width = `${g.to.frac * 100}%`;
  await wait(720 * speed);
}

function renderStage(f, i) {
  const b = activeOf(f.state, i);
  const el = i === 0 ? f.els.meStage : f.els.foeStage;
  clear(el).append(h('div', { class: 'combatant enter' }, creatureEl(b.genome, { size: 200, facing: i === 0 ? 'right' : 'left' })));
  setTimeout(() => { const c = el.firstChild; if (c) c.classList.remove('enter'); }, 400);
}

function setHp(f, i, hp, maxHp) {
  const el = i === 0 ? f.els.mePanel : f.els.foePanel;
  const bar = el.querySelector('.hpbar i');
  const frac = hp / maxHp;
  if (bar) { bar.style.width = `${Math.max(0, frac * 100)}%`; bar.className = hpClass(frac); }
  const num = el.querySelector('.hpnum');
  if (num) num.textContent = i === 0 ? `${hp} / ${maxHp}` : `${Math.ceil(frac * 100)}%`;
}

function animateStage(f, i, cls, ms = 500) {
  const el = i === 0 ? f.els.meStage : f.els.foeStage;
  const c = el.firstChild;
  if (!c) return;
  c.classList.add(cls);
  setTimeout(() => c.classList.remove(cls), ms);
}

function logLine(f, text) {
  if (!text) return;
  f.log.push(text);
  const el = f.els.log;
  el.append(h('div', { class: 'line' }, text));
  while (el.children.length > 4) el.removeChild(el.firstChild);
}

/** Apply one event to the DOM. Returns how long to pause after it. */
function applyFightEvent(f, e) {
  const text = describeEvent(e, f.names, { wild: f.wild });
  switch (e.t) {
    case 'turn': logLine(f, text); return 250;
    case 'switch': renderStage(f, e.side); renderPanel(f, e.side); logLine(f, text); sfx.cry(activeOf(f.state, e.side).genome); return 650;
    case 'move': logLine(f, text); animateStage(f, e.side, e.side === 0 ? 'lunge-r' : 'lunge-l', 450); return 550;
    case 'damage': animateStage(f, e.side, 'hit', 450); setHp(f, e.side, e.hp, e.maxHp); logLine(f, text); sfx.hit(e.eff); return e.eff !== 1 || e.crit ? 750 : 550;
    case 'hurt': animateStage(f, e.side, 'hit', 350); setHp(f, e.side, e.hp, e.maxHp); logLine(f, text); sfx.hit(1); return 550;
    case 'heal': setHp(f, e.side, e.hp, e.maxHp); logLine(f, text); sfx.heal(); return 550;
    case 'faint': animateStage(f, e.side, 'faint', 900); logLine(f, text); renderPanel(f, e.side); sfx.faint(); return 900;
    case 'status': renderPanel(f, e.side); logLine(f, text); sfx.status(); return 550;
    case 'cure': renderPanel(f, e.side); logLine(f, text); return 550;
    case 'stat': logLine(f, text); if (e.stages) sfx.stat(e.stages > 0); return 450;
    case 'miss': logLine(f, text); sfx.miss(); return 450;
    case 'capture': animateStage(f, 1, e.ok ? 'captured' : 'wobble', e.ok ? 900 : 700); logLine(f, text); sfx.capture(e.ok); return e.ok ? 900 : 800;
    case 'end': logLine(f, text); if (e.winner === 0) sfx.win(); else if (e.winner === 1) sfx.lose(); return 600;
    default: logLine(f, text); return text ? 450 : 0;
  }
}

async function playFightEvents(f, events) {
  const token = f.token;
  for (const e of events) {
    if (!f.alive || token !== f.token || !f.root.isConnected) return false;
    const ms = applyFightEvent(f, e);
    if (ms) await wait(f.fast ? Math.round(ms * 0.3) : ms);
  }
  return f.alive && token === f.token && f.root.isConnected;
}

function aiFor(st, i) { return chooseAction(st, i, makeRng(`${st.seed}:ai:${st.turn}:${st.phase}:${i}`)); }

async function doFightStep(f, playerAction) {
  const st = f.state;
  let actions;
  if (st.phase === 'replace') actions = [st.sides[0].needsReplace ? (playerAction || aiFor(st, 0)) : null, st.sides[1].needsReplace ? aiFor(st, 1) : null];
  else actions = [playerAction || aiFor(st, 0), aiFor(st, 1)];
  let result;
  try { result = step(st, actions); } catch (e) { toast(e.message); f.busy = false; renderFightControls(f); return; }
  f.state = result.state;
  f.busy = true;
  renderFightControls(f);
  const ok = await playFightEvents(f, result.events);
  if (ok) afterFightStep(f);
}

async function afterFightStep(f) {
  const st = f.state;
  if (st.phase === 'over') {
    f.busy = false;
    renderFightControls(f);
    if (!f.ended) {
      f.ended = true;
      const after = f.onEnd(st);
      if (after && Array.isArray(after.xp) && after.xp.length) await animateXp(f, after.xp);
      if (f.alive) showFightResult(f);
    }
    return;
  }
  if (st.phase === 'replace') {
    if (st.sides[0].needsReplace && !f.auto) { f.busy = false; renderFightControls(f); openFightParty(f, true); return; }
    await wait(f.fast ? 200 : 500);
    if (f.alive) doFightStep(f, null);
    return;
  }
  f.busy = false;
  renderFightControls(f);
  if (f.auto) { await wait(f.fast ? 250 : 700); if (f.alive && f.auto && !f.busy && f.state.phase === 'choose') doFightStep(f, null); }
}

function effMarker(mv, foe) {
  if (mv.cat === 'status' && !mv.fx.some((x) => x.k === 'status')) return '';
  const eff = moveEffectiveness(mv, foe);
  if (mv.cat === 'status') return eff === 0 ? '✕' : '';
  if (eff === 0) return '✕';
  if (eff >= 4) return '▲▲';
  if (eff >= 2) return '▲';
  if (eff <= 0.25) return '▼▼';
  if (eff < 1) return '▼';
  return '';
}

function renderFightControls(f) {
  const el = f.els && f.els.controls;
  if (!el) return;
  const st = f.state;
  clear(el);
  const util = h('div', { class: 'util-row' },
    h('button', { class: `btn small${f.fast ? ' on' : ''}`, type: 'button', onclick: () => { f.fast = !f.fast; renderFightControls(f); } }, f.fast ? 'Fast ✓' : 'Fast'),
    h('button', { class: `btn small${f.auto ? ' on' : ''}`, type: 'button', onclick: () => { f.auto = !f.auto; renderFightControls(f); if (f.auto && !f.busy && st.phase !== 'over') afterFightStep(f); } }, f.auto ? 'Auto ✓' : 'Auto'),
    f.onQuit ? h('button', { class: 'btn small', type: 'button', onclick: () => { f.alive = false; f.token++; f.onQuit(); } }, 'Quit') : null,
  );
  if (st.phase === 'over') { el.append(util); return; }
  if (f.busy || f.auto) { el.append(h('div', { class: 'waiting' }, f.auto ? 'Auto battle running…' : '…'), util); return; }
  if (st.phase === 'replace') {
    el.append(h('button', { class: 'btn primary fuse-btn', type: 'button', onclick: () => openFightParty(f, true) }, 'Choose next creature'), util);
    return;
  }
  const me = activeOf(st, 0), foe = activeOf(st, 1);
  const legal = legalActions(st, 0);
  const grid = h('div', { class: 'moves' });
  me.moves.forEach((m, i) => {
    const mv = getMove(m.id);
    const info = TYPE_INFO[mv.type];
    const ok = legal.some((a) => a.type === 'move' && a.index === i);
    grid.append(h('button', { class: 'move-btn', type: 'button', disabled: !ok, style: { '--chip': info.color }, onclick: () => doFightStep(f, { type: 'move', index: i }) },
      h('span', { class: 'mv-name' }, mv.name, h('em', { class: 'eff' }, effMarker(mv, foe))),
      h('span', { class: 'mv-meta' }, h('span', { class: 'chip' }, h('b', {}, info.glyph), mv.type), h('span', { class: 'pp' }, `${m.pp}/${m.maxPp}`))));
  });
  const struggle = legal.find((a) => a.struggle);
  if (struggle) grid.append(h('button', { class: 'move-btn', type: 'button', onclick: () => doFightStep(f, struggle) }, h('span', { class: 'mv-name' }, 'Struggle'), h('span', { class: 'mv-meta' }, 'No PP left')));
  const row = h('div', { class: 'row wrap' },
    h('button', { class: 'btn', type: 'button', onclick: () => openFightParty(f, false) }, `Party (${aliveCount(st.sides[0])})`),
    h('button', { class: 'btn', type: 'button', onclick: () => openSheet(me.genome) }, 'Info'));
  if (legal.some((a) => a.type === 'capture')) {
    const pct = Math.round(captureChance(foe) * 100);
    row.prepend(h('button', { class: 'btn capture', type: 'button', onclick: () => doFightStep(f, { type: 'capture' }) }, `Capture · ${pct}%`));
  }
  el.append(grid, row, util);
}

function openFightParty(f, forced) {
  if (f.sheetClose) f.sheetClose();
  const st = f.state, side = st.sides[0];
  const legal = legalActions(st, 0);
  const close = () => { backdrop.remove(); sheet.remove(); f.sheetClose = null; };
  f.sheetClose = close;
  const backdrop = h('div', { class: 'sheet-backdrop', onclick: forced ? null : close });
  const list = h('div', { class: 'party-list' });
  side.party.forEach((b, i) => {
    const can = legal.some((a) => a.type === 'switch' && a.index === i);
    const frac = b.hp / b.maxHp;
    list.append(h('button', { class: `party-row${i === side.active ? ' active' : ''}${b.fainted ? ' fainted' : ''}`, type: 'button', disabled: !can, onclick: () => { close(); doFightStep(f, { type: 'switch', index: i }); } },
      creatureEl(b.genome, { size: 64, animate: false }),
      h('div', { class: 'party-info' },
        h('div', {}, h('b', {}, b.name), ' ', h('span', { class: 'lvl' }, `Lv ${b.level}`), ' ', b.status ? h('span', { class: `status st-${b.status}` }, STATUS_INFO[b.status].short) : null, i === side.active ? h('span', { class: 'status' }, 'ACTIVE') : null),
        h('div', { class: 'hpbar' }, h('i', { class: hpClass(frac), style: { width: `${frac * 100}%` } })),
        b.xp ? xpRow(b.xp) : null,
        h('div', { class: 'hint', style: { margin: 0 } }, `${b.hp} / ${b.maxHp} · ${abilityName(b.ability)}`))));
  });
  const sheet = h('section', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Party' },
    h('div', { class: 'grab' }),
    h('div', { class: 'sheet-head' }, h('h2', {}, forced ? 'Choose your next creature' : 'Party'), forced ? null : h('button', { class: 'btn close', onclick: close, 'aria-label': 'Close' }, '✕')),
    list);
  document.body.append(backdrop, sheet);
}

function showFightResult(f) {
  const st = f.state;
  const won = st.winner === 0, draw = st.winner == null;
  const title = st.captured ? 'Caught!' : draw ? 'Draw!' : won ? 'You won!' : 'You lost…';
  const buttons = (f.resultButtons || []).map((b) => h('button', { class: `btn${b.primary ? ' primary' : ''}`, type: 'button', onclick: b.onclick }, b.label));
  f.els.controls.prepend(h('div', { class: 'result-card' },
    h('h2', {}, title),
    h('p', { class: 'hint' }, `${st.turn} turns · ${aliveCount(st.sides[0])} of yours still standing`),
    buttons.length ? h('div', { class: 'row wrap' }, buttons) : null));
}

// ---- src/ui/battle.js ----
// Sandbox battles: pick a party, fight a random opponent, or watch AI vs AI.








const LEVELS = [10, 30, 50, 100];
const bs = { mode: 'setup', level: 30, rosterSeed: 'ARENA', roster: [], chosen: [], root: null, fight: null, last: null, auto: false };
let seededRoster = { seed: null, genomes: [] };

function buildRoster() {
  if (seededRoster.seed !== bs.rosterSeed) {
    seededRoster = { seed: bs.rosterSeed, genomes: Array.from({ length: 6 }, (_, i) => randomGenome(makeRng(`${bs.rosterSeed}:roster:${i}`))) };
  }
  const out = seededRoster.genomes.slice();
  for (const g of fusionPool.genomes) if (!out.includes(g)) out.push(g);
  bs.roster = out;
  bs.chosen = bs.chosen.filter((g) => out.includes(g));
}

function renderBattleScreen(root) {
  bs.root = root;
  if (bs.fight) { bs.fight.destroy(); bs.fight = null; }
  buildRoster();
  clear(root);
  if (bs.mode === 'fight' && bs.last) startSandboxBattle(bs.last.mine, { foeParty: bs.last.foe, seed: bs.last.seed });
  else setupView(root);
}

function setupView(root) {
  const rerender = () => renderBattleScreen(root);
  const levelRow = h('div', { class: 'chips-row' }, LEVELS.map((L) => h('button', {
    class: `btn lvl${bs.level === L ? ' on' : ''}`, type: 'button', onclick: () => { bs.level = L; rerender(); },
  }, `Lv ${L}`)));
  const grid = h('div', { class: 'pool' });
  for (const g of bs.roster) {
    const idx = bs.chosen.indexOf(g);
    grid.append(h('button', { class: `pcard${idx >= 0 ? ' is-on' : ''}`, type: 'button', onclick: () => {
      if (idx >= 0) bs.chosen.splice(idx, 1);
      else if (bs.chosen.length < MAX_PARTY) bs.chosen.push(g);
      else { toast(`Party is full (${MAX_PARTY}).`); return; }
      rerender();
    } },
      idx >= 0 ? h('span', { class: 'sel badge a' }, String(idx + 1)) : null,
      g.gen ? h('span', { class: 'gen' }, `gen ${g.gen}`) : null,
      creatureEl(g, { size: 104, animate: false }),
      h('span', {}, g.name)));
  }
  const start = (auto) => {
    let party = bs.chosen.slice();
    if (!party.length) party = bs.roster.slice(0, 3);
    bs.auto = auto;
    startSandboxBattle(party);
  };
  root.append(
    h('p', { class: 'hint' }, `Free battles for testing. Pick up to ${MAX_PARTY} creatures; the opponent gets a random party of the same size and level.`),
    ...section('Level', levelRow),
    ...section(`Your party · ${bs.chosen.length}/${MAX_PARTY}`,
      h('div', { class: 'toolbar' },
        h('button', { class: 'btn', type: 'button', onclick: () => { bs.rosterSeed = freshSeed(); bs.chosen = []; rerender(); } }, 'New roster'),
        h('button', { class: 'btn', type: 'button', onclick: () => { bs.chosen = []; rerender(); } }, 'Clear')),
      h('p', { class: 'hint' }, 'Creatures from the fusion pool show up here too.'),
      grid),
    h('div', { class: 'row wrap' },
      h('button', { class: 'btn primary fuse-btn', type: 'button', onclick: () => start(false) }, bs.chosen.length ? 'Battle!' : 'Quick battle'),
      h('button', { class: 'btn', type: 'button', onclick: () => start(true) }, 'Watch AI vs AI')),
  );
}

function startSandboxBattle(partyGenomes, opts = {}) {
  const seed = opts.seed || freshSeed();
  const rng = makeRng(`${seed}:foe`);
  const foeParty = opts.foeParty || Array.from({ length: partyGenomes.length }, (_, i) => randomGenome(rng.fork(`f${i}`)));
  const { state, events } = createBattle({
    sides: [
      { name: 'You', party: partyGenomes.map((g) => makeBattler(g, bs.level)) },
      { name: 'Foe', ai: true, party: foeParty.map((g) => makeBattler(g, bs.level)) },
    ],
    seed,
  });
  bs.last = { mine: partyGenomes, foe: foeParty, seed };
  bs.mode = 'fight';
  if (bs.fight) bs.fight.destroy();
  clear(bs.root);
  const host = h('div');
  bs.root.append(host);
  bs.fight = mountFight(host, {
    state, events, names: ['You', 'Foe'], auto: bs.auto,
    onQuit: () => { bs.mode = 'setup'; bs.auto = false; renderBattleScreen(bs.root); },
    resultButtons: [
      { label: 'Rematch', primary: true, onclick: () => { bs.auto = false; startSandboxBattle(bs.last.mine, { foeParty: bs.last.foe }); } },
      { label: 'New opponent', onclick: () => { bs.auto = false; startSandboxBattle(bs.last.mine); } },
      { label: 'Change party', onclick: () => { bs.mode = 'setup'; bs.auto = false; renderBattleScreen(bs.root); } },
    ],
  });
}

// ---- src/game/save.js ----
// Persistent save: best results, the creature collection, and the run in progress.





const SAVE_KEY = 'creaturecollector.save';
const SAVE_VERSION = 1;
const SAVE_PREFIX = 'CCSAVE1.';
const COLLECTION_MAX = 200;

function emptySave() {
  return {
    v: SAVE_VERSION,
    best: { floor: 0, runs: 0 },
    totals: { battles: 0, captures: 0, fusions: 0 },
    collection: [],
    run: null,
    settings: { fast: false },
  };
}

function cleanMember(m) {
  if (!m || typeof m !== 'object') return null;
  try { validateGenome(m.genome); } catch { return null; }
  if (!Number.isFinite(m.level)) return null;
  const level = Math.max(1, Math.min(100, Math.round(m.level)));
  let moves = Array.isArray(m.moves) ? m.moves.filter((id) => typeof id === 'string' && getMove(id)).slice(0, 4) : [];
  if (!moves.length) moves = movesAtLevel(learnsetOf(m.genome), level);
  return { uid: String(m.uid || ''), genome: m.genome, level, xp: Number.isFinite(m.xp) ? m.xp : 0, hp: Number.isFinite(m.hp) ? Math.max(0, m.hp) : 1, status: m.status || null, moves };
}

/** Coerce any parsed object into a valid save, dropping anything broken. */
function normalizeSave(raw) {
  const s = emptySave();
  if (!raw || typeof raw !== 'object' || raw.v !== SAVE_VERSION) return s;
  if (raw.best) { s.best.floor = Number(raw.best.floor) || 0; s.best.runs = Number(raw.best.runs) || 0; }
  if (raw.totals) for (const k of Object.keys(s.totals)) s.totals[k] = Number(raw.totals[k]) || 0;
  if (raw.settings) s.settings.fast = Boolean(raw.settings.fast);
  if (Array.isArray(raw.collection)) {
    for (const e of raw.collection) {
      try { validateGenome(e.genome); s.collection.push({ genome: e.genome, floor: Number(e.floor) || 0, when: Number(e.when) || 0 }); } catch { /* skip */ }
      if (s.collection.length >= COLLECTION_MAX) break;
    }
  }
  const r = raw.run;
  if (r && typeof r === 'object' && ['starter', 'floor', 'gameover'].includes(r.phase)) {
    const run = {
      seed: String(r.seed || 'run'), floor: Math.max(1, Number(r.floor) || 1), phase: r.phase,
      party: (Array.isArray(r.party) ? r.party : []).map(cleanMember).filter(Boolean),
      box: (Array.isArray(r.box) ? r.box : []).map(cleanMember).filter(Boolean),
      starters: null, altar: Boolean(r.altar), encounter: r.encounter && r.encounter.foes ? r.encounter : null,
      nextId: Number(r.nextId) || 1, stats: { battles: 0, captures: 0, fusions: 0, bosses: 0, ...(r.stats || {}) }, lastReport: r.lastReport || null,
      pendingLearns: (Array.isArray(r.pendingLearns) ? r.pendingLearns : []).filter((q) => q && typeof q.uid === 'string' && getMove(q.moveId)),
    };
    if (Array.isArray(r.starters)) {
      run.starters = r.starters.filter((g) => { try { validateGenome(g); return true; } catch { return false; } });
    }
    const usable = run.phase === 'starter' ? run.starters && run.starters.length === 3 : run.party.length > 0;
    if (usable) s.run = run;
  }
  return s;
}

function storageOf(storage) {
  if (storage) return storage;
  try { return globalThis.localStorage || null; } catch { return null; }
}

function loadSave(storage) {
  const st = storageOf(storage);
  if (!st) return emptySave();
  try { const raw = st.getItem(SAVE_KEY); return raw ? normalizeSave(JSON.parse(raw)) : emptySave(); } catch { return emptySave(); }
}

function persistSave(save, storage) {
  const st = storageOf(storage);
  if (!st) return false;
  try { st.setItem(SAVE_KEY, JSON.stringify(save)); return true; } catch { return false; }
}

function clearSave(storage) {
  const st = storageOf(storage);
  try { if (st) st.removeItem(SAVE_KEY); } catch { /* ignore */ }
}

function exportSave(save) { return SAVE_PREFIX + b64uEncode(JSON.stringify(save)); }

function importSave(code) {
  const s = String(code || '').trim();
  if (!s.startsWith(SAVE_PREFIX)) throw new Error('That is not a save code.');
  let raw;
  try { raw = JSON.parse(b64uDecode(s.slice(SAVE_PREFIX.length))); } catch { throw new Error('That save code is damaged.'); }
  return normalizeSave(raw);
}

/** Remember a creature in the collection. Wild species dedupe by species; fusions by name and seed. */
function recordCollection(save, genome, floor) {
  const key = genome.gen ? `${genome.name}#${genome.seed}` : genome.species;
  const exists = save.collection.some((e) => (e.genome.gen ? `${e.genome.name}#${e.genome.seed}` : e.genome.species) === key);
  if (exists) return false;
  save.collection.push({ genome, floor: floor || 0, when: Date.now() });
  while (save.collection.length > COLLECTION_MAX) save.collection.shift();
  return true;
}

/** Close out a run: tally totals, update the best floor, retire its creatures to the collection. */
function endRun(save) {
  const run = save.run;
  if (!run) return save;
  const reached = run.phase === 'gameover' ? run.floor : Math.max(1, run.floor - 1);
  save.best.floor = Math.max(save.best.floor, reached);
  save.best.runs++;
  save.totals.battles += run.stats.battles || 0;
  save.totals.captures += run.stats.captures || 0;
  save.totals.fusions += run.stats.fusions || 0;
  for (const m of [...run.party, ...run.box]) recordCollection(save, m.genome, run.floor);
  save.run = null;
  return save;
}

// ---- src/game/run.js ----
// Endless arena rules. Pure game logic over a plain `run` object; the UI calls
// these and persists the result. Every roll is seeded by the run seed and floor.











const ARENA = {
  partyMax: MAX_PARTY,
  starterLevel: 8,
  baseLevel: 3,
  levelPerFloor: 2,
  maxLevel: 100,
  bossEvery: 5,
  trainerEvery: 3,
  healBetweenFloors: 0.5,
  xpK: 7,
  wildFusionFrom: 8,
  rareFrom: 4,
  gentleFloors: 3,
};

const TRAINER_NAMES = ['Ranger Ivy', 'Scout Bram', 'Herder Tobin', 'Keeper Sable', 'Drifter Wren', 'Tamer Oakes', 'Courier Pim', 'Warden’s Aide Lise'];
const WARDEN_NAMES = ['Ashvale', 'Brine', 'Cinder', 'Duskmoor', 'Emberlake', 'Frostgate', 'Gloam', 'Hollowreach'];

function floorLevel(floor) { return Math.min(ARENA.maxLevel, ARENA.baseLevel + floor * ARENA.levelPerFloor); }
function xpForLevel(L) { return L * L * L; }
/** XP for defeating (or catching) one foe. Tuned so a floor is worth roughly two levels. */
function xpReward(level, bst, kind) {
  return Math.round(ARENA.xpK * level * level * ((bst || 400) / 400) * (kind === 'boss' ? 1.5 : 1));
}

function memberMaxHp(m) { return statsAtLevel(m.genome, m.level).hp; }

/** XP progress within the current level: { cur, prev, next, frac }. frac is 1 at the level cap. */
function xpProgress(m) {
  const prev = xpForLevel(m.level);
  const next = m.level >= ARENA.maxLevel ? prev : xpForLevel(m.level + 1);
  const frac = next > prev ? Math.max(0, Math.min(1, (m.xp - prev) / (next - prev))) : 1;
  return { cur: m.xp, prev, next, frac };
}

function makeMember(genome, level, uid) {
  const m = { uid, genome, level, xp: xpForLevel(level), hp: 0, status: null, moves: movesAtLevel(learnsetOf(genome), level) };
  m.hp = memberMaxHp(m);
  return m;
}

/** Moves a member could pick up between two levels (exclusive of `from`, inclusive of `to`). */
function movesLearnedBetween(m, from, to) {
  const out = [];
  for (const [lvl, id] of learnsetOf(m.genome)) if (lvl > from && lvl <= to && getMove(id) && !m.moves.includes(id) && !out.includes(id)) out.push(id);
  return out;
}

/** Resolve a pending learn: replace the move at `replaceIndex`, or skip when it is null. */
function learnMove(run, uid, moveId, replaceIndex) {
  const m = [...run.party, ...run.box].find((x) => x.uid === uid);
  run.pendingLearns = (run.pendingLearns || []).filter((p) => !(p.uid === uid && p.moveId === moveId));
  if (!m || replaceIndex == null || !getMove(moveId)) return run;
  if (replaceIndex >= 0 && replaceIndex < m.moves.length) m.moves[replaceIndex] = moveId;
  else if (m.moves.length < 4) m.moves.push(moveId);
  return run;
}

function nextUid(run) { return `m${run.nextId++}`; }

function newRun(seed) {
  const rng = makeRng(`${seed}:starters`);
  const starters = [];
  const used = new Set();
  let guard = 0;
  while (starters.length < 3 && guard++ < 50) {
    const sp = rng.weighted(SPECIES.filter((s) => s.tier !== 'rare'), (s) => TIER_WEIGHT[s.tier]);
    if (used.has(sp.id)) continue;
    used.add(sp.id);
    starters.push(speciesGenome(sp, rng.fork(`s${starters.length}`)));
  }
  return {
    seed: String(seed), floor: 1, phase: 'starter', party: [], box: [], starters, altar: false, encounter: null,
    nextId: 1, stats: { battles: 0, captures: 0, fusions: 0, bosses: 0 }, lastReport: null, pendingLearns: [],
  };
}

function chooseStarter(run, index) {
  const g = run.starters[index];
  if (!g) throw new Error('No such starter.');
  run.party = [makeMember(g, ARENA.starterLevel, nextUid(run))];
  run.starters = null;
  run.phase = 'floor';
  run.encounter = encounterFor(run, run.floor);
  return run;
}

/** The biome of a floor: one per Warden stretch, cycling through the list. */
function biomeFor(floor) { return BIOMES[Math.floor((floor - 1) / ARENA.bossEvery) % BIOMES.length]; }

function tierWeight(s, floor) {
  if (s.tier === 'rare') return floor < ARENA.rareFrom ? 0 : Math.min(0.9, 0.15 + floor * 0.02);
  if (s.tier === 'uncommon') return floor < 3 ? 0 : Math.min(1, 0.5 + floor * 0.01);
  return 1;
}

/** A wild creature for a floor. Biome classes are four times as common; opts.clade forces a class. */
function wildGenome(rng, floor, opts = {}) {
  const biome = biomeFor(floor);
  let pool = opts.clade ? SPECIES.filter((s) => s.clade === opts.clade) : SPECIES;
  if (!pool.length) pool = SPECIES;
  let sp = rng.weighted(pool, (s) => tierWeight(s, floor) * (opts.clade || !biome.clades.includes(s.clade) ? 1 : 4));
  if (!sp) sp = rng.pick(pool);
  return speciesGenome(sp, rng.fork(`w${sp.id}`));
}

/** Wild creature, or on deeper floors sometimes a wild fusion of two same-class creatures. */
function wildOrFusion(rng, floor) {
  const fusionChance = floor >= ARENA.wildFusionFrom ? Math.min(0.35, (floor - ARENA.wildFusionFrom + 1) * 0.04) : 0;
  const a = wildGenome(rng.fork('a'), floor);
  if (!rng.chance(fusionChance)) return a;
