  document.body.append(toastEl);
  const mine = toastEl;
  setTimeout(() => { if (toastEl === mine) { mine.remove(); toastEl = null; } }, 1900);
}

// Colors are ours; each type also gets a one-letter glyph so type is never color-only.

// se = super effective (2x), nve = not very effective (0.5x), imm = immune (0x)
const RULES = {
  Normal:   { nve: ['Rock', 'Steel'], imm: ['Ghost'] },
  Fire:     { se: ['Grass', 'Ice', 'Bug', 'Steel'], nve: ['Fire', 'Water', 'Rock', 'Dragon'] },
  Water:    { se: ['Fire', 'Ground', 'Rock'], nve: ['Water', 'Grass', 'Dragon'] },
  Electric: { se: ['Water', 'Flying'], nve: ['Electric', 'Grass', 'Dragon'], imm: ['Ground'] },
  Grass:    { se: ['Water', 'Ground', 'Rock'], nve: ['Fire', 'Grass', 'Poison', 'Flying', 'Bug', 'Dragon', 'Steel'] },
  Ice:      { se: ['Grass', 'Ground', 'Flying', 'Dragon'], nve: ['Fire', 'Water', 'Ice', 'Steel'] },
  Fighting: { se: ['Normal', 'Ice', 'Rock', 'Dark', 'Steel'], nve: ['Poison', 'Flying', 'Psychic', 'Bug', 'Fairy'], imm: ['Ghost'] },
  Poison:   { se: ['Grass', 'Fairy'], nve: ['Poison', 'Ground', 'Rock', 'Ghost'], imm: ['Steel'] },
  Ground:   { se: ['Fire', 'Electric', 'Poison', 'Rock', 'Steel'], nve: ['Grass', 'Bug'], imm: ['Flying'] },
  Flying:   { se: ['Grass', 'Fighting', 'Bug'], nve: ['Electric', 'Rock', 'Steel'] },
  Psychic:  { se: ['Fighting', 'Poison'], nve: ['Psychic', 'Steel'], imm: ['Dark'] },
  Bug:      { se: ['Grass', 'Psychic', 'Dark'], nve: ['Fire', 'Fighting', 'Poison', 'Flying', 'Ghost', 'Steel', 'Fairy'] },
  Rock:     { se: ['Fire', 'Ice', 'Flying', 'Bug'], nve: ['Fighting', 'Ground', 'Steel'] },
  Ghost:    { se: ['Psychic', 'Ghost'], nve: ['Dark'], imm: ['Normal'] },
  Dragon:   { se: ['Dragon'], nve: ['Steel'], imm: ['Fairy'] },
  Dark:     { se: ['Psychic', 'Ghost'], nve: ['Fighting', 'Dark', 'Fairy'] },
  Steel:    { se: ['Ice', 'Rock', 'Fairy'], nve: ['Fire', 'Water', 'Electric', 'Steel'] },
  Fairy:    { se: ['Fighting', 'Dragon', 'Dark'], nve: ['Fire', 'Poison', 'Steel'] },
};

/** Multiplier for a single attacking type against a single defending type. */
function typeMultiplier(attacker, defender) {
  const r = RULES[attacker];
  if (!r) return 1;
  if (r.imm && r.imm.includes(defender)) return 0;
  if (r.se && r.se.includes(defender)) return 2;
  if (r.nve && r.nve.includes(defender)) return 0.5;
  return 1;
}

/** Multiplier against a creature with one or two types (second may be null). */
function typeEffectiveness(attacker, defenderTypes) {
  let m = 1;
  for (const t of defenderTypes) if (t) m *= typeMultiplier(attacker, t);
  return m;
}

function isType(t) { return TYPE_LIST.includes(t); }

// ---- src/core/util.js ----
// Small shared helpers. No game logic here.

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const clamp01 = (v) => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const round1 = (v) => Math.round(v * 10) / 10;
const round3 = (v) => Math.round(v * 1000) / 1000;
const sum = (arr) => arr.reduce((a, b) => a + b, 0);

/** Wrap a hue into [0,360). */
const wrapHue = (h) => ((h % 360) + 360) % 360;

/** Shortest signed distance from hue a to hue b, in (-180, 180]. */
function hueDelta(a, b) {
  let d = wrapHue(b) - wrapHue(a);
  if (d > 180) d -= 360;
  if (d <= -180) d += 360;
  return d;
}

/** Move hue h toward target by fraction t along the shortest arc. */
function mixHue(h, target, t) { return wrapHue(h + hueDelta(h, target) * t); }

const hsl = (h, s, l) => `hsl(${Math.round(wrapHue(h))} ${Math.round(clamp(s, 0, 100))}% ${Math.round(clamp(l, 0, 100))}%)`;

/** Normalize an object of positive weights so its values sum to 1. */
function normalizeWeights(obj) {
  const keys = Object.keys(obj);
  const total = sum(keys.map((k) => Math.max(0, obj[k])));
  const out = {};
  for (const k of keys) out[k] = total > 0 ? Math.max(0, obj[k]) / total : 1 / keys.length;
  return out;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

/** Format a number for SVG attributes: short, stable, never "-0". */
function num(v) {
  const r = Math.round(v * 100) / 100;
  return (Object.is(r, -0) ? 0 : r).toString();
}

let uidCounter = 0;
/** Unique id fragment for DOM/SVG ids within a page lifetime. */
function uid(prefix = 'u') { return `${prefix}${(++uidCounter).toString(36)}`; }

// base64url of UTF-8 text, works in browsers and Node.
function b64uEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  const b64 = typeof btoa === 'function' ? btoa(bin) : Buffer.from(bin, 'binary').toString('base64');
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64uDecode(s) {
  let b64 = s.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const bin = typeof atob === 'function' ? atob(b64) : Buffer.from(b64, 'base64').toString('binary');
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function deepFreeze(o) {
  if (o && typeof o === 'object' && !Object.isFrozen(o)) {
    Object.freeze(o);
    for (const k of Object.keys(o)) deepFreeze(o[k]);
  }
  return o;
}

function titleCase(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ---- src/creature/palette.js ----
// Palette genes -> CSS custom properties. Every part references abstract roles
// (p/s/a and their shades); the per-slot paint gene decides which of the
// creature's three colours each role maps to. That is how one part gets
// recoloured differently on different creatures.


const COLOR_KEYS = ['c1', 'c2', 'c3'];

/** Root CSS variables for a creature: the three colour families, eye colour, outline and whites. */
function paletteVars(pal) {
  const v = [];
  for (const k of COLOR_KEYS) {
    const [h, s, l] = pal[k];
    v.push(`--${k}:${hsl(h, s, l)}`, `--${k}d:${hsl(h, Math.min(100, s + 6), l - 14)}`, `--${k}l:${hsl(h, Math.max(0, s - 8), Math.min(96, l + 14))}`);
  }
  const [eh, es, el] = pal.eye;
  v.push(`--e:${hsl(eh, es, el)}`, `--ed:${hsl(eh, es, el - 16)}`);
  const [h1, s1] = pal.c1;
  const ol = hsl(h1, Math.min(s1, 45), 13);
  const hue = Math.round(wrapHue(h1));
  v.push(`--ol:${ol}`, `--k:${ol}`, `--w:hsl(${hue} 20% 97%)`, `--wd:hsl(${hue} 15% 80%)`);
  return v.join(';');
}

/** Per-slot role mapping. perm = indexes into [c1,c2,c3] for roles [p,s,a]. */
function slotPaintVars(perm) {
  const [p, s, a] = perm.map((i) => COLOR_KEYS[i]);
  return `--p:var(--${p});--pd:var(--${p}d);--pl:var(--${p}l);--s:var(--${s});--sd:var(--${s}d);--sl:var(--${s}l);--a:var(--${a});--ad:var(--${a}d);--al:var(--${a}l)`;
}

/** Applied to far-side copies (far legs, far wing, far eye): everything one shade darker. */
const FAR_VARS = '--p:var(--pd);--pl:var(--pd);--s:var(--sd);--sl:var(--sd);--a:var(--ad);--al:var(--ad);--w:var(--wd);--e:var(--ed)';

function jitterColor([h, s, l], vary, rng, sharedHue) {
  return [
    wrapHue(h + sharedHue + rng.gauss() * vary.h * 0.5),
    clamp(s + rng.gauss() * vary.s, 8, 100),
    clamp(l + rng.gauss() * vary.l, 12, 92),
  ].map((x) => Math.round(x * 10) / 10);
}

/** Genetic roll on a species palette: a shared hue drift plus small independent wobble per colour. */
function jitterPalette(base, vary, rng) {
  const v = { h: 10, s: 8, l: 6, ...(vary || {}) };
  const sharedHue = rng.gauss() * v.h;
  return {
    c1: jitterColor(base.c1, v, rng, sharedHue),
    c2: jitterColor(base.c2, v, rng, sharedHue),
    c3: jitterColor(base.c3, v, rng, sharedHue),
    eye: jitterColor(base.eye, v, rng, 0),
  };
}

/** Rare recolour: rotate the whole palette to a new harmony. */
function shinyPalette(pal, rng) {
  const rot = rng.range(140, 220);
  const out = {};
  for (const k of ['c1', 'c2', 'c3', 'eye']) {
    const [h, s, l] = pal[k];
    out[k] = [wrapHue(h + rot), clamp(s + 5, 8, 100), l].map((x) => Math.round(x * 10) / 10);
  }
  return out;
}

/** Blend two palettes colour by colour. t=0 -> a, t=1 -> b. Hues take the short way round. */
function blendColor(a, b, t) {
  let dh = wrapHue(b[0]) - wrapHue(a[0]);
  if (dh > 180) dh -= 360;
  if (dh < -180) dh += 360;
  return [wrapHue(a[0] + dh * t), a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t].map((x) => Math.round(x * 10) / 10);
}

function swatchCss([h, s, l]) { return hsl(h, s, l); }

const RIG_IDS = Object.keys(RIGS);

/** Rig used when a genome names none or an unknown one (old saves): the first class. */
const DEFAULT_RIG = 'mammal';

function getRig(id) { return RIGS[id] || RIGS[DEFAULT_RIG]; }
function slotsFor(rig) { return getRig(rig).slots; }
function paintSlotsFor(rig) { return getRig(rig).paint; }
function swappableSlotsFor(rig) { const r = getRig(rig); return r.swappable || r.paint; }
function slotName(rig, slot) { return getRig(rig).names[slot] || slot; }
function noneId(rig, slot) { return `${getRig(rig).prefix}${slot}.none`; }

/** Every placement node of a rig's draw tree, flattened (parents before children). */
function rigNodes(rig) {
  const out = [];
  const walk = (node) => {
    out.push(node);
    for (const c of node.behind || []) walk(c);
    for (const c of node.front || []) walk(c);
  };
  const r = getRig(rig);
  if (r.tree) walk(r.tree);
  return out;
}

// ---- src/data/parts/_dsl.js ----
// Drawing DSL for creature parts.
//
// Every part is authored facing RIGHT in a local coordinate system whose origin
// (0,0) is the point that attaches to the parent's socket. Units are the same as
// the 200x230 creature canvas at scale 1. y grows downward, as in SVG.
//
// Fill roles (resolved to CSS variables at render time, remapped per slot by paint genes):
//   p / pd / pl   primary colour, its shade, its highlight
//   s / sd / sl   secondary colour family
//   a / ad / al   accent colour family
//   w / wd        white and its shade         e / ed   eye colour and its shade
//   k             outline/dark                none     no fill (stroke only)
//
// Prim options: op (opacity), ns (no outline stroke), sw (outline stroke width
// override), cl (clip this prim to the part's own silhouette: the part's `clip`
// paths, or its first prim when it has none).

const P = (d, f = 'p', o = {}) => ({ t: 'path', d, f, ...o });
const E = (cx, cy, rx, ry, f = 'p', o = {}) => ({ t: 'ellipse', cx, cy, rx, ry, f, ...o });
const C = (cx, cy, r, f = 'p', o = {}) => ({ t: 'circle', cx, cy, r, f, ...o });
/** Stroke-only path. f is the stroke role, w the stroke width. */
const L = (d, f = 'k', w = 3, o = {}) => ({ t: 'line', d, f, w, ...o });

/** Shadow: translucent outline-colour wash, clipped to the part. Keeps its hue on any recolour. */
const SH = (d, op = 0.16, o = {}) => ({ t: 'path', d, f: 'k', ns: true, cl: true, op, ...o });
/** Highlight: translucent white, clipped to the part. */
const HL = (d, op = 0.22, o = {}) => ({ t: 'path', d, f: 'w', ns: true, cl: true, op, ...o });
/** A colour patch (belly, muzzle, socks) drawn without an outline and clipped to the part. */
const PATCH = (d, f = 's', o = {}) => ({ t: 'path', d, f, ns: true, cl: true, ...o });

/** Convenience for a "none" part in an optional slot. prefix namespaces the id per rig ("m." for mammals). */
const NONE = (slot, dom = 0.35, prefix = '') => ({ id: `${prefix}${slot}.none`, slot, name: 'None', none: true, dom, w: 1 });

// ---- curves -------------------------------------------------------------------

const fmt = (v) => {
  const r = Math.round(v * 100) / 100;
  return (Object.is(r, -0) ? 0 : r).toString();
};

/**
 * Smooth curve through points, as an SVG path string.
 * Each point is [x, y], [x, y, 'c'] for a sharp corner, or [x, y, k] where k
 * scales the roundness at that point (0 = corner, 1 = normal, 1.5 = fuller).
 * Catmull-Rom converted to cubic Beziers; opts.tension (default 0.5) sets the
 * overall roundness and opts.closed (default true) closes the loop.
 */
function spline(pts, opts = {}) {
  const closed = opts.closed !== false;
  const k = (opts.tension == null ? 0.5 : opts.tension) / 3;
  const n = pts.length;
  if (n < 2) return '';
  const at = (i) => {
    if (closed) return pts[((i % n) + n) % n];
    return pts[Math.max(0, Math.min(n - 1, i))];
  };
  const smooth = (p) => (p[2] === 'c' ? 0 : p[2] == null ? 1 : Number(p[2]));
  let d = `M${fmt(pts[0][0])},${fmt(pts[0][1])}`;
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const k1 = k * smooth(p1), k2 = k * smooth(p2);
    const c1x = p1[0] + (p2[0] - p0[0]) * k1, c1y = p1[1] + (p2[1] - p0[1]) * k1;
    const c2x = p2[0] - (p3[0] - p1[0]) * k2, c2y = p2[1] - (p3[1] - p1[1]) * k2;
    d += `C${fmt(c1x)},${fmt(c1y)} ${fmt(c2x)},${fmt(c2y)} ${fmt(p2[0])},${fmt(p2[1])}`;
  }
  return closed ? d + 'Z' : d;
}

/** Shorthand: a filled spline part primitive. */
const S = (pts, f = 'p', o = {}) => P(spline(pts, o.spline), f, stripSpline(o));
/** Stroke-only open spline. */
const SL = (pts, f = 'k', w = 2.5, o = {}) => L(spline(pts, { closed: false, ...(o.spline || {}) }), f, w, stripSpline(o));
function stripSpline(o) { const { spline: _s, ...rest } = o; return rest; }

// ---- point-list helpers -------------------------------------------------------

/** Points on an arc of an ellipse, from angle a0 to a1 (degrees, SVG orientation: 0 = right, 90 = down). */
function arcPts(cx, cy, rx, ry, a0, a1, n, smoothK) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = ((a0 + ((a1 - a0) * i) / n) * Math.PI) / 180;
    const p = [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry];
    if (smoothK != null) p.push(smoothK);
    out.push(p);
  }
  return out;
}

/**
 * A tufted (fur) edge from a to b. Returns points to splice into a spline list:
 * n tufts, each a sharp tip pushed `amp` units to the outside of a clockwise
 * silhouette (use a negative amp for the inside), ending on b. a itself is not
 * included. Options: lean (0..1, tips lean toward b like fur lying flat),
 * taper (amplitude multiplier at b relative to a), valley (roundness of the
 * bases, default 0.6), wobble (per-tuft amplitude variation, deterministic),
 * tip (roundness of the tips, default 0.2; 'c' for razor points).
 */
function fur(a, b, n, amp, o = {}) {
  const lean = o.lean == null ? 0.25 : o.lean, taper = o.taper == null ? 1 : o.taper;
  const valley = o.valley == null ? 0.6 : o.valley, wobble = o.wobble == null ? 0.15 : o.wobble;
  const tip = o.tip == null ? 0.2 : o.tip;
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len = Math.hypot(dx, dy) || 1;
  const nx = dy / len, ny = -dx / len;
  const out = [];
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 1) / n;
    const tt = t0 + (t1 - t0) * (0.5 + lean * 0.4);
    const w = 1 + wobble * Math.sin(i * 2.399 + 0.7) * (i % 2 ? 1 : -1);
    const A = amp * (1 + (taper - 1) * tt) * w;
    out.push([a[0] + dx * tt + nx * A, a[1] + dy * tt + ny * A, tip]);
    const bp = [a[0] + dx * t1, a[1] + dy * t1];
    if (i < n - 1) bp.push(valley);
    out.push(bp);
  }
  return out;
}

/** Translate, scale and rotate a point list about the origin (scale then rotate then move). Keeps corner flags. */
function xfPts(pts, { x = 0, y = 0, sx = 1, sy, a = 0 } = {}) {
  const syy = sy == null ? sx : sy;
  const r = (a * Math.PI) / 180, c = Math.cos(r), s = Math.sin(r);
  return pts.map((p) => {
    const px = p[0] * sx, py = p[1] * syy;
    const q = [px * c - py * s + x, px * s + py * c + y];
    if (p.length > 2) q.push(p[2]);
    return q;
  });
}

/** Mirror a point list across x = 0 (for symmetric halves); reverses order so the winding stays consistent. */
function mirrorPts(pts) {
  return pts.map((p) => (p.length > 2 ? [-p[0], p[1], p[2]] : [-p[0], p[1]])).reverse();
}

/** A closed lens / leaf between a and b with belly `bulge` (positive = to the outside of clockwise travel). */
function leaf(a, b, bulge, tipK = 'c') {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len = Math.hypot(dx, dy) || 1;
  const nx = dy / len, ny = -dx / len;
  return spline([[a[0], a[1], tipK], [mx + nx * bulge, my + ny * bulge], [b[0], b[1], tipK], [mx - nx * bulge, my - ny * bulge]]);
}

/**
 * Closed outline around a centreline (for tails, horns, thin limbs): width w0 at
 * the start tapering to w1 at the end, with a rounded end cap. Returns a point
 * list for spline(). The start is left open-ended (it usually sits inside the parent).
 * o.tipK sets the tip roundness (default 1), o.bulge scales the width mid-way (1 = linear).
 */
function tube(centre, w0, w1, o = {}) {
  const n = centre.length;
  const left = [], right = [];
  const bulge = o.bulge == null ? 1 : o.bulge;
  for (let i = 0; i < n; i++) {
    const p = centre[i], prev = centre[Math.max(0, i - 1)], next = centre[Math.min(n - 1, i + 1)];
    const dx = next[0] - prev[0], dy = next[1] - prev[1];
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const t = n > 1 ? i / (n - 1) : 0;
    const w = ((w0 + (w1 - w0) * t) * (1 + (bulge - 1) * Math.sin(t * Math.PI))) / 2;
    left.push([p[0] + nx * w, p[1] + ny * w]);
    right.push([p[0] - nx * w, p[1] - ny * w]);
  }
  const end = centre[n - 1], pe = centre[Math.max(0, n - 2)];
  const dx = end[0] - pe[0], dy = end[1] - pe[1];
  const len = Math.hypot(dx, dy) || 1;
  const cap = [end[0] + (dx / len) * (w1 / 2), end[1] + (dy / len) * (w1 / 2), o.tipK == null ? 1 : o.tipK];
  return [...left, cap, ...right.reverse()];
}

/** Points of a fluffy ball: n tufts around (cx, cy) with radius r and tuft depth amp. */
function puff(cx, cy, r, n, amp, o = {}) {
  const out = [];
  const rot = o.rot || 0;
  for (let i = 0; i < n; i++) {
    const a0 = ((i / n) * 360 + rot) * (Math.PI / 180), a1 = (((i + 0.5) / n) * 360 + rot) * (Math.PI / 180);
    out.push([cx + Math.cos(a0) * (r + amp), cy + Math.sin(a0) * (r + amp), o.tip == null ? 0.5 : o.tip]);
    out.push([cx + Math.cos(a1) * r, cy + Math.sin(a1) * r, 0.7]);
  }
  return out;
}

// ---- src/data/parts/_builders.js ----
// Part builders shared by the class libraries. partBuilders(prefix) returns
// body / leg / part constructors that namespace ids with the rig's prefix
// ("m." mammals, "r." reptiles) and derive clip paths from the silhouettes.


const shapeToPath = (s) => (typeof s === 'string' ? s : Array.isArray(s) ? spline(s) : s.d || spline(s.pts));
const shapeRole = (s) => (s && !Array.isArray(s) && typeof s === 'object' && s.f) || 'p';

function partBuilders(prefix) {
  /** A torso: silhouette shapes (point lists, paths or {pts|d, f}), clip and box derived, shading layered on. */
  const body = ({ id, name, kind, pts, shapes, sockets, dom = 0.5, w = 2, tags = [], shade = [], extra = [], hover, bottom }) => {
    const list = shapes || [pts];
    const clip = list.map(shapeToPath);
    const prims = [...list.map((s, i) => P(clip[i], shapeRole(s))), ...shade, ...extra];
    const part = { id: `${prefix}body.${id}`, slot: 'body', name, kind, tags, dom, w, clip, prims, sockets };
    if (hover) part.hover = hover;
    if (bottom != null) part.bottom = bottom;
    return part;
  };

  /** A leg: clip = union of its shapes so socks and shading stay inside the silhouette. */
  const leg = ({ id, slot, name, shapes, extra = [], dom = 0.5, w = 2, tags = [], fit }) => {
    const clip = shapes.map(shapeToPath);
    const part = { id: `${prefix}${slot}.${id}`, slot, name, tags, dom, w, clip, prims: [...shapes.map((s, i) => P(clip[i], shapeRole(s))), ...extra] };
    if (fit) part.fit = fit;
    return part;
  };

  /** Generic part: silhouette shapes first (they form the clip), then details. */
  const part = ({ id, slot, name, shapes = [], extra = [], dom = 0.5, w = 2, tags = [], sockets, fit, fitBox, hover }) => {
    const clip = shapes.map(shapeToPath);
    const out = { id: `${prefix}${slot}.${id}`, slot, name, tags, dom, w, prims: [...shapes.map((s, i) => P(clip[i], shapeRole(s))), ...extra] };
    if (clip.length) out.clip = clip;
    if (sockets) out.sockets = sockets;
    if (fit) out.fit = fit;
    if (fitBox != null) out.fitBox = fitBox;
    if (hover) out.hover = hover;
    return out;
  };

  return { body, leg, part };
}

/** Standard belly shadow and back highlight for a torso spanning x0..x1 with spine at ySpine and belly line at yBelly. */
function torsoShade(x0, x1, ySpine, yBelly, o = {}) {
  const midY = yBelly - (yBelly - ySpine) * (o.shadeFrac == null ? 0.42 : o.shadeFrac);
  const shade = SH(`M${x0 - 10},${midY} C${x0 + (x1 - x0) * 0.3},${midY + 8} ${x0 + (x1 - x0) * 0.7},${midY + 8} ${x1 + 10},${midY - 4} L${x1 + 10},${yBelly + 20} L${x0 - 10},${yBelly + 20} Z`, o.shade == null ? 0.14 : o.shade);
  const hy = ySpine + (yBelly - ySpine) * 0.18;
  const light = HL(`M${x0 + 6},${ySpine - 10} C${x0 + (x1 - x0) * 0.3},${ySpine - 12} ${x1 - 20},${ySpine - 12} ${x1 - 4},${ySpine - 4} L${x1 - 8},${hy} C${x1 - 24},${hy - 6} ${x0 + (x1 - x0) * 0.3},${hy - 4} ${x0 + 6},${hy + 2} Z`, o.light == null ? 0.16 : o.light);
  return [shade, light];
}

/** Toe lines on a paw: n short dark ticks across x0..x1 at y, pointing down. */
function toes(x0, x1, y, n = 2, len = 3, op = 0.55) {
  let d = '';
  for (let i = 1; i <= n; i++) { const x = x0 + ((x1 - x0) * i) / (n + 1); d += `M${x},${y - len} L${x},${y} `; }
  return { t: 'line', d: d.trim(), f: 'k', w: 1.6, op };
}

/** Claws: n small pale triangles along the front of a foot from x0..x1 at y, pointing down-right. */
function claws(x0, x1, y, n = 3, len = 4, f = 'w') {
  const out = [];
  for (let i = 0; i < n; i++) {
    const x = x0 + ((x1 - x0) * i) / Math.max(1, n - 1);
    out.push({ t: 'path', d: `M${x - 2},${y - 1} L${x + 1.5},${y + len} L${x + 3.5},${y - 1} Z`, f, sw: 1.2 });
  }
  return out;
}

/** A dark "sock" from y down over the leg, clipped to the leg silhouette. */
function sock(y, role = 'a', x0 = -30, x1 = 30, curve = 3) {
  return PATCH(`M${x0},${y + curve} Q0,${y - curve} ${x1},${y + curve} L${x1},${y + 60} L${x0},${y + 60} Z`, role);
}

// ---- src/data/parts/mammal/eyes.js ----
// Mammal eyes. Origin = eye centre, near-eye size; the far eye is a scaled copy.
// Sclera first (it is the clip for the iris and pupil), then iris, pupil, highlights, lid.



/** Eye builder: shape = sclera path, iris/pupil positions and sizes, lid = upper lid line path or null. */
function eye({ id, name, shape, iris = [0.8, 0.2, 3.8], pupil = [1.2, 0.5, 2], glint = [2.2, -1.8, 1.3], glint2 = [-1, 1.8, 0.7], lid, lidFill, lash, dom = 0.5, w = 2, tags = [] }) {
  const prims = [P(shape, 'w', { sw: 2 })];
  prims.push(C(iris[0], iris[1], iris[2], 'e', { ns: true, cl: true }));
  prims.push(C(iris[0] + 0.5, iris[1] + 1, iris[2] * 0.72, 'ed', { ns: true, cl: true, op: 0.55 }));
  if (pupil) prims.push(Array.isArray(pupil[2]) ? E(pupil[0], pupil[1], pupil[2][0], pupil[2][1], 'k', { ns: true, cl: true }) : C(pupil[0], pupil[1], pupil[2], 'k', { ns: true, cl: true }));
  if (glint) prims.push(C(glint[0], glint[1], glint[2], 'w', { ns: true }));
  if (glint2) prims.push(C(glint2[0], glint2[1], glint2[2], 'w', { ns: true, op: 0.7 }));
  if (lidFill) prims.push(P(lidFill, 'p', { ns: true, cl: true }));
  if (lid) prims.push(L(lid, 'k', 1.8));
  if (lash) prims.push(L(lash, 'k', 1.5));
  return mPart({ id, slot: 'eyes', name, tags, dom, w, extra: prims });
}

// Reptile eyes. Origin = eye centre. Many are coloured all over with a slit pupil.



function rEye({ id, name, shape, sclera = 'w', iris = [0.8, 0.2, 3.8], irisRole = 'e', pupil = [1.2, 0.5, 2], pupilPath, glint = [2.2, -1.8, 1.3], glint2 = [-1, 1.8, 0.7], lid, lidFill, before = [], dom = 0.5, w = 2, tags = [] }) {
  const prims = [...before];
  if (shape) prims.push(P(shape, sclera, { sw: 2 }));
  if (iris) {
    prims.push(C(iris[0], iris[1], iris[2], irisRole, { ns: true, cl: Boolean(shape) }));
    prims.push(C(iris[0] + 0.5, iris[1] + 1, iris[2] * 0.72, 'ed', { ns: true, cl: Boolean(shape), op: 0.5 }));
  }
  if (pupilPath) prims.push(P(pupilPath, 'k', { ns: true, cl: Boolean(shape) }));
  else if (pupil) prims.push(Array.isArray(pupil[2]) ? E(pupil[0], pupil[1], pupil[2][0], pupil[2][1], 'k', { ns: true, cl: Boolean(shape) }) : C(pupil[0], pupil[1], pupil[2], 'k', { ns: true, cl: Boolean(shape) }));
  if (glint) prims.push(C(glint[0], glint[1], glint[2], 'w', { ns: true }));
  if (glint2) prims.push(C(glint2[0], glint2[1], glint2[2], 'w', { ns: true, op: 0.7 }));
  if (lidFill) prims.push(P(lidFill, 'p', { ns: true, cl: Boolean(shape) }));
  if (lid) prims.push(L(lid, 'k', 1.8));
  return rPart({ id, slot: 'eyes', name, tags, dom, w, extra: prims });
}

// ---- src/data/parts/fish/eyes.js ----
// Fish eyes. Origin = eye centre.



function fEye({ id, name, shape, sclera = 'w', iris = [0.8, 0.2, 3.8], irisRole = 'e', pupil = [1.2, 0.5, 2], glint = [2.2, -1.8, 1.3], glint2 = [-1, 1.8, 0.7], lid, lidFill, ring, dom = 0.5, w = 2, tags = [] }) {
  const prims = [];
  if (ring) prims.push(C(0, 0, ring[0], ring[1], { ns: true, op: ring[2] }));
  prims.push(P(shape, sclera, { sw: 2 }));
  if (iris) {
    prims.push(C(iris[0], iris[1], iris[2], irisRole, { ns: true, cl: true }));
    prims.push(C(iris[0] + 0.5, iris[1] + 1, iris[2] * 0.72, 'ed', { ns: true, cl: true, op: 0.5 }));
  }
  if (pupil) prims.push(Array.isArray(pupil[2]) ? E(pupil[0], pupil[1], pupil[2][0], pupil[2][1], 'k', { ns: true, cl: true }) : C(pupil[0], pupil[1], pupil[2], 'k', { ns: true, cl: true }));
  if (glint) prims.push(C(glint[0], glint[1], glint[2], 'w', { ns: true }));
  if (glint2) prims.push(C(glint2[0], glint2[1], glint2[2], 'w', { ns: true, op: 0.7 }));
  if (lidFill) prims.push(P(lidFill, 'p', { ns: true, cl: true }));
  if (lid) prims.push(L(lid, 'k', 1.8));
  return fPart({ id, slot: 'eyes', name, tags, dom, w, extra: prims });
}

/** A ring of spikes around the 100 x 60 body frame: n spikes reaching `out` beyond the ellipse. */
function spikeRing(n, out, inset = 0.92, tip = 'c', rot = 0, half = false) {
  const pts = [];
  const count = half ? Math.ceil(n / 2) + 1 : n;
  for (let i = 0; i < count; i++) {
    const a0 = ((i / n) * 360 + rot + (half ? 180 : 0)) * (Math.PI / 180), a1 = (((i + 0.5) / n) * 360 + rot + (half ? 180 : 0)) * (Math.PI / 180);
    pts.push([Math.cos(a0) * 50 * out, Math.sin(a0) * 30 * out, tip]);
    pts.push([Math.cos(a1) * 50 * inset, Math.sin(a1) * 30 * inset, 0.6]);
  }
  if (half) pts.push([50 * inset, 8], [-50 * inset, 8]);
  return pts;
}

// ---- src/data/parts/bird/face.js ----
// Bird eyes, beaks, crests and face markings. Eye origin = eye centre; beak origin = its base on the
// head's beak socket (beaks point right); crest origin = crown (drawn behind the head); face origin = the
// centre of the face (drawn on the head under the eyes).



function bEye({ id, name, shape, sclera = 'w', iris = [0.8, 0.2, 3.8], irisRole = 'e', pupil = [1.2, 0.5, 2], glint = [2.2, -1.8, 1.3], glint2 = [-1, 1.8, 0.7], lid, lidFill, ring, dom = 0.5, w = 2, tags = [] }) {
  const prims = [];
  if (ring) prims.push(C(0, 0, ring[0], ring[1], { ns: true, op: ring[2] }));
  prims.push(P(shape, sclera, { sw: 2 }));
  if (iris) {
    prims.push(C(iris[0], iris[1], iris[2], irisRole, { ns: true, cl: true }));
    prims.push(C(iris[0] + 0.5, iris[1] + 1, iris[2] * 0.72, 'ed', { ns: true, cl: true, op: 0.5 }));
  }
  if (pupil) prims.push(C(pupil[0], pupil[1], pupil[2], 'k', { ns: true, cl: true }));
  if (glint) prims.push(C(glint[0], glint[1], glint[2], 'w', { ns: true }));

  if (lidFill) prims.push(P(lidFill, 'p', { ns: true, cl: true }));
  if (lid) prims.push(L(lid, 'k', 1.8));

}

}

// Insect builders: the shared constructors namespaced with "i.".
// Insects are small and low: a body is 60 to 90 wide and 30 tall, the head about 24 across,
// legs jointed sticks about 26 long. Three leg pairs hang from the thorax and abdomen.



const insectBuilders = partBuilders('i.');

/** An outlined stick: a dark wide stroke under a coloured narrower one. */
function stick(d, w = 3, role = 'p') {
  return [L(d, 'k', w + 2.6), L(d, role, w)];
}

function iEye({ id, name, shape, sclera = 'e', iris, pupil, glint = [2.2, -1.8, 1.3], glint2 = [-1, 1.8, 0.7], facets, lid, dom = 0.5, w = 2, tags = [] }) {

  if (iris) { prims.push(C(iris[0], iris[1], iris[2], 'el', { ns: true, cl: true, op: 0.6 })); }
  if (pupil) prims.push(Array.isArray(pupil[2]) ? E(pupil[0], pupil[1], pupil[2][0], pupil[2][1], 'k', { ns: true, cl: true }) : C(pupil[0], pupil[1], pupil[2], 'k', { ns: true, cl: true }));
  if (facets) prims.push(L(facets, 'k', 0.9, { op: 0.3, cl: true }));
  if (glint) prims.push(C(glint[0], glint[1], glint[2], 'w', { ns: true }));
  if (glint2) prims.push(C(glint2[0], glint2[1], glint2[2], 'w', { ns: true, op: 0.7 }));
  if (lid) prims.push(L(lid, 'k', 1.8));
  return iPart({ id, slot: 'eyes', name, tags, dom, w, extra: prims });
}

/**
 * A jointed leg: coxa at the origin, femur to the knee, tibia to the foot, tarsus to the tip.
 * dir = 1 for front legs (reaching forward), 0 middle, -1 hind (reaching back). Styles change the
 * proportions and add spines or hairs.
 */
function insectLeg(slot, style, dir) {
  const S_ = {
    thin: { knee: [8, -10], foot: [10, 16], tip: [8, 2], w: 2 },
    spiny: { knee: [9, -12], foot: [10, 16], tip: [8, 2], w: 2.2, spines: true },
    sturdy: { knee: [8, -8], foot: [8, 16], tip: [8, 2], w: 3 },
    hairy: { knee: [8, -10], foot: [9, 16], tip: [7, 2], w: 2.3, hairs: true },
    hooked: { knee: [8, -10], foot: [9, 16], tip: [4, 4], w: 2.2, hook: true },
    long: { knee: [12, -18], foot: [12, 24], tip: [8, 2], w: 1.9 },
    raptorial: null, jumping: null, stubby: { knee: [5, -5], foot: [5, 10], tip: [6, 2], w: 3 },
  }[style];
  const name = { thin: 'Thin', spiny: 'Spiny', sturdy: 'Sturdy', hairy: 'Hairy', hooked: 'Hooked', long: 'Long', raptorial: 'Raptorial', jumping: 'Jumping', stubby: 'Stubby' }[style];
  if (style === 'raptorial') {
    // praying arm: upper arm forward-up, forearm folded back down with a spiked edge
    const d = 'M0,0 L14,-14 L22,-2';
    return iPart({ id: style, slot, name, tags: ['mantis'], dom: 0.55, w: 1, extra: [...stick(d, 3.4), P('M14,-14 L18,-8 L22,-2 L20,-2 L16,-6 L13,-12 Z', 'pd', { sw: 1 }), L('M15,-10 L18,-9 M17,-6 L20,-5', 'k', 1.2, { op: 0.5 }), P('M22,-2 L25,3 L21,1 Z', 'w', { sw: 1 })] });
  }
  if (style === 'jumping') {
    const d = 'M0,0 L-10,-16 L-4,14 L4,16';
    return iPart({ id: style, slot, name, tags: ['grasshopper'], dom: 0.55, w: 1, extra: [S([[-2, -4], [-8, -14], [-12, -16], [-14, -8], [-8, 2], [-2, 4]], 'p', { sw: 2 }), ...stick(d, 2.6), L('M-6,4 L-8,6 M-5,8 L-7,10', 'k', 1.2, { op: 0.5 })] });
  }
  const f = (v) => v * dir;
  const kx = dir === 0 ? -2 : f(S_.knee[0]), ky = S_.knee[1];
  const fx = kx + (dir === 0 ? 2 : f(S_.foot[0]) * 0.5), fy = S_.foot[1];
  const tx = fx + S_.tip[0], ty = fy + S_.tip[1];
  const d = `M0,0 L${kx},${ky} L${fx},${fy} L${tx},${ty}`;

/** Several jointed legs on one side, from x offsets. Each leg: hip at (x,0), knee, foot. */
function legSet(id, name, legs, w, tags, extra = []) {
  const prims = [];
  for (const [x, kx, ky, fx, fy] of legs) prims.push(...tendril(`M${x},0 L${x + kx},${ky} L${x + fx},${fy}`, w));
  return vPart({ id, slot: 'legs', name, tags, dom: 0.5, w: 2, extra: [...prims, ...extra] });
}

/** Hanging strokes under the body: n tendrils across the width with a wave. */
function hang(n, len, spread, w, wave = 6) {
  let d = '';
  for (let i = 0; i < n; i++) {
    const x = -spread / 2 + (spread * i) / Math.max(1, n - 1);
    const s = i % 2 ? 1 : -1;
    d += `M${x},0 C${x + wave * s},${len * 0.35} ${x - wave * s},${len * 0.7} ${x + wave * s * 0.5},${len} `;
  }
  return [L(d.trim(), 'k', w + 2.6), L(d.trim(), 'p', w)];
}

// ---- src/data/parts/index.js ----
// Part registry. Part ids are stable forever: a saved creature must decode the
// same way after the library grows, so never rename or reuse an id.
//
// Parts are grouped by rig, then slot. A part fits any body of its own rig
// unless it lists the body kinds it accepts in `fit`.









const RIG_PARTS = {
  mammal: MAMMAL_PARTS,
  reptile: REPTILE_PARTS,
  fish: FISH_PARTS,
  bird: BIRD_PARTS,
  insect: INSECT_PARTS,
  invertebrate: INVERTEBRATE_PARTS,
  amphibian: AMPHIBIAN_PARTS,
};

const PARTS = new Map();
for (const rig of Object.keys(RIG_PARTS)) {
  if (!RIGS[rig]) throw new Error(`parts listed for unknown rig ${rig}`);
  for (const slot of slotsFor(rig)) {
    const list = RIG_PARTS[rig][slot];
    if (!Array.isArray(list)) throw new Error(`rig ${rig} has no parts for slot ${slot}`);
    for (const part of list) {
      if (PARTS.has(part.id)) throw new Error(`duplicate part id ${part.id}`);
      if (part.slot !== slot) throw new Error(`part ${part.id} listed under slot ${slot} but declares ${part.slot}`);
      part.rig = rig;
      PARTS.set(part.id, part);
    }
  }
}

function getPart(id) { return PARTS.get(id) || null; }

/** Does this part fit on a body of the given kind? Parts without a fit list fit every body in their rig. */
function partFits(part, bodyKind) {
  return !part || part.none || !part.fit || part.fit.includes(bodyKind);
}

/** All parts of a rig's slot. */
function partsOf(rig, slot) {
  const r = RIG_PARTS[rig];
  return (r && r[slot]) || [];
}

/** Parts of a rig's slot that fit the given body kind (includes the slot's "none" entry when it has one). */
function partsFor(rig, slot, bodyKind) {
  return partsOf(rig, slot).filter((p) => partFits(p, bodyKind));
}

function partCount() { return PARTS.size; }

// ---- src/creature/naming.js ----
// Names. Species carry hand-picked [prefix, suffix] halves; a fusion takes the
// prefix of the parent that gives its face and the suffix of the other one.

const VOWELS = 'aeiouy';

/** Join two name halves at a clean boundary. "Gla"+"ox" -> "Glox", "Puff"+"fin" -> "Puffin". */
function joinNameParts(prefix, suffix) {
  let p = String(prefix || '').trim(), s = String(suffix || '').trim();
  if (!p) return capitalize(s || 'Fusion');
  if (!s) return capitalize(p);
  const pl = p[p.length - 1].toLowerCase(), s0 = s[0].toLowerCase();
  if (pl === s0) p = p.slice(0, -1);
  else if (VOWELS.includes(pl) && VOWELS.includes(s0)) p = p.slice(0, -1);
  return capitalize((p + s).slice(0, 20));
}

/** Fallback split for names without authored halves: after the first vowel cluster and the consonants that follow it. */
function splitName(name) {
  const n = String(name || 'Fusion');
  const m = n.match(/^([^aeiouy]*[aeiouy]+[^aeiouy]+)(.+)$/i);
  if (m && m[2].length >= 2 && m[1].length >= 2) return [m[1], m[2].toLowerCase()];
  const cut = Math.ceil(n.length / 2);
  return [n.slice(0, cut), n.slice(cut).toLowerCase()];
}

function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

// cat: 'phys' | 'spec' | 'status'. acc: percent, or null for moves that never miss.
// fx entries (p = percent chance, default 100):
//   { k:'status', s:'brn'|'psn'|'par'|'slp'|'frz', p }      inflict a major status on the target
//   { k:'stat', who:'self'|'foe', stats:{atk:1,...}, p }      stage changes
//   { k:'flinch', p }                                         target flinches if it has not moved yet
//   { k:'drain', r }  { k:'recoil', r }  { k:'heal', r }      fractions of damage dealt / max HP

// The genome is the single source of truth for a creature. It is a plain JSON
// object with a fixed shape, so fusing two genomes always yields another valid
// genome and any creature can be shared as a code string.
//
// Diploid part genes: every slot holds [expressed, carried]. Only the expressed
// allele is drawn; the carried one can resurface in offspring.











const GENOME_VERSION = 1;
const CODE_PREFIX = 'CC1.';

const PAINT_PERMS = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];

/** Odds used when rolling a wild creature from its species. */
const ROLL = {
  carriedMutation: 0.1,   // hidden allele replaced by a random part
  expressedMutation: 0.03, // visible variant
  bodyCarriedMutation: 0.05,
  paintSwap: 0.12,        // a slot's colour roles get permuted
  shiny: 1 / 64,
};

function allelesFromRecipe(entry, slot, rig) {
  if (Array.isArray(entry)) return [entry[0], entry[1] ?? entry[0]];
  if (typeof entry === 'string') return [entry, entry];
  return [noneId(rig, slot), noneId(rig, slot)];
}

/** Random part id for a rig slot that fits the body kind, weighted by part rarity. Null when nothing fits. */
function randomPartId(rig, slot, bodyKind, rng) {
  const pool = partsFor(rig, slot, bodyKind);
  if (!pool.length) return null;
  return rng.weighted(pool, (p) => p.w ?? 1).id;
}

/** The rig a genome is built on (the default rig when unset or unknown, so old codes still decode to something). */
function rigOf(g) { return g && g.rig && RIGS[g.rig] ? g.rig : DEFAULT_RIG; }
/** The rig a species is built on. */
function speciesRig(species) { return species && species.rig && RIGS[species.rig] ? species.rig : DEFAULT_RIG; }

function defaultTraits() {
  const t = {};
  for (const k of TRAIT_KEYS) t[k] = 0.5;
  return t;
}

/** Roll a wild creature of a species. Deterministic for a given rng seed. */
function speciesGenome(species, rng) {
  const rParts = rng.fork('parts');
  const rPaint = rng.fork('paint');
  const rPal = rng.fork('palette');
  const rTraits = rng.fork('traits');
  const rStats = rng.fork('stats');
  const rAbility = rng.fork('ability');

  const rig = speciesRig(species);
  const parts = {};
  const bodyAlleles = allelesFromRecipe(species.recipe.body, 'body', rig);
  if (rParts.chance(ROLL.bodyCarriedMutation)) bodyAlleles[1] = randomPartId(rig, 'body', getPart(bodyAlleles[0]).kind, rParts) || bodyAlleles[1];
  parts.body = bodyAlleles;
  const bodyKind = getPart(bodyAlleles[0]).kind;
  for (const slot of slotsFor(rig)) {
    if (slot === 'body') continue;
    const a = allelesFromRecipe(species.recipe[slot], slot, rig);
    if (rParts.chance(ROLL.carriedMutation)) a[1] = randomPartId(rig, slot, bodyKind, rParts) || a[1];
    if (rParts.chance(ROLL.expressedMutation)) a[0] = randomPartId(rig, slot, bodyKind, rParts) || a[0];
    parts[slot] = a;
  }

  const paint = {};
  const swappable = swappableSlotsFor(rig);
  for (const slot of paintSlotsFor(rig)) {
    let idx = (species.paint && species.paint[slot]) || 0;
    if (swappable.includes(slot) && rPaint.chance(ROLL.paintSwap)) idx = rPaint.int(PAINT_PERMS.length);
    paint[slot] = idx;
  }

  let palette = jitterPalette(species.palette, species.vary, rPal);
  const shiny = rPal.chance(ROLL.shiny);
  if (shiny) palette = shinyPalette(palette, rPal);

  const traits = {};
  for (const k of TRAIT_KEYS) {
    const [lo, hi] = (species.traits && species.traits[k]) || [0.35, 0.65];
    traits[k] = round3(rTraits.range(lo, hi));
  }

  const vigor = {};
  for (const k of STAT_KEYS) vigor[k] = round3(rStats.next());

  return {
    v: GENOME_VERSION,
    seed: rng.seed,
    species: species.id,
    clade: species.clade,
    rig,
    name: species.name,
    nameParts: species.nameParts ? species.nameParts.slice() : splitName(species.name),
    gen: 0,
    shiny,
    types: [species.types[0], species.types[1] || null],
    parts,
    paint,
    palette,
    traits,
    stats: { ...species.stats },
    vigor,
    bst: species.bst,
    lineage: [species.id],
    learnset: (species.learnset || UNIVERSAL_LEARNSET).map((e) => e.slice()),
    ability: rAbility.pick(species.abilities || ['lucky_streak']),
  };
}

/** The learnset a genome battles with: its own, else its species', else the universal fallback. */
function learnsetOf(g) {
  if (Array.isArray(g.learnset) && g.learnset.length) return g.learnset;
  const sp = g.species && SPECIES_BY_ID[g.species];
  return sp && sp.learnset ? sp.learnset : UNIVERSAL_LEARNSET;
}

/** A random wild creature: species weighted by rarity tier, then rolled. opts.clade restricts the class. */
function randomGenome(rng, opts = {}) {
  const pool = opts.clade ? WILD_SPECIES.filter((s) => s.clade === opts.clade) : WILD_SPECIES;
  const species = rng.fork('species').weighted(pool.length ? pool : WILD_SPECIES, (s) => TIER_WEIGHT[s.tier] || 1);
  return speciesGenome(species, rng);
}

/** The class a genome belongs to, inferred from its species or lineage for older genomes. */
function cladeOf(g) {
  if (g.clade && CLADES[g.clade]) return g.clade;
  const sp = (g.species && SPECIES_BY_ID[g.species]) || (g.lineage && SPECIES_BY_ID[g.lineage[0]]);
  return sp ? sp.clade : 'mammal';
}

function speciesOf(g) { return SPECIES_BY_ID[g.species] || null; }

/**
 * Expressed part per slot after compatibility checks. If the expressed allele
 * does not fit the body, the carried one is tried, then nothing.
 */
function resolveParts(g) {
  const out = {};
  const rig = rigOf(g);
  const body = getPart(g.parts.body[0]) || getPart(g.parts.body[1]) || partsOf(rig, 'body')[0];
  out.body = body;
  for (const slot of slotsFor(rig)) {
    if (slot === 'body') continue;
    const [e, c] = g.parts[slot] || [];
    let part = getPart(e);
    if (!part || !partFits(part, body.kind)) {
      const alt = getPart(c);
      part = alt && partFits(alt, body.kind) ? alt : null;
    }
    out[slot] = part && !part.none ? part : null;
  }
  return out;
}

/** Species-level base stats: the fixed budget split by the creature's stat weights. */
function baseStats(g) {
  const w = normalizeWeights(g.stats);
  const out = {};
  for (const k of STAT_KEYS) out[k] = Math.max(20, Math.round((g.bst || 400) * w[k]));
  return out;
}

function typeLabel(g) { return g.types.filter(Boolean).join(' / '); }

function encodeGenome(g) { return CODE_PREFIX + b64uEncode(JSON.stringify(g)); }

function decodeGenome(code) {
  const s = String(code || '').trim();
  if (!s.startsWith(CODE_PREFIX)) throw new Error('That is not a creature code.');
  let g;
  try { g = JSON.parse(b64uDecode(s.slice(CODE_PREFIX.length))); } catch { throw new Error('That creature code is damaged.'); }
  return validateGenome(g);
}

/** Throws on structural problems; fills harmless gaps with defaults. Returns the genome. */
function validateGenome(g) {
  if (!g || typeof g !== 'object') throw new Error('Not a creature.');
  if (g.v !== GENOME_VERSION) throw new Error(`Unsupported creature version ${g.v}.`);
  if (!g.parts || typeof g.parts !== 'object') throw new Error('Creature has no parts.');
  g.rig = rigOf(g);
  for (const slot of slotsFor(g.rig)) {
    const a = g.parts[slot];
    if (!Array.isArray(a) || a.length !== 2 || !a.every((x) => typeof x === 'string')) throw new Error(`Bad ${slot} genes.`);
  }
  const bodyPart = getPart(g.parts.body[0]) || getPart(g.parts.body[1]);
  if (!bodyPart) throw new Error('Unknown body part.');
  if (bodyPart.rig !== g.rig) throw new Error('Creature parts do not match its skeleton.');
  for (const k of ['c1', 'c2', 'c3', 'eye']) {
    const c = g.palette && g.palette[k];
    if (!Array.isArray(c) || c.length !== 3 || !c.every(Number.isFinite)) throw new Error('Bad palette.');
  }
  if (!Array.isArray(g.types) || !isType(g.types[0]) || (g.types[1] != null && !isType(g.types[1]))) throw new Error('Bad types.');
  g.types = [g.types[0], g.types[1] || null];
  g.traits = { ...defaultTraits(), ...(g.traits || {}) };
  for (const k of TRAIT_KEYS) g.traits[k] = clamp01(Number(g.traits[k]) || 0.5);
  g.paint = g.paint && typeof g.paint === 'object' ? g.paint : {};
  for (const slot of paintSlotsFor(g.rig)) g.paint[slot] = PAINT_PERMS[g.paint[slot]] ? g.paint[slot] : 0;
  if (!g.stats || typeof g.stats !== 'object') g.stats = Object.fromEntries(STAT_KEYS.map((k) => [k, 1]));
  if (!g.vigor || typeof g.vigor !== 'object') g.vigor = Object.fromEntries(STAT_KEYS.map((k) => [k, 0.5]));
  g.bst = Number.isFinite(g.bst) ? g.bst : 400;
  g.gen = Number.isFinite(g.gen) ? g.gen : 0;
  g.name = typeof g.name === 'string' && g.name.trim() ? g.name.trim().slice(0, 24) : 'Unknown';
  if (!Array.isArray(g.nameParts) || g.nameParts.length !== 2 || !g.nameParts.every((x) => typeof x === 'string' && x)) {
    const sp = g.species && SPECIES_BY_ID[g.species];
    g.nameParts = sp && sp.nameParts ? sp.nameParts.slice() : splitName(g.name);
  }
  g.species = typeof g.species === 'string' && SPECIES_BY_ID[g.species] ? g.species : null;
  g.clade = cladeOf(g);
  g.parents = Array.isArray(g.parents) ? g.parents.filter((x) => typeof x === 'string').slice(0, 2) : undefined;
  if (g.parents === undefined) delete g.parents;
  g.lineage = Array.isArray(g.lineage) ? g.lineage.filter((x) => typeof x === 'string').slice(0, 16) : [];
  g.shiny = Boolean(g.shiny);
  const sp = g.species ? SPECIES_BY_ID[g.species] : null;
  g.learnset = Array.isArray(g.learnset) ? g.learnset.filter((e) => Array.isArray(e) && Number.isFinite(e[0]) && getMove(e[1])).map((e) => [e[0], e[1]]) : [];
  if (!g.learnset.length) g.learnset = ((sp && sp.learnset) || UNIVERSAL_LEARNSET).map((e) => e.slice());
  if (!ABILITIES[g.ability]) g.ability = (sp && sp.abilities && sp.abilities[0]) || 'lucky_streak';
  return g;
}

// ---- src/creature/render.js ----
// Genome -> SVG string. Pure: no DOM access, so it runs in Node for tests.
//
// A creature is drawn by walking its rig's draw tree: every part is placed on
// a named socket of its parent part, far-side copies are drawn darker behind,
// and children move with their parent (ears and eyes ride the head).
//
// The frame is fixed so creatures are comparable in size: the ground line sits
// at the same height in every render. opts.fit crops the viewBox to the
// creature's bounds instead, for hero shots.
//
// Render styles. 'classic' is the flat sticker look drawn with CSS variables.
// The others compute literal colours per slot and add volume procedurally from
// the same part data: gradient fills, clipped shadow/highlight rims along the
// edges, a thick silhouette pass under thin interior lines, and a gloss spot.





const FRAME = { w: 200, h: 230, ground: 208 };
const FAR_DEFAULT = { dx: -6, dy: -4 };

const RENDER_STYLES = ['classic', 'soft', 'cel', 'studio', 'sticker'];
const STYLE = {
  classic: { grad: false, rims: false, outlinePass: false, gloss: false, eye: 1, lineIn: 4, lineOut: 4, olL: 13, olS: 45 },
  soft:    { grad: true, rims: false, outlinePass: false, gloss: false, eye: 1.05, lineIn: 3.4, lineOut: 3.4, olL: 18, olS: 50 },
  cel:     { grad: false, rims: 'cel', outlinePass: true, gloss: false, eye: 1.15, lineIn: 2.2, lineOut: 8, olL: 20, olS: 55 },
  studio:  { grad: true, rims: 'cel', outlinePass: true, gloss: true, eye: 1.15, lineIn: 2.2, lineOut: 8, olL: 20, olS: 55 },
  sticker: { grad: false, rims: 'white', outlinePass: true, gloss: true, eye: 1.3, lineIn: 2.6, lineOut: 10, olL: 8, olS: 10 },
};
let renderStyle = 'classic';
function setRenderStyle(s) { renderStyle = RENDER_STYLES.includes(s) ? s : 'classic'; return renderStyle; }
function getRenderStyle() { return renderStyle; }

// ---- primitives ---------------------------------------------------------------

function fillAttr(f) { return f === 'none' ? 'none' : `var(--${f})`; }

/** The bare shape tag for a primitive with the given attribute string. */
function shapeTag(pr, attrs) {
  const a = attrs ? ` ${attrs}` : '';
  switch (pr.t) {
    case 'path': case 'line': return `<path d="${pr.d}"${a}/>`;
    case 'ellipse': return `<ellipse cx="${num(pr.cx)}" cy="${num(pr.cy)}" rx="${num(pr.rx)}" ry="${num(pr.ry)}"${a}/>`;
    case 'circle': return `<circle cx="${num(pr.cx)}" cy="${num(pr.cy)}" r="${num(pr.r)}"${a}/>`;
    default: return '';
  }
}

function classicPrim(pr) {
  const cls = pr.ns ? '' : ' class="o"';
  const style = pr.sw != null && !pr.ns ? ` style="stroke-width:${num(pr.sw)}"` : '';
  const op = pr.op != null ? ` opacity="${num(pr.op)}"` : '';
  if (pr.t === 'line') return `<path d="${pr.d}" fill="none" stroke="var(--${pr.f})" stroke-width="${num(pr.w)}" stroke-linecap="round" stroke-linejoin="round"${op}/>`;
  return shapeTag(pr, `${cls.trim()} fill="${fillAttr(pr.f)}"${style}${op}`.trim());
}

function primSvg(pr, ctx) {
  const st = ctx.st;
  if (ctx.mode === 'outline') {
    if (pr.ns || pr.t === 'line' || pr.f === 'none' || ctx.noOutline) return '';
    return shapeTag(pr, `fill="none" stroke="${ctx.ol}" stroke-width="${num(st.lineOut)}" stroke-linejoin="round" stroke-linecap="round"`);
  }
  if (!ctx.colors) return classicPrim(pr);
  const fam = ctx.colors[pr.f] || ctx.colors.p;
  const op = pr.op != null ? ` opacity="${num(pr.op)}"` : '';
  if (pr.t === 'line') return `<path d="${pr.d}" fill="none" stroke="${hsl(...fam.base)}" stroke-width="${num(pr.w)}" stroke-linecap="round" stroke-linejoin="round"${op}/>`;
  let fill;
  if (pr.f === 'none') fill = 'none';
  else if (st.grad && !pr.ns && pr.f !== 'k') fill = `url(#${ctx.grad(pr.f)})`;
  else fill = hsl(...fam.base);
  const stroke = pr.ns ? ' stroke="none"' : ` stroke="${ctx.ol}" stroke-width="${num(pr.sw != null ? pr.sw : st.lineIn)}" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke"`;
  let out = shapeTag(pr, `fill="${fill}"${stroke}${op}`);
  if (st.rims && !pr.ns && pr.f !== 'none' && pr.f !== 'k' && !ctx.small) {
    const id = `${ctx.uid}-c${ctx.shared.n++}`;
    out += `<clipPath id="${id}">${shapeTag(pr, '')}</clipPath><g clip-path="url(#${id})">`;
    if (st.rims === 'white') {
      out += shapeTag(pr, 'fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4"');
    } else {
      out += shapeTag(pr, `fill="none" stroke="${hsl(...fam.shade)}" stroke-width="7" transform="translate(-2 -3)" opacity="0.85"`);
      out += shapeTag(pr, `fill="none" stroke="${hsl(...fam.light)}" stroke-width="3" transform="translate(1.6 2.2)" opacity="0.8"`);
    }
    out += '</g>';
  }
  return out;
}

/** The silhouette a part's clipped prims are cut to: its clip paths, else its first filled shape. */
function partClipShapes(part) {
  if (Array.isArray(part.clip) && part.clip.length) return part.clip.map((d) => `<path d="${d}"/>`).join('');
  const first = (part.prims || []).find((pr) => pr.t !== 'line' && pr.f !== 'none' && !pr.cl);
  return first ? shapeTag(first, '') : '';
}

/** All prims of a part in a context. Prims flagged `cl` are clipped to the part's own silhouette. */
function partPrimsCtx(part, ctx) {
  let out = '', clipped = '';
  for (const pr of part.prims) {
    if (pr.cl) { if (ctx.mode !== 'outline') clipped += primSvg(pr, ctx); }
    else {
      if (clipped) { out += flushClip(part, ctx, clipped); clipped = ''; }
      out += primSvg(pr, ctx);
    }
  }
  if (clipped) out += flushClip(part, ctx, clipped);
  return out;
}
function flushClip(part, ctx, inner) {
  const id = `${ctx.uid}-pc${ctx.shared.n++}`;
  return `<clipPath id="${id}">${partClipShapes(part)}</clipPath><g clip-path="url(#${id})">${inner}</g>`;

/** Classic-style primitives for a part (used by tests and tools). */
function partPrims(part) { return part.prims.map(classicPrim).join(''); }

// ---- colours for the styled renderers ------------------------------------------

const shadeOf = (c) => [mixHue(c[0], 250, 0.12), Math.min(100, c[1] + 8), Math.max(6, c[2] - 14)];
const lightOf = (c) => [mixHue(c[0], 55, 0.1), Math.max(0, c[1] - 6), Math.min(96, c[2] + 12)];
const family = (c) => ({ base: c, shade: shadeOf(c), light: lightOf(c) });

/** Literal role colours for one slot (and its far copy) in a styled render. */
function styledColors(g, slot, far, st) {
  const perm = PAINT_PERMS[(g.paint && g.paint[slot]) || 0] || PAINT_PERMS[0];
  const cs = ['c1', 'c2', 'c3'].map((k) => g.palette[k]);
  const hue0 = g.palette.c1[0];
  const roles = { p: family(cs[perm[0]]), s: family(cs[perm[1]]), a: family(cs[perm[2]]), w: family([hue0, 20, 97]), e: family(g.palette.eye) };
  if (far) for (const r of Object.keys(roles)) { const f = roles[r]; roles[r] = { base: f.shade, shade: shadeOf(f.shade), light: f.base }; }
  const out = {};
  for (const [r, f] of Object.entries(roles)) {
    out[r] = f;
    out[`${r}d`] = { base: f.shade, shade: shadeOf(f.shade), light: f.base };
    out[`${r}l`] = { base: f.light, shade: f.base, light: lightOf(f.light) };
  }
  const k = [hue0, Math.min(g.palette.c1[1], st.olS), st.olL];
  out.k = { base: k, shade: k, light: k };
  return out;
}

// ---- bounds -----------------------------------------------------------------

const boundsCache = new Map();

/** Sample points along an SVG path (absolute and relative commands; curves are flattened). */
function pathPoints(d) {
  const pts = [];
  const tok = d.match(/[MLHVCSQTAZmlhvcsqtaz]|-?(?:\d+\.?\d*|\.\d+)(?:e-?\d+)?/gi) || [];
  let i = 0, cmd = 'M', cx = 0, cy = 0, sx = 0, sy = 0, pcx = 0, pcy = 0, prevCurve = '';
  const rd = () => Number(tok[i++]);
  const cubic = (x1, y1, x2, y2, x, y) => {
    for (let k = 1; k <= 8; k++) {
      const t = k / 8, u = 1 - t;
      pts.push([u * u * u * cx + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x, u * u * u * cy + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y]);
    }
    pcx = x2; pcy = y2; cx = x; cy = y; prevCurve = 'C';
  };
  const quad = (x1, y1, x, y) => {
    for (let k = 1; k <= 6; k++) {
      const t = k / 6, u = 1 - t;
      pts.push([u * u * cx + 2 * u * t * x1 + t * t * x, u * u * cy + 2 * u * t * y1 + t * t * y]);
    }
    pcx = x1; pcy = y1; cx = x; cy = y; prevCurve = 'Q';
  };
  while (i < tok.length) {
    if (/[a-z]/i.test(tok[i])) cmd = tok[i++];
    const rel = cmd === cmd.toLowerCase();
    const ox = rel ? cx : 0, oy = rel ? cy : 0;
    switch (cmd.toUpperCase()) {
      case 'M': { const x = rd() + ox, y = rd() + oy; cx = sx = x; cy = sy = y; pts.push([x, y]); cmd = rel ? 'l' : 'L'; prevCurve = ''; break; }
      case 'L': { const x = rd() + ox, y = rd() + oy; cx = x; cy = y; pts.push([x, y]); prevCurve = ''; break; }
      case 'H': { cx = rd() + ox; pts.push([cx, cy]); prevCurve = ''; break; }
      case 'V': { cy = rd() + oy; pts.push([cx, cy]); prevCurve = ''; break; }
      case 'C': { const x1 = rd() + ox, y1 = rd() + oy, x2 = rd() + ox, y2 = rd() + oy, x = rd() + ox, y = rd() + oy; cubic(x1, y1, x2, y2, x, y); break; }
      case 'S': { const x2 = rd() + ox, y2 = rd() + oy, x = rd() + ox, y = rd() + oy; const x1 = prevCurve === 'C' ? 2 * cx - pcx : cx, y1 = prevCurve === 'C' ? 2 * cy - pcy : cy; cubic(x1, y1, x2, y2, x, y); break; }
      case 'Q': { const x1 = rd() + ox, y1 = rd() + oy, x = rd() + ox, y = rd() + oy; quad(x1, y1, x, y); break; }
      case 'T': { const x = rd() + ox, y = rd() + oy; const x1 = prevCurve === 'Q' ? 2 * cx - pcx : cx, y1 = prevCurve === 'Q' ? 2 * cy - pcy : cy; quad(x1, y1, x, y); break; }
      case 'A': { const rx = rd(), ry = rd(); rd(); rd(); rd(); const x = rd() + ox, y = rd() + oy; const mx = (cx + x) / 2, my = (cy + y) / 2; pts.push([mx - rx, my - ry], [mx + rx, my + ry], [x, y]); cx = x; cy = y; prevCurve = ''; break; }

      default: i++;
    }
  }
  return pts;
}

/** Bounding box [x0,y0,x1,y1] of a part in its own coordinates, with a small margin for the outline. */
function partBounds(part) {
  if (boundsCache.has(part.id)) return boundsCache.get(part.id);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y) => { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; };
  for (const pr of part.prims || []) {
    if (pr.cl) continue; // clipped prims never extend the silhouette
    if (pr.t === 'ellipse') { add(pr.cx - pr.rx, pr.cy - pr.ry); add(pr.cx + pr.rx, pr.cy + pr.ry); }
    else if (pr.t === 'circle') { add(pr.cx - pr.r, pr.cy - pr.r); add(pr.cx + pr.r, pr.cy + pr.r); }
    else if (pr.t === 'path' || pr.t === 'line') for (const [x, y] of pathPoints(pr.d)) add(x, y);
  }
  const box = x0 === Infinity ? [0, 0, 0, 0] : [x0 - 2, y0 - 2, x1 + 2, y1 + 2];
  boundsCache.set(part.id, box);
  return box;
}

// transform = { x, y, a, sx, sy } applied as translate(x,y) rotate(a) scale(sx,sy)
function applyT([px, py], t) {
  let x = px * (t.sx == null ? 1 : t.sx), y = py * (t.sy == null ? 1 : t.sy);
  if (t.a) {
    const r = (t.a * Math.PI) / 180, c = Math.cos(r), s = Math.sin(r);
    const rx = x * c - y * s, ry = x * s + y * c;
    x = rx; y = ry;
  }
  return [x + (t.x || 0), y + (t.y || 0)];
}

/** Push a box through a chain of transforms, innermost first. */
function boxThrough(box, chain) {
  let pts = [[box[0], box[1]], [box[2], box[1]], [box[0], box[3]], [box[2], box[3]]];
  for (const t of chain) pts = pts.map((p) => applyT(p, t));
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return [x0, y0, x1, y1];
}

function union(a, b) {
  if (!a) return b.slice();
  return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])];
}

const xf = (x, y, a = 0, s = 1) => ({ x, y, a, sx: s, sy: s });

function tf(t) {
  let out = `translate(${num(t.x)} ${num(t.y)})`;
  if (t.a) out += ` rotate(${num(t.a)})`;
  const sy = t.sy == null ? t.sx : t.sy;
  if (t.sx !== 1 || sy !== 1) out += t.sx === sy ? ` scale(${num(t.sx)})` : ` scale(${num(t.sx)} ${num(sy)})`;
  return out;
}

function paintOf(g, slot) {
  const perm = PAINT_PERMS[(g.paint && g.paint[slot]) || 0] || PAINT_PERMS[0];
  return slotPaintVars(perm);
}

/** Scales derived from continuous trait genes. Exported so the UI can explain them. */
function traitScales(traits = {}) {
  const t = (k) => (traits[k] == null ? 0.5 : traits[k]);
  return {
    size: lerp(0.68, 1.0, t('size')),
    leg: lerp(0.8, 1.2, t('limbScale')),
    head: lerp(0.85, 1.15, t('headScale')),
    tail: lerp(0.75, 1.25, t('tailScale')),
    wing: lerp(0.75, 1.25, t('wingScale')),
    eye: lerp(0.8, 1.25, t('eyeScale')),
  };
}

/** Shared per-render state: style, outline colour, gradient defs and the per-slot context cache. */
function renderSetup(g, id, styleName) {
  const st = STYLE[styleName] || STYLE.classic;
  const styled = st !== STYLE.classic;
  const shared = { n: 0, defs: [], grads: new Map() };
  const ol = styled ? hsl(g.palette.c1[0], Math.min(g.palette.c1[1], st.olS), st.olL) : 'var(--ol)';
  const ctxCache = new Map();
  const ctxFor = (slot, far, mode, extra = {}) => {
    const key = `${slot}|${far}|${mode}|${extra.small ? 1 : 0}|${extra.noOutline ? 1 : 0}`;
    if (ctxCache.has(key)) return ctxCache.get(key);
    const colors = styled ? styledColors(g, slot, far, st) : null;
    const ctx = {
      st, uid: id, slot, far, mode, ol, shared, colors, small: Boolean(extra.small), noOutline: Boolean(extra.noOutline),
      grad(role) {
        const gid = `${id}-g-${slot}${far ? 'f' : ''}-${role}`;
        if (!shared.grads.has(gid)) {
          const fam = colors[role] || colors.p;
          shared.defs.push(`<linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${hsl(...fam.light)}"/><stop offset="0.5" stop-color="${hsl(...fam.base)}"/><stop offset="1" stop-color="${hsl(...fam.shade)}"/></linearGradient>`);
          shared.grads.set(gid, true);
        }
        return gid;
      },
    };
    ctxCache.set(key, ctx);
    return ctx;
  };
  const wrap = (slot, inner) => (styled ? `<g>${inner}</g>` : `<g style="${paintOf(g, slot)}">${inner}</g>`);
  const farWrap = (inner) => (styled ? inner : `<g style="${FAR_VARS}">${inner}</g>`);
  return { st, styled, shared, ol, ctxFor, wrap, farWrap };
}

/** Gloss spot for the styled renderers, clipped to the body. */
function glossSvg(body, id) {
  const b = partBounds(body);
  const w = b[2] - b[0], hh = b[3] - b[1];
  const cx = b[0] + w * 0.34, cy = b[1] + hh * 0.26;
  return `<g clip-path="url(#${id}-clip)"><ellipse cx="${num(cx)}" cy="${num(cy)}" rx="${num(w * 0.17)}" ry="${num(hh * 0.09)}" fill="#fff" opacity="0.22" transform="rotate(-24 ${num(cx)} ${num(cy)})"/></g>`;
}

// ---- class rigs -----------------------------------------------------------------

const ANIM_CLASS = { body: 'g-body', head: 'g-head', tail: 'g-tail', sway: 'g-sway', flap: 'g-wing', ear: 'g-ear' };

/** Frame markings and other box-fitted parts are authored in: 100 wide, 60 tall, centred on the origin. */
const FIT_FRAME = { w: 100, h: 60 };

/**
 * Build the layered markup for a creature by walking its rig's draw tree, and measure it.
 * Returns { layers, defs, box, feet, hover, K, body, clip } where box is the
 * creature's bounds in creature space (body centre = 0,0).
 */
function buildRigged(g, id, styleName, rig) {
  const R = renderSetup(g, id, styleName);
  const { st, styled, shared, ctxFor, wrap, farWrap } = R;
  const P = resolveParts(g);
  const body = P.body;
  const K = traitScales(g.traits);
  K.eye *= st.eye;
  const hover = body.hover || 0;
  const ground = new Set(rig.ground || ['body']);
  const bodyBox = body.box || partBounds(body);

  let box = null, feet = -Infinity;
  const grow = (part, chain, slot) => {
    const b = boxThrough(partBounds(part), chain);
    box = union(box, b);
    if (ground.has(slot)) feet = Math.max(feet, b[3] - 2);
  };

  /** The slots drawn on the body under its clip (markings), scaled from the authoring frame onto the body box. */
  const clippedSvg = (mode, pp) => {
    if (mode === 'outline') return '';
    let out = '';
    for (const slot of rig.clipped || []) {
      const part = P[slot];
      if (!part) continue;
      const sx = (bodyBox[2] - bodyBox[0]) / FIT_FRAME.w, sy = (bodyBox[3] - bodyBox[1]) / FIT_FRAME.h;
      const t = { x: (bodyBox[0] + bodyBox[2]) / 2, y: (bodyBox[1] + bodyBox[3]) / 2, a: 0, sx: part.fitBox === false ? 1 : sx, sy: part.fitBox === false ? 1 : sy };
      out += wrap(slot, `<g clip-path="url(#${id}-clip)"><g transform="${tf(t)}">${pp(part, slot, false, { small: true })}</g></g>`);
    }
    if (st.gloss) out += glossSvg(body, id);
    return out;
  };

  const assemble = (mode) => {
    const measure = mode === 'normal';
    const pp = (part, slot, far = false, extra) => partPrimsCtx(part, ctxFor(slot, far, mode, extra));
    const drawNode = (node, parentPart, outer) => {
      const part = P[node.slot];
      if (!part) return '';
      let t;
      if (node.fitBox && parentPart) {
        const bb = parentPart.box || partBounds(parentPart);
        t = { x: (bb[0] + bb[2]) / 2, y: (bb[1] + bb[3]) / 2, a: 0, sx: (bb[2] - bb[0]) / FIT_FRAME.w, sy: (bb[3] - bb[1]) / FIT_FRAME.h };
      } else if (node.socket) {
        const sk = parentPart && parentPart.sockets ? parentPart.sockets[node.socket] : null;
        if (!sk) return '';
        const s = (sk.s == null ? 1 : sk.s) * (node.scale ? K[node.scale] : 1);
        t = xf(sk.x, sk.y, sk.a || 0, s);
        if (sk.flip) t.sx = -t.sx;
      } else t = xf(0, 0, 0, 1);
      const chain = [t, ...outer];
      if (measure) grow(part, chain, node.slot);
      let inner = '';
      for (const c of node.behind || []) inner += drawNode(c, part, chain);
      let own = pp(part, node.slot, Boolean(node.far), { small: node.small, noOutline: node.noOutline });
      if (node.far) own = farWrap(own);
      inner += own;
      if (node.slot === 'body') inner += clippedSvg(mode, pp);
      for (const c of node.front || []) inner += drawNode(c, part, chain);
      const cls = node.anim && ANIM_CLASS[node.anim] ? ANIM_CLASS[node.anim] : '';
      const body_ = cls ? `<g class="${cls}">${inner}</g>` : inner;
      return wrap(node.slot, `<g transform="${tf(t)}">${body_}</g>`);
    };
    return [drawNode(rig.tree, null, [])];
  };

  const outline = st.outlinePass ? assemble('outline') : [];
  const layers = assemble('normal');
  if (!Number.isFinite(feet)) feet = bodyBox[3];
  if (typeof body.bottom === 'number') feet = Math.max(feet, body.bottom);
  return { layers: [...outline, ...layers], defs: shared.defs.join(''), box: box || [-40, -40, 40, 40], feet, hover, K, body, clip: body.clip || [] };
}

function buildCreature(g, id, styleName) {
  return buildRigged(g, id, styleName, getRig(rigOf(g)));
}

/** Canvas-space transform that places a built creature on the ground line. */
function placement(built, facing) {
  const flip = facing === 'left' ? -1 : 1;
  const sc = built.K.size;
  return [
    { x: 0, y: -(built.feet + built.hover) },
    { x: FRAME.w / 2, y: FRAME.ground, a: 0, sx: flip * sc, sy: sc },
  ];
}

/** Bounding box of a creature in canvas coordinates, shadow included. */
function measureCreature(g, facing = 'right') {
  const built = buildCreature(g, 'm', 'classic');
  const chain = placement(built, facing);
  const box = boxThrough(built.box, chain);
  const sc = built.K.size;
  const shadowRx = 36 * sc * (built.hover ? 0.7 : 1), shadowRy = 7 * sc;
  return union(box, [FRAME.w / 2 - shadowRx, FRAME.ground - shadowRy, FRAME.w / 2 + shadowRx, FRAME.ground + shadowRy]);
}

/**
 * Render a creature.
 * opts: size (px width), facing ('right' | 'left'), animate (bool), id (svg id prefix),
 *       label (aria), fit (crop the viewBox to the creature instead of the fixed frame),
 *       style (one of RENDER_STYLES; defaults to the global render style)
 */
function renderCreatureSvg(g, opts = {}) {
  const { size = 200, facing = 'right', animate = true, fit = false } = opts;
  const styleName = RENDER_STYLES.includes(opts.style) ? opts.style : renderStyle;
  const id = opts.id || uid('cr');
  const built = buildCreature(g, id, styleName);
  const chain = placement(built, facing);
  const sc = built.K.size;
  const shadowRx = 36 * sc * (built.hover ? 0.7 : 1), shadowRy = 7 * sc;

  let vb = [0, 0, FRAME.w, FRAME.h];
  if (fit) {
    const b = union(boxThrough(built.box, chain), [FRAME.w / 2 - shadowRx, FRAME.ground - shadowRy, FRAME.w / 2 + shadowRx, FRAME.ground + shadowRy]);
    const pad = 8;
    vb = [b[0] - pad, b[1] - pad, b[2] - b[0] + pad * 2, b[3] - b[1] + pad * 2];
  }
  const height = Math.round((size * vb[3]) / vb[2]);
  const label = opts.label || `${g.name}, ${typeLabel(g)}`;
  const live = animate;
  const delay = live ? ` style="animation-delay:-${num(((g.seed || '').length * 0.37 + (g.traits ? g.traits.size * 3 : 0)) % 3)}s"` : '';
  const clip = built.clip.map((d) => `<path d="${d}"/>`).join('');
  const shadowFill = styleName === 'classic' ? 'var(--k)' : hsl(g.palette.c1[0], 30, 10);

  return `<svg class="cr cr-${styleName}${live ? ' cr-live' : ''}" xmlns="http://www.w3.org/2000/svg" viewBox="${vb.map(num).join(' ')}" width="${size}" height="${height}" role="img" aria-label="${escapeHtml(label)}" style="${paletteVars(g.palette)}">` +
    `<defs><clipPath id="${id}-clip">${clip}</clipPath>${built.defs}</defs>` +
    `<ellipse class="cr-shadow" cx="${num(FRAME.w / 2)}" cy="${FRAME.ground}" rx="${num(shadowRx)}" ry="${num(shadowRy)}" fill="${shadowFill}" opacity="0.18"/>` +
    `<g transform="${tf(chain[1])} translate(0 ${num(chain[0].y)})">` +
    `<g class="cr-anim"${delay}>${built.layers.join('')}</g></g></svg>`;
}

/** A neutral mannequin genome used by the Part Lab to preview any single part. */
function mannequinGenome(part) {
  const rig = getRig(part.rig);
  const m = rig.mannequin;
  const parts = {};
  for (const slot of rig.slots) parts[slot] = [m.parts[slot], m.parts[slot]];
  for (const [slot, pid] of Object.entries(m.forSlot[part.slot] || {})) parts[slot] = [pid, pid];
  parts[part.slot] = [part.id, part.id];
  const paint = {};
  if (m.accentSlots.includes(part.slot)) paint[part.slot] = 4; // accent-first
  return {
    v: 1, seed: 'mannequin', species: null, rig: rig.id, name: part.name, gen: 0, shiny: false, types: ['Normal', null],
    parts, paint,
    palette: { c1: [222, 10, 64], c2: [222, 12, 46], c3: [28, 80, 58], eye: [200, 55, 45] },
    traits: { size: 0.6, bulk: 0.5, headScale: 0.5, limbScale: 0.5, tailScale: 0.5, wingScale: 0.5, eyeScale: part.slot === 'eyes' ? 0.9 : 0.5 },
    stats: {}, vigor: {}, bst: 400, lineage: [],
  };
}

// ---- src/core/rng.js ----
// Seeded random numbers. Every roll in the game goes through here so that a
// creature, a fusion, or a whole battle can be reproduced from its seed.
// Hash: cyrb128. Generator: sfc32. Both are small, fast and well distributed.

function hashSeed(str) {
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0, k; i < str.length; i++) {
    k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
    h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
    h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
  h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
  h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
}

function sfc32(a, b, c, d) {
  return function next() {
    a |= 0; b |= 0; c |= 0; d |= 0;
    const t = (((a + b) | 0) + d) | 0;
    d = (d + 1) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}

/** Create a deterministic RNG from any string or number seed. */
function makeRng(seed) {
  const seedStr = String(seed);
  const [a, b, c, d] = hashSeed(seedStr);
  const next = sfc32(a, b, c, d);
  for (let i = 0; i < 12; i++) next(); // warm up
  const rng = {
    seed: seedStr,
    /** float in [0,1) */
    next,
    /** integer in [0,n) */
    int(n) { return Math.floor(next() * n); },
    /** integer in [lo,hi] inclusive */
    between(lo, hi) { return lo + Math.floor(next() * (hi - lo + 1)); },
    /** float in [lo,hi) */
    range(lo, hi) { return lo + next() * (hi - lo); },
    /** true with probability p */
    chance(p) { return next() < p; },
    pick(arr) { return arr[Math.floor(next() * arr.length)]; },
    /** pick by weight; weightOf(item) must return a number >= 0 */
    weighted(items, weightOf) {
      let total = 0;
      for (const it of items) total += weightOf(it);
      if (total <= 0) return items[Math.floor(next() * items.length)];
      let r = next() * total;
      for (const it of items) { r -= weightOf(it); if (r < 0) return it; }
      return items[items.length - 1];
    },
    shuffle(arr) {
      const out = arr.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    },
    /** approx. normal(0,1) via sum of uniforms, cheap and good enough for trait jitter */
    gauss() { return (next() + next() + next() + next() - 2) * Math.SQRT2 * 0.5 * 1.4142; },
    /**
     * Derive an independent stream from a label. Depends only on the parent's
     * seed and the label, never on how many numbers were drawn, so call order
     * does not matter. Labels must be unique per parent.
     */
    fork(label) { return makeRng(seedStr + '/' + label); },
  };
  return rng;
}

/** The one place non-deterministic randomness is allowed: minting fresh seeds from the UI. */
function freshSeed() {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
    const buf = new Uint8Array(8);
    crypto.getRandomValues(buf);
    for (const b of buf) s += alphabet[b % alphabet.length];
  } else {
    for (let i = 0; i < 8; i++) s += alphabet[Math.floor(Math.random() * alphabet.length)];
  }
  return s;
}

// ---- src/ui/state.js ----
// Cross-screen state. In-memory for now; the save system (Phase 4) will persist it.
const fusionPool = { seed: null, genomes: [] };

const POOL_MAX = 24;

/** Add a genome to the fusion pool, newest first. Returns false if it was already there. */
function addToPool(g) {
  if (fusionPool.genomes.some((x) => x === g || (x.seed === g.seed && x.name === g.name && x.gen === g.gen))) return false;
  fusionPool.genomes.unshift(g);
  if (fusionPool.genomes.length > POOL_MAX) fusionPool.genomes.length = POOL_MAX;
  return true;
}

function removeFromPool(g) {
  const i = fusionPool.genomes.indexOf(g);
  if (i >= 0) fusionPool.genomes.splice(i, 1);
}

// ---- src/ui/lab.js ----
// Creature Lab: roll seeded creatures, inspect genes, copy and load creature codes.












const labState = { seed: null, species: 'random', count: 12 };

function seedFromUrl() {
  try { return new URLSearchParams(location.search).get('seed'); } catch { return null; }
}

function rollGenomes() {
  const out = [];
  for (let i = 0; i < labState.count; i++) {
    const rng = makeRng(`${labState.seed}:${i}`);
    const sp = SPECIES_BY_ID[labState.species];
    out.push(sp ? speciesGenome(sp, rng) : randomGenome(rng));
  }
  return out;
}

function renderLabScreen(root) {
  if (!labState.seed) labState.seed = (seedFromUrl() || freshSeed()).toUpperCase();
  clear(root);

  const seedInput = h('input', { class: 'seed', type: 'text', value: labState.seed, spellcheck: 'false', autocapitalize: 'characters', autocomplete: 'off', 'aria-label': 'Seed', placeholder: 'Seed' });
  const speciesSel = h('select', { 'aria-label': 'Species' },
    h('option', { value: 'random' }, 'Any species'),
    SPECIES.map((s) => h('option', { value: s.id, selected: labState.species === s.id }, `${s.name}  (${s.types.join(' / ')})`)));
  speciesSel.addEventListener('change', () => { labState.species = speciesSel.value; draw(); });

  const grid = h('div', { class: 'grid' });
  const codeInput = h('input', { class: 'seed code-in', type: 'text', placeholder: 'Paste a creature code (CC1....)', 'aria-label': 'Creature code', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false' });

  const applySeed = (seed) => {
    labState.seed = (seed || freshSeed()).toUpperCase();
    seedInput.value = labState.seed;
    draw();
  };

  const toolbar = h('div', { class: 'toolbar' },
    seedInput,
    h('button', { class: 'btn', onclick: () => applySeed(seedInput.value.trim()) }, 'Go'),
    h('button', { class: 'btn primary', onclick: () => applySeed(null) }, 'Roll'),
    speciesSel,
  );
  seedInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') applySeed(seedInput.value.trim()); });

  const loader = h('div', { class: 'toolbar' },
    codeInput,
    h('button', { class: 'btn', onclick: () => {
      try { openSheet(decodeGenome(codeInput.value)); codeInput.value = ''; }
      catch (e) { toast(e.message); }
    } }, 'Load'),
  );

  function draw() {
    clear(grid);
    for (const g of rollGenomes()) {
      grid.append(h('button', { class: 'card', type: 'button', onclick: () => openSheet(g) },
        creatureEl(g, { size: 160 }),
        h('div', { class: 'card-name' }, g.name, g.shiny ? h('span', { class: 'shiny', title: 'Rare colours' }, ' ✦') : null),
        typeChips(g.types)));
    }
  }

  root.append(
    toolbar,
    h('p', { class: 'hint' }, 'Same seed, same creatures, on any device. Tap a creature to see its genes.'),
    grid,
    ...section('Load a creature', loader),
  );
  draw();
}

function statRows(g) {
  const base = baseStats(g);
  const rows = [];
  for (const k of STAT_KEYS) {
    rows.push(h('span', {}, STAT_NAMES[k]), h('div', { class: 'bar' }, h('i', { style: { width: `${Math.min(100, base[k] / 1.6)}%` } })), h('b', {}, String(base[k])));
  }
  const total = STAT_KEYS.reduce((a, k) => a + base[k], 0);
  rows.push(h('span', {}, 'Total'), h('span', {}), h('b', {}, String(total)));
  return h('div', { class: 'stats' }, rows);
}

function partRows(g) {
  const resolved = resolveParts(g);
  const rig = rigOf(g);
  const rows = [];
  for (const slot of slotsFor(rig)) {
    const [e, c] = g.parts[slot];
    const shown = resolved[slot];
    const expressed = getPart(e);
    const carried = getPart(c);
    let label = shown ? shown.name : 'None';
    if (expressed && !expressed.none && (!shown || shown.id !== expressed.id)) label += ` (${expressed.name} does not fit)`;
    rows.push(h('span', {}, slotName(rig, slot)), h('span', {}, label, c !== e ? h('span', { class: 'carried' }, ` · carries ${carried ? carried.name : c}`) : null));
  }
  return h('div', { class: 'kv' }, rows);
}

function traitRows(g) {
  const rows = [];
  for (const k of TRAIT_KEYS) rows.push(h('span', {}, k), h('div', { class: 'bar' }, h('i', { style: { width: `${Math.round(g.traits[k] * 100)}%` } })), h('b', {}, g.traits[k].toFixed(2)));
  return h('div', { class: 'stats' }, rows);
}

let activeSheet = null;
function closeSheet() { if (activeSheet) { activeSheet(); activeSheet = null; } }

function openSheet(g) {
  closeSheet();

      typeChips(g.types),
      h('button', { class: 'btn close', onclick: close, 'aria-label': 'Close' }, '✕')),
    h('p', { class: 'meta' }, sp ? `${sp.name} · ${sp.tier}` : 'Fusion', ` · ${cladeName(cladeOf(g))} · gen ${g.gen} · seed ${g.seed}`),
    hero,
    h('div', { class: 'row' },
      h('button', { class: 'btn', onclick: () => { facing = facing === 'right' ? 'left' : 'right'; clear(hero).append(creatureEl(g, { size: 260, facing, fit: true })); } }, 'Flip'),
      h('button', { class: 'btn', onclick: async () => toast((await copyText(code)) ? 'Code copied' : 'Copy failed, select the text below') }, 'Copy code'),
      h('button', { class: 'btn', onclick: () => {
        toast(addToPool(g) ? 'Added to the fusion pool' : 'Already in the pool');
        close();
        if (location.hash === '#fusion') window.dispatchEvent(new CustomEvent('pool-changed'));
        else location.hash = 'fusion';
      } }, 'Fuse')),
    sp ? h('p', { class: 'desc' }, sp.desc) : null,
    ...section('Base stats', statRows(g)),

    ...section('Traits', traitRows(g)),
    ...section('Creature code', h('textarea', { class: 'code', readonly: true, rows: 3, onclick: (e) => e.target.select() }, code)),
  );
  document.body.append(backdrop, sheet);
  document.addEventListener('keydown', onKey);
}

// Part Lab: every part in the library on a neutral mannequin, grouped by rig and slot.






function renderPartsScreen(root) {

// ---- src/creature/fusion.js ----
// Fusion: two genomes in, one genome out, plus a report of what came from where.
//
// Heredity is diploid. For every slot the child draws one allele from each
// parent at random; the allele with the higher dominance (plus a little noise)
// is expressed and the other is carried. That keeps identities crisp across
// generations and lets a grandparent's trait resurface.
//
// The "identity parent" is whichever parent supplied the expressed head (or the
// body, for headless children). It gives the name prefix, the palette base and
// the primary type. The other parent gives the suffix, one accent colour and the
// secondary type. Shape from one side, colours from the other: that is what
// makes a fusion read as half and half.









const FUSE = {
  dominanceNoise: 0.15,   // +/- added to each allele's dominance before comparing
  expressedMutation: 0.03,
  carriedMutation: 0.06,
  bodyMutation: 0.01,
  paintSwap: 0.05,
  genBonusPerGen: 4,      // bst bonus per generation
  genBonusCap: 5,         // generations that count toward the bonus
  maxLineage: 16,
};

function dominanceOf(id) {
  const p = getPart(id);
  return p ? p.dom : 0.3;
}

function fitsBody(id, kind) {
  const p = getPart(id);
  return Boolean(p) && partFits(p, kind);
}

function nudgeColor(c, rng) {
  return [c[0] + rng.gauss() * 3, clamp01((c[1] + rng.gauss() * 2) / 100) * 100, clamp01((c[2] + rng.gauss() * 2) / 100) * 100].map(round3);
}

function namePartsOf(g) {
  return Array.isArray(g.nameParts) && g.nameParts.length === 2 ? g.nameParts : splitName(g.name);
}

/** Can these two fuse? Only creatures of the same class can. Returns { ok, reason }. */
function canFuse(a, b) {
  if (!a || !b) return { ok: false, reason: 'Pick two creatures.' };
  if (a === b) return { ok: false, reason: 'Pick two different creatures.' };
  const ca = cladeOf(a), cb = cladeOf(b);
  if (ca !== cb) return { ok: false, reason: `${cladeName(ca)}s only fuse with ${cladeName(ca)}s.` };
