    case 'end': return e.capture ? `${e.name} joined the team!` : e.winner == null ? 'Both sides are out of creatures. It is a draw!' : e.winner === 0 ? `${names[0]} won the battle!` : opts.wild ? 'Your team was defeated…' : `${names[1]} won the battle!`;
    default: return '';
  }
}

// ---- src/battle/ai.js ----
// Opponent AI: a scored heuristic. Deterministic given its rng.



function bestEffVs(attacker, defender) {
  let best = 0;
  for (const m of attacker.moves) {
    const mv = getMove(m.id);
    if (!mv || !isDamaging(mv) || m.pp <= 0) continue;
    best = Math.max(best, moveEffectiveness(mv, defender) * (attacker.types.includes(mv.type) ? 1.5 : 1));
  }
  return best;
}

function scoreMove(state, side, action, rng) {
  const me = activeOf(state, side), foe = activeOf(state, 1 - side);
  const mv = action.struggle ? STRUGGLE : getMove(me.moves[action.index].id);
  const acc = mv.acc == null ? 1 : mv.acc / 100;
  const faster = effectiveStat(me, 'spe') > effectiveStat(foe, 'spe') || mv.prio > 0;
  if (isDamaging(mv)) {
    const eff = moveEffectiveness(mv, foe);
    if (eff === 0) return -60;
    const est = calcDamage(me, foe, mv, eff, 0.925, false);
    const frac = Math.min(1, est / Math.max(1, foe.hp));
    let s = frac * 100 * acc;
    if (est >= foe.hp) s = 110 * acc + (faster ? 25 : 0);
    for (const f of mv.fx) {
      const p = (f.p == null ? 100 : f.p) / 100;
      if (f.k === 'status' && !foe.status) s += 25 * p;
      if (f.k === 'stat' && f.who === 'foe') s += 6 * p * Object.values(f.stats).reduce((a, b) => a + Math.abs(b), 0);
      if (f.k === 'stat' && f.who === 'self') s += 5 * p * Object.values(f.stats).reduce((a, b) => a + b, 0);
      if (f.k === 'drain') s += frac * 25 * f.r;
      if (f.k === 'recoil') s -= frac * 20 * f.r;
      if (f.k === 'flinch' && faster) s += 15 * p;
    }
    if (mv.struggle) s -= 30;
    return s;
  }
  let s = 0;
  for (const f of mv.fx) {
    if (f.k === 'status') {
      if (foe.status) s -= 25;
      else s += (f.s === 'slp' ? 50 : f.s === 'par' ? 38 : f.s === 'brn' ? (foe.stats.atk > foe.stats.spa ? 42 : 24) : f.s === 'psn' ? 30 : 30) * acc;
    } else if (f.k === 'stat' && f.who === 'self') {
      const room = Object.entries(f.stats).reduce((a, [k, n]) => a + Math.max(0, Math.min(n, 6 - me.stages[k])), 0);
      s += me.hp > me.maxHp * 0.55 ? 15 * room + (state.turn < 2 ? 6 : 0) : 4 * room;
    } else if (f.k === 'stat' && f.who === 'foe') {
      const room = Object.entries(f.stats).reduce((a, [k, n]) => a + Math.max(0, Math.min(-n, 6 + foe.stages[k])), 0);
      s += 9 * room * acc;
    } else if (f.k === 'heal') {
      s += me.hp < me.maxHp * 0.45 ? 55 : me.hp < me.maxHp * 0.7 ? 18 : -30;
    }
  }
  return s + rng.range(0, 2);
}

function scoreSwitch(state, side, action) {
  const s = state.sides[side];
  const me = activeOf(state, side), foe = activeOf(state, 1 - side), cand = s.party[action.index];
  const threatNow = bestEffVs(foe, me), threatThen = bestEffVs(foe, cand);
  const myBest = bestEffVs(me, foe), candBest = bestEffVs(cand, foe);
  let score = -12;
  if (threatNow >= 2 && threatThen <= 1 && candBest >= myBest) score += 45;
  if (myBest === 0 && candBest > 0) score += 40;
  if (me.hp < me.maxHp * 0.2 && cand.hp > cand.maxHp * 0.6 && candBest >= 1) score += 10;
  score += (cand.hp / cand.maxHp) * 5;
  return score;
}

function scoreReplacement(state, side, action) {
  const foe = activeOf(state, 1 - side), cand = state.sides[side].party[action.index];
  return bestEffVs(cand, foe) * 20 - bestEffVs(foe, cand) * 15 + (cand.hp / cand.maxHp) * 10;
}

/** Pick an action for a side. Returns null when the side has nothing to do. */
function chooseAction(state, side, rng) {
  const legal = legalActions(state, side);
  if (!legal.length) return null;
  let best = null, bestScore = -Infinity;
  for (const a of legal) {
    if (a.type === 'capture') continue; // the AI never captures
    let score;
    if (state.phase === 'replace') score = scoreReplacement(state, side, a);
    else if (a.type === 'switch') score = scoreSwitch(state, side, a);
    else score = scoreMove(state, side, a, rng);
    score += rng.range(0, 3);
    if (score > bestScore) { best = a; bestScore = score; }
  }
  return best;
}

// ---- src/core/sfx.js ----
// Procedural sound effects on WebAudio. No assets. Everything is a few tones or
// a burst of noise, so it costs nothing to ship and never needs loading.
let ctx = null;
let enabled = true;

function setSfxEnabled(v) { enabled = Boolean(v); if (enabled) audioCtx(); }
function sfxEnabled() { return enabled; }

function audioCtx() {
  if (!enabled || typeof window === 'undefined') return null;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = ctx || new AC();
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  } catch { return null; }
}

function tone({ freq = 440, to = null, type = 'square', dur = 0.12, gain = 0.07, delay = 0 }) {
  const c = audioCtx();
  if (!c) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(20, freq), t0);
  if (to) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(c.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}

function noise({ dur = 0.15, gain = 0.1, delay = 0, cutoff = 1200 }) {
  const c = audioCtx();
  if (!c) return;
  const len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = c.createBufferSource();
  src.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = cutoff;
  const g = c.createGain();
  g.gain.value = gain;
  src.connect(f).connect(g).connect(c.destination);
  src.start(c.currentTime + delay);
}

const arp = (freqs, type, dur, gap, gain = 0.06) => freqs.forEach((f, i) => tone({ freq: f, type, dur, gain, delay: i * gap }));

const sfx = {
  tap: () => tone({ freq: 660, type: 'triangle', dur: 0.05, gain: 0.035 }),
  hit: (eff = 1) => { noise({ dur: 0.12, gain: eff >= 2 ? 0.18 : 0.1, cutoff: eff >= 2 ? 2400 : 1200 }); tone({ freq: eff >= 2 ? 240 : 160, to: 55, type: 'square', dur: 0.16, gain: 0.07 }); },
  miss: () => tone({ freq: 520, to: 300, type: 'sine', dur: 0.16, gain: 0.04 }),
  heal: () => arp([523, 784], 'sine', 0.14, 0.09),
  status: () => tone({ freq: 320, to: 190, type: 'sawtooth', dur: 0.22, gain: 0.045 }),
  stat: (up) => (up ? arp([440, 660], 'triangle', 0.08, 0.06, 0.04) : arp([660, 440], 'triangle', 0.08, 0.06, 0.04)),
  faint: () => tone({ freq: 420, to: 50, type: 'sawtooth', dur: 0.55, gain: 0.07 }),
  wobble: () => tone({ freq: 330, to: 270, type: 'triangle', dur: 0.14, gain: 0.05 }),
  capture: (ok) => (ok ? arp([523, 659, 784, 1047], 'square', 0.13, 0.1) : tone({ freq: 220, to: 110, type: 'square', dur: 0.28, gain: 0.06 })),
  levelUp: () => arp([659, 784, 988, 1319], 'triangle', 0.15, 0.08),
  win: () => arp([523, 659, 784, 1047, 1319], 'square', 0.16, 0.11, 0.05),
  lose: () => arp([392, 349, 311, 196], 'sawtooth', 0.28, 0.2, 0.05),
  fuse: () => { arp([262, 330, 392, 523, 659, 784], 'sine', 0.2, 0.07, 0.05); noise({ dur: 0.5, gain: 0.05, cutoff: 600, delay: 0.3 }); },
  /** A short cry shaped by the genome: bigger creatures are lower, type picks the timbre. */
  cry: (genome) => {
    const size = genome && genome.traits && genome.traits.size != null ? genome.traits.size : 0.5;
    const base = 720 - size * 420;
    const t = genome && genome.types ? genome.types[0] : 'Normal';
    const type = ['Electric', 'Steel', 'Rock', 'Bug'].includes(t) ? 'square' : ['Ghost', 'Psychic', 'Fairy', 'Ice', 'Water'].includes(t) ? 'sine' : ['Dragon', 'Fire', 'Fighting', 'Dark'].includes(t) ? 'sawtooth' : 'triangle';
    tone({ freq: base, to: base * 1.45, type, dur: 0.13, gain: 0.06 });
    tone({ freq: base * 1.3, to: base * 0.75, type, dur: 0.22, gain: 0.055, delay: 0.13 });
  },
};

// ---- src/ui/fight.js ----
// Reusable interactive battle view. Mount it with an engine state and it plays
// events, takes the player's choices, asks the AI for the foe's, and reports
// the final state. Used by the sandbox Battle tab and by the Arena.











const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const hpClass = (frac) => (frac > 0.5 ? 'ok' : frac > 0.2 ? 'warn' : 'low');

/**
 * cfg: { state, events, names, auto, fast, onEnd(state), onQuit(), resultButtons: [{label, primary, onclick}] }
 * Returns { destroy() }.
 */
function mountFight(root, cfg) {
  const f = {
    root, state: cfg.state, names: cfg.names || ['You', 'Foe'], wild: Boolean(cfg.wild), auto: Boolean(cfg.auto), fast: Boolean(cfg.fast),
    busy: true, log: [], els: null, token: 1, alive: true, sheetClose: null,
    onEnd: cfg.onEnd || (() => {}), onQuit: cfg.onQuit || null, resultButtons: cfg.resultButtons || null, ended: false,
  };
  buildFight(f);
  playFightEvents(f, cfg.events || []).then((ok) => { if (ok) afterFightStep(f); });
  return {
    destroy() { f.alive = false; f.token++; if (f.sheetClose) f.sheetClose(); },
    get state() { return f.state; },
  };
}

function buildFight(f) {
  const els = {
    foePanel: h('div', { class: 'panel panel-foe' }),
    foeStage: h('div', { class: 'stage stage-foe' }),
    meStage: h('div', { class: 'stage stage-me' }),
    mePanel: h('div', { class: 'panel panel-me' }),
    log: h('div', { class: 'battle-log', 'aria-live': 'polite' }),
    controls: h('div', { class: 'controls' }),
  };
  f.els = els;
  clear(f.root).append(
    h('div', { class: 'arena' },
      h('div', { class: 'arena-row' }, els.foePanel, els.foeStage),
      h('div', { class: 'arena-row' }, els.meStage, els.mePanel)),
    els.log,
    els.controls,
  );
  for (const i of [0, 1]) { renderStage(f, i); renderPanel(f, i); }
  renderFightControls(f);
}

function renderPanel(f, i) {
  const st = f.state, side = st.sides[i], b = activeOf(st, i);
  const el = i === 0 ? f.els.mePanel : f.els.foePanel;
  const frac = b.hp / b.maxHp;
  appendChildren(clear(el), [
    h('div', { class: 'panel-head' }, h('b', {}, b.name), h('span', { class: 'lvl' }, `Lv ${b.level}`),
      b.status ? h('span', { class: `status st-${b.status}` }, STATUS_INFO[b.status].short) : null),
    typeChips(b.types),
    h('div', { class: 'hpbar' }, h('i', { class: hpClass(frac), style: { width: `${Math.max(0, frac * 100)}%` } })),
    h('div', { class: 'panel-foot' },
      h('span', { class: 'hpnum' }, i === 0 ? `${b.hp} / ${b.maxHp}` : `${Math.ceil(frac * 100)}%`),
      h('span', { class: 'balls' }, side.party.map((p) => h('i', { class: p.fainted ? 'out' : '' })))),
    b.xp ? xpRow(b.xp) : null,
  ]);
}

function xpFrac(xp) { return xp.next > xp.prev ? Math.max(0, Math.min(1, (xp.cur - xp.prev) / (xp.next - xp.prev))) : 1; }

/** Labelled EXP bar. title carries the exact numbers. */
function xpRow(xp) {
  const frac = xpFrac(xp);
  const toNext = Math.max(0, xp.next - xp.cur);
  return h('div', { class: 'xprow', title: xp.next > xp.prev ? `${toNext} EXP to the next level` : 'Max level' },
    h('span', {}, 'EXP'),
    h('div', { class: 'xpbar' }, h('i', { style: { width: `${frac * 100}%` } })));
}

/** After a win: fill the active creature's EXP bar, rolling over on each level gained. */
async function animateXp(f, gains) {
  const st = f.state;
  for (const g of gains) { const b = st.sides[0].party[g.index]; if (b && g.after) { b.xp = g.after; b.level = g.to.level; } }
  const g = gains.find((x) => x.index === st.sides[0].active);
  const panel = f.els.mePanel;
  const bar = panel && panel.querySelector('.xpbar i');
  if (!g || !bar) return;
  const lvl = panel.querySelector('.lvl');
  const name = activeOf(st, 0).name;
  const speed = f.fast ? 0.35 : 1;
  let level = g.from.level;
  bar.style.transition = 'none';
  bar.style.width = `${g.from.frac * 100}%`;
  await wait(60);
  while (level < g.to.level && f.alive) {
    bar.style.transition = `width ${0.6 * speed}s ease`;
    bar.style.width = '100%';
    await wait(680 * speed);
    level++;
    sfx.levelUp();
    if (lvl) lvl.textContent = `Lv ${level}`;
    logLine(f, `${name} grew to Lv ${level}!`);
    bar.style.transition = 'none';
    bar.style.width = '0%';
    await wait(90);
  }
  bar.style.transition = `width ${0.6 * speed}s ease`;
  bar.style.width = `${g.to.frac * 100}%`;
  await wait(720 * speed);
}

function renderStage(f, i) {
  const b = activeOf(f.state, i);
  const el = i === 0 ? f.els.meStage : f.els.foeStage;
  clear(el).append(h('div', { class: 'combatant enter' }, creatureEl(b.genome, { size: 200, facing: i === 0 ? 'right' : 'left' })));
  setTimeout(() => { const c = el.firstChild; if (c) c.classList.remove('enter'); }, 400);
}

function setHp(f, i, hp, maxHp) {
  const el = i === 0 ? f.els.mePanel : f.els.foePanel;
  const bar = el.querySelector('.hpbar i');
  const frac = hp / maxHp;
  if (bar) { bar.style.width = `${Math.max(0, frac * 100)}%`; bar.className = hpClass(frac); }
  const num = el.querySelector('.hpnum');
  if (num) num.textContent = i === 0 ? `${hp} / ${maxHp}` : `${Math.ceil(frac * 100)}%`;
}

function animateStage(f, i, cls, ms = 500) {
  const el = i === 0 ? f.els.meStage : f.els.foeStage;
  const c = el.firstChild;
  if (!c) return;
  c.classList.add(cls);
  setTimeout(() => c.classList.remove(cls), ms);
}

function logLine(f, text) {
  if (!text) return;
  f.log.push(text);
  const el = f.els.log;
  el.append(h('div', { class: 'line' }, text));
  while (el.children.length > 4) el.removeChild(el.firstChild);
}

/** Apply one event to the DOM. Returns how long to pause after it. */
function applyFightEvent(f, e) {
  const text = describeEvent(e, f.names, { wild: f.wild });
  switch (e.t) {
    case 'turn': logLine(f, text); return 250;
    case 'switch': renderStage(f, e.side); renderPanel(f, e.side); logLine(f, text); sfx.cry(activeOf(f.state, e.side).genome); return 650;
    case 'move': logLine(f, text); animateStage(f, e.side, e.side === 0 ? 'lunge-r' : 'lunge-l', 450); return 550;
    case 'damage': animateStage(f, e.side, 'hit', 450); setHp(f, e.side, e.hp, e.maxHp); logLine(f, text); sfx.hit(e.eff); return e.eff !== 1 || e.crit ? 750 : 550;
    case 'hurt': animateStage(f, e.side, 'hit', 350); setHp(f, e.side, e.hp, e.maxHp); logLine(f, text); sfx.hit(1); return 550;
    case 'heal': setHp(f, e.side, e.hp, e.maxHp); logLine(f, text); sfx.heal(); return 550;
    case 'faint': animateStage(f, e.side, 'faint', 900); logLine(f, text); renderPanel(f, e.side); sfx.faint(); return 900;
    case 'status': renderPanel(f, e.side); logLine(f, text); sfx.status(); return 550;
    case 'cure': renderPanel(f, e.side); logLine(f, text); return 550;
    case 'stat': logLine(f, text); if (e.stages) sfx.stat(e.stages > 0); return 450;
    case 'miss': logLine(f, text); sfx.miss(); return 450;
    case 'capture': animateStage(f, 1, e.ok ? 'captured' : 'wobble', e.ok ? 900 : 700); logLine(f, text); sfx.capture(e.ok); return e.ok ? 900 : 800;
    case 'end': logLine(f, text); if (e.winner === 0) sfx.win(); else if (e.winner === 1) sfx.lose(); return 600;
    default: logLine(f, text); return text ? 450 : 0;
  }
}

async function playFightEvents(f, events) {
  const token = f.token;
  for (const e of events) {
    if (!f.alive || token !== f.token || !f.root.isConnected) return false;
    const ms = applyFightEvent(f, e);
    if (ms) await wait(f.fast ? Math.round(ms * 0.3) : ms);
  }
  return f.alive && token === f.token && f.root.isConnected;
}

function aiFor(st, i) { return chooseAction(st, i, makeRng(`${st.seed}:ai:${st.turn}:${st.phase}:${i}`)); }

async function doFightStep(f, playerAction) {
  const st = f.state;
  let actions;
  if (st.phase === 'replace') actions = [st.sides[0].needsReplace ? (playerAction || aiFor(st, 0)) : null, st.sides[1].needsReplace ? aiFor(st, 1) : null];
  else actions = [playerAction || aiFor(st, 0), aiFor(st, 1)];
  let result;
  try { result = step(st, actions); } catch (e) { toast(e.message); f.busy = false; renderFightControls(f); return; }
  f.state = result.state;
  f.busy = true;
  renderFightControls(f);
  const ok = await playFightEvents(f, result.events);
  if (ok) afterFightStep(f);
}

async function afterFightStep(f) {
  const st = f.state;
  if (st.phase === 'over') {
    f.busy = false;
    renderFightControls(f);
    if (!f.ended) {
      f.ended = true;
      const after = f.onEnd(st);
      if (after && Array.isArray(after.xp) && after.xp.length) await animateXp(f, after.xp);
      if (f.alive) showFightResult(f);
    }
    return;
  }
  if (st.phase === 'replace') {
    if (st.sides[0].needsReplace && !f.auto) { f.busy = false; renderFightControls(f); openFightParty(f, true); return; }
    await wait(f.fast ? 200 : 500);
    if (f.alive) doFightStep(f, null);
    return;
  }
  f.busy = false;
  renderFightControls(f);
  if (f.auto) { await wait(f.fast ? 250 : 700); if (f.alive && f.auto && !f.busy && f.state.phase === 'choose') doFightStep(f, null); }
}

function effMarker(mv, foe) {
  if (mv.cat === 'status' && !mv.fx.some((x) => x.k === 'status')) return '';
  const eff = moveEffectiveness(mv, foe);
  if (mv.cat === 'status') return eff === 0 ? '✕' : '';
  if (eff === 0) return '✕';
  if (eff >= 4) return '▲▲';
  if (eff >= 2) return '▲';
  if (eff <= 0.25) return '▼▼';
  if (eff < 1) return '▼';
  return '';
}

function renderFightControls(f) {
  const el = f.els && f.els.controls;
  if (!el) return;
  const st = f.state;
  clear(el);
  const util = h('div', { class: 'util-row' },
    h('button', { class: `btn small${f.fast ? ' on' : ''}`, type: 'button', onclick: () => { f.fast = !f.fast; renderFightControls(f); } }, f.fast ? 'Fast ✓' : 'Fast'),
    h('button', { class: `btn small${f.auto ? ' on' : ''}`, type: 'button', onclick: () => { f.auto = !f.auto; renderFightControls(f); if (f.auto && !f.busy && st.phase !== 'over') afterFightStep(f); } }, f.auto ? 'Auto ✓' : 'Auto'),
    f.onQuit ? h('button', { class: 'btn small', type: 'button', onclick: () => { f.alive = false; f.token++; f.onQuit(); } }, 'Quit') : null,
  );
  if (st.phase === 'over') { el.append(util); return; }
  if (f.busy || f.auto) { el.append(h('div', { class: 'waiting' }, f.auto ? 'Auto battle running…' : '…'), util); return; }
  if (st.phase === 'replace') {
    el.append(h('button', { class: 'btn primary fuse-btn', type: 'button', onclick: () => openFightParty(f, true) }, 'Choose next creature'), util);
    return;
  }
  const me = activeOf(st, 0), foe = activeOf(st, 1);
  const legal = legalActions(st, 0);
  const grid = h('div', { class: 'moves' });
  me.moves.forEach((m, i) => {
    const mv = getMove(m.id);
    const info = TYPE_INFO[mv.type];
    const ok = legal.some((a) => a.type === 'move' && a.index === i);
    grid.append(h('button', { class: 'move-btn', type: 'button', disabled: !ok, style: { '--chip': info.color }, onclick: () => doFightStep(f, { type: 'move', index: i }) },
      h('span', { class: 'mv-name' }, mv.name, h('em', { class: 'eff' }, effMarker(mv, foe))),
      h('span', { class: 'mv-meta' }, h('span', { class: 'chip' }, h('b', {}, info.glyph), mv.type), h('span', { class: 'pp' }, `${m.pp}/${m.maxPp}`))));
  });
  const struggle = legal.find((a) => a.struggle);
  if (struggle) grid.append(h('button', { class: 'move-btn', type: 'button', onclick: () => doFightStep(f, struggle) }, h('span', { class: 'mv-name' }, 'Struggle'), h('span', { class: 'mv-meta' }, 'No PP left')));
  const row = h('div', { class: 'row wrap' },
    h('button', { class: 'btn', type: 'button', onclick: () => openFightParty(f, false) }, `Party (${aliveCount(st.sides[0])})`),
    h('button', { class: 'btn', type: 'button', onclick: () => openSheet(me.genome) }, 'Info'));
  if (legal.some((a) => a.type === 'capture')) {
    const pct = Math.round(captureChance(foe) * 100);
    row.prepend(h('button', { class: 'btn capture', type: 'button', onclick: () => doFightStep(f, { type: 'capture' }) }, `Capture · ${pct}%`));
  }
  el.append(grid, row, util);
}

function openFightParty(f, forced) {
  if (f.sheetClose) f.sheetClose();
  const st = f.state, side = st.sides[0];
  const legal = legalActions(st, 0);
  const close = () => { backdrop.remove(); sheet.remove(); f.sheetClose = null; };
  f.sheetClose = close;
  const backdrop = h('div', { class: 'sheet-backdrop', onclick: forced ? null : close });
  const list = h('div', { class: 'party-list' });
  side.party.forEach((b, i) => {
    const can = legal.some((a) => a.type === 'switch' && a.index === i);
    const frac = b.hp / b.maxHp;
    list.append(h('button', { class: `party-row${i === side.active ? ' active' : ''}${b.fainted ? ' fainted' : ''}`, type: 'button', disabled: !can, onclick: () => { close(); doFightStep(f, { type: 'switch', index: i }); } },
      creatureEl(b.genome, { size: 64, animate: false }),
      h('div', { class: 'party-info' },
        h('div', {}, h('b', {}, b.name), ' ', h('span', { class: 'lvl' }, `Lv ${b.level}`), ' ', b.status ? h('span', { class: `status st-${b.status}` }, STATUS_INFO[b.status].short) : null, i === side.active ? h('span', { class: 'status' }, 'ACTIVE') : null),
        h('div', { class: 'hpbar' }, h('i', { class: hpClass(frac), style: { width: `${frac * 100}%` } })),
        b.xp ? xpRow(b.xp) : null,
        h('div', { class: 'hint', style: { margin: 0 } }, `${b.hp} / ${b.maxHp} · ${abilityName(b.ability)}`))));
  });
  const sheet = h('section', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Party' },
    h('div', { class: 'grab' }),
    h('div', { class: 'sheet-head' }, h('h2', {}, forced ? 'Choose your next creature' : 'Party'), forced ? null : h('button', { class: 'btn close', onclick: close, 'aria-label': 'Close' }, '✕')),
    list);
  document.body.append(backdrop, sheet);
}

function showFightResult(f) {
  const st = f.state;
  const won = st.winner === 0, draw = st.winner == null;
  const title = st.captured ? 'Caught!' : draw ? 'Draw!' : won ? 'You won!' : 'You lost…';
  const buttons = (f.resultButtons || []).map((b) => h('button', { class: `btn${b.primary ? ' primary' : ''}`, type: 'button', onclick: b.onclick }, b.label));
  f.els.controls.prepend(h('div', { class: 'result-card' },
    h('h2', {}, title),
    h('p', { class: 'hint' }, `${st.turn} turns · ${aliveCount(st.sides[0])} of yours still standing`),
    buttons.length ? h('div', { class: 'row wrap' }, buttons) : null));
}

// ---- src/ui/battle.js ----
// Sandbox battles: pick a party, fight a random opponent, or watch AI vs AI.








const LEVELS = [10, 30, 50, 100];
const bs = { mode: 'setup', level: 30, rosterSeed: 'ARENA', roster: [], chosen: [], root: null, fight: null, last: null, auto: false };
let seededRoster = { seed: null, genomes: [] };

function buildRoster() {
  if (seededRoster.seed !== bs.rosterSeed) {
    seededRoster = { seed: bs.rosterSeed, genomes: Array.from({ length: 6 }, (_, i) => randomGenome(makeRng(`${bs.rosterSeed}:roster:${i}`))) };
  }
  const out = seededRoster.genomes.slice();
  for (const g of fusionPool.genomes) if (!out.includes(g)) out.push(g);
  bs.roster = out;
  bs.chosen = bs.chosen.filter((g) => out.includes(g));
}

function renderBattleScreen(root) {
  bs.root = root;
  if (bs.fight) { bs.fight.destroy(); bs.fight = null; }
  buildRoster();
  clear(root);
  if (bs.mode === 'fight' && bs.last) startSandboxBattle(bs.last.mine, { foeParty: bs.last.foe, seed: bs.last.seed });
  else setupView(root);
}

function setupView(root) {
  const rerender = () => renderBattleScreen(root);
  const levelRow = h('div', { class: 'chips-row' }, LEVELS.map((L) => h('button', {
    class: `btn lvl${bs.level === L ? ' on' : ''}`, type: 'button', onclick: () => { bs.level = L; rerender(); },
  }, `Lv ${L}`)));
  const grid = h('div', { class: 'pool' });
  for (const g of bs.roster) {
    const idx = bs.chosen.indexOf(g);
    grid.append(h('button', { class: `pcard${idx >= 0 ? ' is-on' : ''}`, type: 'button', onclick: () => {
      if (idx >= 0) bs.chosen.splice(idx, 1);
      else if (bs.chosen.length < MAX_PARTY) bs.chosen.push(g);
      else { toast(`Party is full (${MAX_PARTY}).`); return; }
      rerender();
    } },
      idx >= 0 ? h('span', { class: 'sel badge a' }, String(idx + 1)) : null,
      g.gen ? h('span', { class: 'gen' }, `gen ${g.gen}`) : null,
      creatureEl(g, { size: 104, animate: false }),
      h('span', {}, g.name)));
  }
  const start = (auto) => {
    let party = bs.chosen.slice();
    if (!party.length) party = bs.roster.slice(0, 3);
    bs.auto = auto;
    startSandboxBattle(party);
  };
  root.append(
    h('p', { class: 'hint' }, `Free battles for testing. Pick up to ${MAX_PARTY} creatures; the opponent gets a random party of the same size and level.`),
    ...section('Level', levelRow),
    ...section(`Your party · ${bs.chosen.length}/${MAX_PARTY}`,
      h('div', { class: 'toolbar' },
        h('button', { class: 'btn', type: 'button', onclick: () => { bs.rosterSeed = freshSeed(); bs.chosen = []; rerender(); } }, 'New roster'),
        h('button', { class: 'btn', type: 'button', onclick: () => { bs.chosen = []; rerender(); } }, 'Clear')),
      h('p', { class: 'hint' }, 'Creatures from the fusion pool show up here too.'),
      grid),
    h('div', { class: 'row wrap' },
      h('button', { class: 'btn primary fuse-btn', type: 'button', onclick: () => start(false) }, bs.chosen.length ? 'Battle!' : 'Quick battle'),
      h('button', { class: 'btn', type: 'button', onclick: () => start(true) }, 'Watch AI vs AI')),
  );
}

function startSandboxBattle(partyGenomes, opts = {}) {
  const seed = opts.seed || freshSeed();
  const rng = makeRng(`${seed}:foe`);
  const foeParty = opts.foeParty || Array.from({ length: partyGenomes.length }, (_, i) => randomGenome(rng.fork(`f${i}`)));
  const { state, events } = createBattle({
    sides: [
      { name: 'You', party: partyGenomes.map((g) => makeBattler(g, bs.level)) },
      { name: 'Foe', ai: true, party: foeParty.map((g) => makeBattler(g, bs.level)) },
    ],
    seed,
  });
  bs.last = { mine: partyGenomes, foe: foeParty, seed };
  bs.mode = 'fight';
  if (bs.fight) bs.fight.destroy();
  clear(bs.root);
  const host = h('div');
  bs.root.append(host);
  bs.fight = mountFight(host, {
    state, events, names: ['You', 'Foe'], auto: bs.auto,
    onQuit: () => { bs.mode = 'setup'; bs.auto = false; renderBattleScreen(bs.root); },
    resultButtons: [
      { label: 'Rematch', primary: true, onclick: () => { bs.auto = false; startSandboxBattle(bs.last.mine, { foeParty: bs.last.foe }); } },
      { label: 'New opponent', onclick: () => { bs.auto = false; startSandboxBattle(bs.last.mine); } },
      { label: 'Change party', onclick: () => { bs.mode = 'setup'; bs.auto = false; renderBattleScreen(bs.root); } },
    ],
  });
}

// ---- src/game/save.js ----
// Persistent save: best results, the creature collection, and the run in progress.





const SAVE_KEY = 'creaturecollector.save';
const SAVE_VERSION = 1;
const SAVE_PREFIX = 'CCSAVE1.';
const COLLECTION_MAX = 200;

function emptySave() {
  return {
    v: SAVE_VERSION,
    best: { floor: 0, runs: 0 },
    totals: { battles: 0, captures: 0, fusions: 0 },
    collection: [],
    run: null,
    settings: { fast: false },
  };
}

function cleanMember(m) {
  if (!m || typeof m !== 'object') return null;
  try { validateGenome(m.genome); } catch { return null; }
  if (!Number.isFinite(m.level)) return null;
  const level = Math.max(1, Math.min(100, Math.round(m.level)));
  let moves = Array.isArray(m.moves) ? m.moves.filter((id) => typeof id === 'string' && getMove(id)).slice(0, 4) : [];
  if (!moves.length) moves = movesAtLevel(learnsetOf(m.genome), level);
  return { uid: String(m.uid || ''), genome: m.genome, level, xp: Number.isFinite(m.xp) ? m.xp : 0, hp: Number.isFinite(m.hp) ? Math.max(0, m.hp) : 1, status: m.status || null, moves };
}

/** Coerce any parsed object into a valid save, dropping anything broken. */
function normalizeSave(raw) {
  const s = emptySave();
  if (!raw || typeof raw !== 'object' || raw.v !== SAVE_VERSION) return s;
  if (raw.best) { s.best.floor = Number(raw.best.floor) || 0; s.best.runs = Number(raw.best.runs) || 0; }
  if (raw.totals) for (const k of Object.keys(s.totals)) s.totals[k] = Number(raw.totals[k]) || 0;
  if (raw.settings) s.settings.fast = Boolean(raw.settings.fast);
  if (Array.isArray(raw.collection)) {
    for (const e of raw.collection) {
      try { validateGenome(e.genome); s.collection.push({ genome: e.genome, floor: Number(e.floor) || 0, when: Number(e.when) || 0 }); } catch { /* skip */ }
      if (s.collection.length >= COLLECTION_MAX) break;
    }
  }
  const r = raw.run;
  if (r && typeof r === 'object' && ['starter', 'floor', 'gameover'].includes(r.phase)) {
    const run = {
      seed: String(r.seed || 'run'), floor: Math.max(1, Number(r.floor) || 1), phase: r.phase,
      party: (Array.isArray(r.party) ? r.party : []).map(cleanMember).filter(Boolean),
      box: (Array.isArray(r.box) ? r.box : []).map(cleanMember).filter(Boolean),
      starters: null, altar: Boolean(r.altar), encounter: r.encounter && r.encounter.foes ? r.encounter : null,
      nextId: Number(r.nextId) || 1, stats: { battles: 0, captures: 0, fusions: 0, bosses: 0, ...(r.stats || {}) }, lastReport: r.lastReport || null,
      pendingLearns: (Array.isArray(r.pendingLearns) ? r.pendingLearns : []).filter((q) => q && typeof q.uid === 'string' && getMove(q.moveId)),
    };
    if (Array.isArray(r.starters)) {
      run.starters = r.starters.filter((g) => { try { validateGenome(g); return true; } catch { return false; } });
    }
    const usable = run.phase === 'starter' ? run.starters && run.starters.length === 3 : run.party.length > 0;
    if (usable) s.run = run;
  }
  return s;
}

function storageOf(storage) {
  if (storage) return storage;
  try { return globalThis.localStorage || null; } catch { return null; }
}

function loadSave(storage) {
  const st = storageOf(storage);
  if (!st) return emptySave();
  try { const raw = st.getItem(SAVE_KEY); return raw ? normalizeSave(JSON.parse(raw)) : emptySave(); } catch { return emptySave(); }
}

function persistSave(save, storage) {
  const st = storageOf(storage);
  if (!st) return false;
  try { st.setItem(SAVE_KEY, JSON.stringify(save)); return true; } catch { return false; }
}

function clearSave(storage) {
  const st = storageOf(storage);
  try { if (st) st.removeItem(SAVE_KEY); } catch { /* ignore */ }
}

function exportSave(save) { return SAVE_PREFIX + b64uEncode(JSON.stringify(save)); }

function importSave(code) {
  const s = String(code || '').trim();
  if (!s.startsWith(SAVE_PREFIX)) throw new Error('That is not a save code.');
  let raw;
  try { raw = JSON.parse(b64uDecode(s.slice(SAVE_PREFIX.length))); } catch { throw new Error('That save code is damaged.'); }
  return normalizeSave(raw);
}

/** Remember a creature in the collection. Wild species dedupe by species; fusions by name and seed. */
function recordCollection(save, genome, floor) {
  const key = genome.gen ? `${genome.name}#${genome.seed}` : genome.species;
  const exists = save.collection.some((e) => (e.genome.gen ? `${e.genome.name}#${e.genome.seed}` : e.genome.species) === key);
  if (exists) return false;
  save.collection.push({ genome, floor: floor || 0, when: Date.now() });
  while (save.collection.length > COLLECTION_MAX) save.collection.shift();
  return true;
}

/** Close out a run: tally totals, update the best floor, retire its creatures to the collection. */
function endRun(save) {
  const run = save.run;
  if (!run) return save;
  const reached = run.phase === 'gameover' ? run.floor : Math.max(1, run.floor - 1);
  save.best.floor = Math.max(save.best.floor, reached);
  save.best.runs++;
  save.totals.battles += run.stats.battles || 0;
  save.totals.captures += run.stats.captures || 0;
  save.totals.fusions += run.stats.fusions || 0;
  for (const m of [...run.party, ...run.box]) recordCollection(save, m.genome, run.floor);
  save.run = null;
  return save;
}

// ---- src/game/run.js ----
// Endless arena rules. Pure game logic over a plain `run` object; the UI calls
// these and persists the result. Every roll is seeded by the run seed and floor.








const ARENA = {
  partyMax: MAX_PARTY,
  starterLevel: 8,
  baseLevel: 3,
  levelPerFloor: 2,
  maxLevel: 100,
  bossEvery: 5,
  trainerEvery: 3,
  healBetweenFloors: 0.5,
  xpK: 7,
  wildFusionFrom: 8,
  rareFrom: 4,
};

const TRAINER_NAMES = ['Ranger Ivy', 'Scout Bram', 'Herder Tobin', 'Keeper Sable', 'Drifter Wren', 'Tamer Oakes', 'Courier Pim', 'Warden’s Aide Lise'];
const WARDEN_NAMES = ['Ashvale', 'Brine', 'Cinder', 'Duskmoor', 'Emberlake', 'Frostgate', 'Gloam', 'Hollowreach'];

function floorLevel(floor) { return Math.min(ARENA.maxLevel, ARENA.baseLevel + floor * ARENA.levelPerFloor); }
function xpForLevel(L) { return L * L * L; }
/** XP for defeating (or catching) one foe. Tuned so a floor is worth roughly two levels. */
function xpReward(level, bst, kind) {
  return Math.round(ARENA.xpK * level * level * ((bst || 400) / 400) * (kind === 'boss' ? 1.5 : 1));
}

function memberMaxHp(m) { return statsAtLevel(m.genome, m.level).hp; }

/** XP progress within the current level: { cur, prev, next, frac }. frac is 1 at the level cap. */
function xpProgress(m) {
  const prev = xpForLevel(m.level);
  const next = m.level >= ARENA.maxLevel ? prev : xpForLevel(m.level + 1);
  const frac = next > prev ? Math.max(0, Math.min(1, (m.xp - prev) / (next - prev))) : 1;
  return { cur: m.xp, prev, next, frac };
}

function makeMember(genome, level, uid) {
  const m = { uid, genome, level, xp: xpForLevel(level), hp: 0, status: null, moves: movesAtLevel(learnsetOf(genome), level) };
  m.hp = memberMaxHp(m);
  return m;
}

/** Moves a member could pick up between two levels (exclusive of `from`, inclusive of `to`). */
function movesLearnedBetween(m, from, to) {
  const out = [];
  for (const [lvl, id] of learnsetOf(m.genome)) if (lvl > from && lvl <= to && getMove(id) && !m.moves.includes(id) && !out.includes(id)) out.push(id);
  return out;
}

/** Resolve a pending learn: replace the move at `replaceIndex`, or skip when it is null. */
function learnMove(run, uid, moveId, replaceIndex) {
  const m = [...run.party, ...run.box].find((x) => x.uid === uid);
  run.pendingLearns = (run.pendingLearns || []).filter((p) => !(p.uid === uid && p.moveId === moveId));
  if (!m || replaceIndex == null || !getMove(moveId)) return run;
  if (replaceIndex >= 0 && replaceIndex < m.moves.length) m.moves[replaceIndex] = moveId;
  else if (m.moves.length < 4) m.moves.push(moveId);
  return run;
}

function nextUid(run) { return `m${run.nextId++}`; }

function newRun(seed) {
  const rng = makeRng(`${seed}:starters`);
  const starters = [];
  const used = new Set();
  let guard = 0;
  while (starters.length < 3 && guard++ < 50) {
    const sp = rng.weighted(SPECIES.filter((s) => s.tier !== 'rare'), (s) => TIER_WEIGHT[s.tier]);
    if (used.has(sp.id)) continue;
    used.add(sp.id);
    starters.push(speciesGenome(sp, rng.fork(`s${starters.length}`)));
  }
  return {
    seed: String(seed), floor: 1, phase: 'starter', party: [], box: [], starters, altar: false, encounter: null,
    nextId: 1, stats: { battles: 0, captures: 0, fusions: 0, bosses: 0 }, lastReport: null, pendingLearns: [],
  };
}

function chooseStarter(run, index) {
  const g = run.starters[index];
  if (!g) throw new Error('No such starter.');
  run.party = [makeMember(g, ARENA.starterLevel, nextUid(run))];
  run.starters = null;
  run.phase = 'floor';
  run.encounter = encounterFor(run, run.floor);
  return run;
}

function wildGenome(rng, floor) {
  const sp = rng.weighted(SPECIES, (s) => (s.tier === 'rare' ? (floor < ARENA.rareFrom ? 0 : Math.min(0.9, 0.15 + floor * 0.02)) : s.tier === 'uncommon' ? Math.min(1, 0.5 + floor * 0.01) : 1));
  return speciesGenome(sp, rng.fork(`w${sp.id}`));
}

function wildOrFusion(rng, floor) {
  const fusionChance = floor >= ARENA.wildFusionFrom ? Math.min(0.35, (floor - ARENA.wildFusionFrom + 1) * 0.04) : 0;
  const a = wildGenome(rng.fork('a'), floor);
  if (!rng.chance(fusionChance)) return a;
  const b = wildGenome(rng.fork('b'), floor);
  return fuse(a, b, rng.fork('fuse')).child;
}

/** The encounter waiting on a floor. Deterministic per run seed and floor. */
function encounterFor(run, floor) {
  const rng = makeRng(`${run.seed}:floor:${floor}`);
  const L = floorLevel(floor);
  const cap = (x) => Math.max(2, Math.min(ARENA.maxLevel, x));
  if (floor % ARENA.bossEvery === 0) {
    const count = Math.min(ARENA.partyMax, 1 + Math.floor(floor / ARENA.bossEvery));
    const a = wildGenome(rng.fork('b1'), floor), b = wildGenome(rng.fork('b2'), floor), c = wildGenome(rng.fork('b3'), floor);
    const leader = fuse(fuse(a, b, rng.fork('f1')).child, c, rng.fork('f2')).child;
    const foes = [{ genome: leader, level: cap(L) }];
    for (let i = 1; i < count; i++) foes.push({ genome: wildOrFusion(rng.fork(`m${i}`), floor), level: cap(L - 1) });
    return { kind: 'boss', name: `Warden ${rng.pick(WARDEN_NAMES)}`, foes, capturable: false };
  }
  if (floor % ARENA.trainerEvery === 0) {
    const count = Math.max(1, Math.min(ARENA.partyMax, Math.floor(floor / ARENA.trainerEvery)));
    const foes = [];
    for (let i = 0; i < count; i++) foes.push({ genome: wildOrFusion(rng.fork(`t${i}`), floor), level: cap(L - 1 - rng.int(2)) });
    return { kind: 'trainer', name: rng.pick(TRAINER_NAMES), foes, capturable: false };
  }
  const g = wildOrFusion(rng.fork('wild'), floor);
  return { kind: 'wild', name: `Wild ${g.name}`, foes: [{ genome: g, level: cap(L + rng.between(-1, 1)) }], capturable: true };
}

/** Build the engine state for the current floor. Rotates a fainted lead out of the first slot. */
function buildBattle(run) {
  const enc = run.encounter;
  if (!enc) throw new Error('No encounter on this floor.');
  if (run.party[0].hp <= 0) {
    const k = run.party.findIndex((m) => m.hp > 0);
    if (k < 0) throw new Error('Nobody in the party can fight.');
    run.party.unshift(...run.party.splice(k, 1));
  }
  const mine = run.party.map((m) => {
    const b = makeBattler(m.genome, m.level, { moves: m.moves, xp: xpProgress(m) });
    b.hp = Math.max(0, Math.min(m.hp, b.maxHp));
    b.status = m.status;
    b.fainted = b.hp <= 0;
    return b;
  });
  const foes = enc.foes.map((f) => makeBattler(f.genome, f.level));
  return createBattle({
    sides: [{ name: 'You', party: mine }, { name: enc.name, ai: true, party: foes }],
    seed: `${run.seed}:battle:${run.floor}`,
    capturable: enc.capturable,
  });
}

function gainXp(m, xp) {
  const from = m.level;
  m.xp += xp;
  while (m.level < ARENA.maxLevel && m.xp >= xpForLevel(m.level + 1)) {
    const oldMax = memberMaxHp(m);
    m.level++;
    if (m.hp > 0) m.hp += memberMaxHp(m) - oldMax;
  }
  const learned = [], pending = [];
  for (const id of movesLearnedBetween(m, from, m.level)) {
    if (m.moves.length < 4) { m.moves.push(id); learned.push(id); } else pending.push(id);
  }
  return { from, to: m.level, learned, pending };
}

function healParty(run, fraction, full) {
  for (const m of [...run.party, ...run.box]) {
    const max = memberMaxHp(m);
    if (full) { m.hp = max; m.status = null; continue; }
    m.hp = Math.min(max, m.hp + Math.round(max * fraction));
    m.status = null;
  }
  return run;
}

/** Fold a finished battle back into the run. Returns { run, report }. */
function applyBattle(run, state) {
  const enc = run.encounter;
  const mine = state.sides[0].party;
  const foes = state.sides[1].party;
  run.party.forEach((m, i) => { const b = mine[i]; if (b) { m.hp = b.hp; m.status = b.status; } });
  const won = state.winner === 0;
  const capturedBattler = state.captured ? foes.find((f) => f.uid === state.captured) : null;
  let xp = 0;
  for (const f of foes) if (f.fainted || (capturedBattler && f.uid === capturedBattler.uid)) xp += xpReward(f.level, f.genome.bst, enc.kind);
  run.stats.battles++;
  const report = { won, kind: enc.kind, foe: enc.name, xp: 0, levelUps: [], captured: null, floor: run.floor };
  if (!won) { run.phase = 'gameover'; run.lastReport = report; return { run, report }; }
  report.xp = xp;
  report.learned = [];
  report.xpGains = [];
  run.pendingLearns = run.pendingLearns || [];
  run.party.forEach((m, index) => {
    const before = xpProgress(m);
    const r = gainXp(m, xp);
    const after = xpProgress(m);
    report.xpGains.push({ uid: m.uid, index, from: { level: r.from, frac: before.frac }, to: { level: r.to, frac: after.frac }, after });
    if (r.to > r.from) report.levelUps.push({ name: m.genome.name, from: r.from, to: r.to });
    for (const id of r.learned) report.learned.push({ name: m.genome.name, move: getMove(id).name });
    for (const id of r.pending) run.pendingLearns.push({ uid: m.uid, moveId: id });
  });
  if (capturedBattler) {
    const nm = makeMember(capturedBattler.genome, capturedBattler.level, nextUid(run));
    nm.hp = Math.max(1, capturedBattler.hp);
    nm.status = capturedBattler.status;
    (run.party.length < ARENA.partyMax ? run.party : run.box).push(nm);
    run.stats.captures++;
    report.captured = nm;
    report.toBox = !run.party.includes(nm);
  }
  if (enc.kind === 'boss') { run.stats.bosses++; run.altar = true; }
  run.floor++;
  run.encounter = encounterFor(run, run.floor);
  // Wardens are fought rested: a full heal on the way in, and the altar heals again after.
  healParty(run, ARENA.healBetweenFloors, run.encounter.kind === 'boss');
  run.phase = 'floor';
  run.lastReport = report;
  return { run, report };
}

function findMember(run, uid) { return [...run.party, ...run.box].find((m) => m.uid === uid) || null; }

function altarSeed(run, uidA, uidB) { return `${run.seed}:altar:${run.floor}:${uidA}:${uidB}`; }

/** Preview the altar child without changing the run. */
function previewFusion(run, uidA, uidB) {
  const a = findMember(run, uidA), b = findMember(run, uidB);
  if (!a || !b || a === b) return null;
  return fuse(a.genome, b.genome, makeRng(altarSeed(run, uidA, uidB))).child;
}

/** Fuse two members at the altar. Both are consumed; the child takes the higher level and full HP. */
function fuseMembers(run, uidA, uidB) {
  const a = findMember(run, uidA), b = findMember(run, uidB);
  if (!a || !b || a === b) throw new Error('Pick two different creatures.');
  const child = previewFusion(run, uidA, uidB);
  const member = makeMember(child, Math.max(a.level, b.level), nextUid(run));
  run.party = run.party.filter((m) => m !== a && m !== b);
  run.box = run.box.filter((m) => m !== a && m !== b);
  (run.party.length < ARENA.partyMax ? run.party : run.box).push(member);
  run.stats.fusions++;
  run.altar = false;
  healParty(run, 1, true);
  return { run, child: member };
}

function skipAltar(run) { run.altar = false; healParty(run, 1, true); return run; }

function moveMember(run, uid, to) {
  const m = findMember(run, uid);
  if (!m) return run;
  if (to === 'box') {
    if (run.party.length <= 1 || !run.party.includes(m)) return run;
    run.party = run.party.filter((x) => x !== m); run.box.push(m);
  } else {
    if (run.party.length >= ARENA.partyMax || !run.box.includes(m)) return run;
    run.box = run.box.filter((x) => x !== m); run.party.push(m);
  }
  return run;
}

function setLead(run, uid) {
  const i = run.party.findIndex((m) => m.uid === uid);
  if (i > 0) run.party.unshift(...run.party.splice(i, 1));
  return run;
}

function canFight(run) { return run.party.some((m) => m.hp > 0); }

// ---- src/ui/arena.js ----
// Endless Arena: the game loop. Starter -> floors of wild, trainer and boss
// encounters -> capture, level up, fuse at altars -> run ends on a wipe.












const ar = { save: null, root: null, fight: null, altar: null, starterPick: -1, confirmReset: false, showReport: true };

function save() { if (!persistSave(ar.save)) toast('Could not save (storage blocked?)'); }

function renderArenaScreen(root) {
  ar.root = root;
  if (!ar.save) ar.save = loadSave();
  if (ar.fight) { ar.fight.destroy(); ar.fight = null; }
  clear(root);
  const run = ar.save.run;
  if (!run) return homeView(root);
  if (run.phase === 'starter') return starterView(root, run);
  if (run.phase === 'gameover') return gameOverView(root, run);
  if (ar.altar) return altarView(root, run);
  return floorView(root, run);
}

// ---- starter ----------------------------------------------------------------

function starterView(root, run) {

// ---- floor ------------------------------------------------------------------

function memberRow(run, m, actions) {
  const max = memberMaxHp(m);
  const frac = m.hp / max;
  const xp = xpProgress(m);
  return h('div', { class: `party-row static${m.hp <= 0 ? ' fainted' : ''}` },
    creatureEl(m.genome, { size: 64, animate: false }),
    h('div', { class: 'party-info' },
      h('div', {}, h('b', {}, m.genome.name), ' ', h('span', { class: 'lvl' }, `Lv ${m.level}`), ' ',
        m.status ? h('span', { class: `status st-${m.status}` }, STATUS_INFO[m.status].short) : null,
        m.hp <= 0 ? h('span', { class: 'status' }, 'FAINTED') : null),
      h('div', { class: 'hpbar' }, h('i', { class: frac > 0.5 ? 'ok' : frac > 0.2 ? 'warn' : 'low', style: { width: `${Math.max(0, frac * 100)}%` } })),
      h('div', { class: 'xpline' }, xpRow(xp), h('span', { class: 'xpnum' }, xp.next > xp.prev ? `${xp.cur - xp.prev} / ${xp.next - xp.prev}` : 'MAX')),
      h('div', { class: 'move-chips' }, (m.moves || []).map((id) => { const mv = getMove(id); return mv ? h('span', { class: 'chip', style: { '--chip': TYPE_INFO[mv.type].color } }, mv.name) : null; })),
      h('div', { class: 'row-actions' }, h('span', { class: 'hint', style: { margin: 0 } }, `${m.hp} / ${max}`), ...actions)));
}

function moveLabel(id) {
  const mv = getMove(id);
  return mv ? `${mv.name} · ${mv.type}${mv.power ? ` ${mv.power}` : ''}` : id;
}

function learnCard(run) {
  const q = (run.pendingLearns || [])[0];
  if (!q) return null;
  const m = [...run.party, ...run.box].find((x) => x.uid === q.uid);
  if (!m) { learnMove(run, q.uid, q.moveId, null); save(); return null; }
  const mv = getMove(q.moveId);
  const done = () => { save(); renderArenaScreen(ar.root); };
  return h('div', { class: 'result-card slim learn' },
    h('div', {}, h('b', {}, m.genome.name), ` wants to learn `, h('b', {}, mv.name), ` (${mv.type}${mv.power ? `, ${mv.power} power` : ''}). Replace which move?`),
    h('div', { class: 'moves' }, m.moves.map((id, i) => h('button', { class: 'move-btn', type: 'button', style: { '--chip': TYPE_INFO[getMove(id).type].color }, onclick: () => { learnMove(run, q.uid, q.moveId, i); done(); } }, h('span', { class: 'mv-name' }, getMove(id).name), h('span', { class: 'mv-meta' }, moveLabel(id))))),
    h('div', { class: 'row' }, h('button', { class: 'btn small', type: 'button', onclick: () => { learnMove(run, q.uid, q.moveId, null); done(); } }, `Don't learn ${mv.name}`)));
}

function smallBtn(label, onclick, disabled) { return h('button', { class: 'btn small', type: 'button', disabled, onclick }, label); }

function reportCard(report) {
  if (!report || !report.won) return null;
  const lines = [];
  lines.push(`Beat ${report.foe} on floor ${report.floor}. +${report.xp} XP each.`);
  for (const l of report.levelUps) lines.push(`${l.name} grew to Lv ${l.to}!`);
  for (const l of report.learned || []) lines.push(`${l.name} learned ${l.move}!`);
  if (report.captured) lines.push(`${report.captured.genome.name} joined ${report.toBox ? 'the box' : 'the party'}.`);
  return h('div', { class: 'result-card slim' }, lines.map((t) => h('div', {}, t)),
    h('button', { class: 'btn small', type: 'button', onclick: () => { ar.showReport = false; renderArenaScreen(ar.root); } }, 'Dismiss'));
}

function floorView(root, run) {
  const rerender = () => renderArenaScreen(root);
  const enc = run.encounter;
  const L = floorLevel(run.floor);
  const kindLabel = { wild: 'Wild encounter', trainer: 'Trainer battle', boss: 'Warden' }[enc.kind];
  const foesRow = h('div', { class: 'foes' }, enc.foes.map((f) => h('div', { class: 'foe-card' },
    creatureEl(f.genome, { size: enc.foes.length > 2 ? 78 : 120, facing: 'left', animate: enc.foes.length <= 2 }),
    h('span', {}, `${f.genome.name} · Lv ${f.level}`))));
  appendChildren(root, [
    h('div', { class: 'floor-head' },
      h('div', {}, h('h2', { class: 'screen-title' }, `Floor ${run.floor}`), h('span', { class: 'hint' }, `wild level ${L} · ${run.stats.captures} caught · ${run.stats.fusions} fused`)),
      h('button', { class: 'btn small', type: 'button', onclick: () => { if (confirm('Abandon this run? Your party retires to the collection.')) { run.phase = 'gameover'; endRun(ar.save); save(); rerender(); } } }, 'Abandon')),
    ar.showReport ? reportCard(run.lastReport) : null,
    learnCard(run),
    h('div', { class: `encounter ${enc.kind}` },
      h('div', { class: 'enc-head' }, h('span', { class: `kind-badge ${enc.kind}` }, kindLabel), h('b', {}, enc.name)),
      foesRow,
      enc.capturable ? h('p', { class: 'hint' }, 'Wild creatures can be captured during the fight. Weaken them first.') : null,
      h('div', { class: 'row wrap' },
        h('button', { class: 'btn primary fuse-btn', type: 'button', disabled: !canFight(run), onclick: () => startArenaBattle(root, run) }, canFight(run) ? 'Fight' : 'Nobody can fight'),
        run.altar ? h('button', { class: 'btn altar-btn', type: 'button', onclick: () => { ar.altar = { a: null, b: null }; rerender(); } }, '✦ Fusion altar') : null)),
  ]);
  const partyList = h('div', { class: 'party-list' });
  run.party.forEach((m, i) => partyList.append(memberRow(run, m, [
    smallBtn('Lead', () => { setLead(run, m.uid); save(); rerender(); }, i === 0),
    smallBtn('Box', () => { moveMember(run, m.uid, 'box'); save(); rerender(); }, run.party.length <= 1),
    smallBtn('Info', () => openSheet(m.genome)),
  ])));
  root.append(...section(`Party · ${run.party.length}/${ARENA.partyMax}`, h('p', { class: 'hint' }, `The lead goes out first. Everyone recovers ${Math.round(ARENA.healBetweenFloors * 100)}% HP between floors, fully before a Warden, and the altar heals everyone.`), partyList));
  if (run.box.length) {
    const boxList = h('div', { class: 'party-list' });
    for (const m of run.box) boxList.append(memberRow(run, m, [
      smallBtn('To party', () => { moveMember(run, m.uid, 'party'); save(); rerender(); }, run.party.length >= ARENA.partyMax),
      smallBtn('Info', () => openSheet(m.genome)),
    ]));
    root.append(...section(`Box · ${run.box.length}`, boxList));
  }
}

function startArenaBattle(root, run) {
  let built;
  try { built = buildBattle(run); } catch (e) { toast(e.message); return; }
  save();
  clear(root);
  const host = h('div');
  root.append(h('div', { class: 'floor-head compact' }, h('b', {}, `Floor ${run.floor} · ${run.encounter.name}`)), host);
  ar.fight = mountFight(host, {
    state: built.state, events: built.events, names: ['You', run.encounter.name], wild: run.encounter.capturable, fast: ar.save.settings.fast,
    onEnd: (state) => {
      const { report } = applyBattle(run, state);
      if (report.captured) recordCollection(ar.save, report.captured.genome, report.floor);
      ar.showReport = true;
      save();
      return { xp: report.xpGains || [] };
    },
    resultButtons: [{ label: 'Continue', primary: true, onclick: () => renderArenaScreen(root) }],
  });
}

      h('div', { class: 'sheet-head' }, h('h2', {}, child.name), typeChips(child.types)),
      h('p', { class: 'meta' }, `gen ${child.gen} · ${child.parents.join(' × ')}`),
      h('div', { class: 'hero' }, creatureEl(child, { size: 240, fit: true })),
      h('div', { class: 'row wrap' },
        h('button', { class: 'btn primary', type: 'button', onclick: () => {
          const { child: member } = fuseMembers(run, pick.a, pick.b);
          recordCollection(ar.save, member.genome, run.floor);
          addToPool(member.genome);
          ar.altar = null; save(); toast(`${member.genome.name} is born!`); rerender();
        } }, 'Fuse them'),
        h('button', { class: 'btn', type: 'button', onclick: () => openSheet(child) }, 'Details'))) : null,
    h('div', { class: 'row wrap' }, h('button', { class: 'btn', type: 'button', onclick: () => { skipAltar(run); ar.altar = null; save(); rerender(); } }, 'Leave without fusing')),
  ]);
}

// ---- game over --------------------------------------------------------------

function gameOverView(root, run) {
  const rerender = () => renderArenaScreen(root);
  const fallen = h('div', { class: 'pool' });
  for (const m of [...run.party, ...run.box]) fallen.append(h('button', { class: 'pcard', type: 'button', onclick: () => openSheet(m.genome) }, creatureEl(m.genome, { size: 104, animate: false }), h('span', {}, `${m.genome.name} · Lv ${m.level}`)));
  root.append(
    h('div', { class: 'hero-card' },
      h('h2', {}, `Run over on floor ${run.floor}`),
      h('p', { class: 'hint' }, `${run.stats.battles} battles · ${run.stats.captures} caught · ${run.stats.fusions} fused · ${run.stats.bosses} wardens beaten`),
      h('button', { class: 'btn primary fuse-btn', type: 'button', onclick: () => { endRun(ar.save); save(); rerender(); } }, 'Retire the team and return')),
    ...section('Your team', h('p', { class: 'hint' }, 'They join the collection, and you can still fuse them in the Fusion Lab.'), fallen),
  );
}

// ---- src/ui/main.js ----
// App shell: header, tabs, hash routing between screens.










const SCREENS = [
  { id: 'arena', title: 'Arena', render: renderArenaScreen },
  { id: 'battle', title: 'Battle', render: renderBattleScreen },
  { id: 'fusion', title: 'Fusion', render: renderFusionScreen },
  { id: 'lab', title: 'Lab', render: renderLabScreen },
  { id: 'parts', title: 'Parts', render: renderPartsScreen },
];

function bootApp() {
  const app = document.getElementById('app');
  clear(app);
  const nav = h('nav', { class: 'tabs', role: 'tablist' });
  const main = h('main', { class: 'screen' });
  try { setSfxEnabled(localStorage.getItem('creaturecollector.sfx') !== 'off'); } catch { /* default on */ }
  const soundBtn = h('button', { class: 'btn small sound', type: 'button', 'aria-label': 'Toggle sound', onclick: () => {
    setSfxEnabled(!sfxEnabled());
    try { localStorage.setItem('creaturecollector.sfx', sfxEnabled() ? 'on' : 'off'); } catch { /* ignore */ }
    soundBtn.textContent = sfxEnabled() ? '🔊' : '🔇';
    if (sfxEnabled()) sfx.tap();
  } }, sfxEnabled() ? '🔊' : '🔇');
  app.append(
    h('header', { class: 'topbar' }, h('h1', {}, 'Creature Collector'), h('span', { class: 'ver' }, `${SPECIES.length} species · ${partCount()} parts`), soundBtn),
    nav, main,
  );
  document.addEventListener('click', (e) => { if (e.target.closest('button') && !e.target.closest('.sound')) sfx.tap(); }, { capture: true });

  function go(id) {
    const screen = SCREENS.find((s) => s.id === id && !s.soon) || SCREENS[0];
    closeSheet();
    clear(nav);
    for (const s of SCREENS) {
      nav.append(h('button', {
        class: 'tab', role: 'tab', type: 'button', disabled: s.soon, 'aria-selected': String(s === screen),
        onclick: () => { location.hash = s.id; },
      }, s.title, s.soon ? h('small', {}, 'soon') : null));
    }
    screen.render(main);
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', () => go(location.hash.slice(1)));
  go(location.hash.slice(1));
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootApp);
else bootApp();

})();
</script>
